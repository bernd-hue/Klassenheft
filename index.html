<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Klassenheft">

<title>Klassenheft</title>
<style>
  :root{
    --black:#000000; --white:#ffffff;
    --red:#B3241C; --red-bg:#FBEAEA;
    --green:#3B6E2E; --green-bg:#EAF3E7;
    --blue:#185FA5; --blue-bg:#E6F1FB;
    --neutral:#4A4943; --neutral-bg:#F1EFE8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family: Arial, Helvetica, sans-serif;
    background:#ffffff;
    margin:0;
    color:#000000;
  }
  #frame{
    zoom: var(--skala, 1);
    width:100%;
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    min-height:100vh;
    background:#ffffff;
    display:flex;
    flex-direction:column;
  }
  @media (min-width:560px){
    body{ background:#e5e5e5; }
    #frame{
      margin:24px auto;
      min-height:calc(100vh - 48px);
      min-height:calc(100dvh - 48px);
      border:2px solid #000000;
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 4px 18px rgba(0,0,0,0.15);
    }
  }
  #content{flex:1;}
  .header{padding:14px 16px 10px; border-bottom:2px solid #000000;}
  .header .title{font-size:17px; font-weight:bold; display:flex; align-items:center; gap:8px;}
  .header .sub{font-size:12px; margin-top:2px; color:#000000;}
  .back{cursor:pointer; font-size:18px; font-weight:bold; user-select:none;}
  .label{font-size:11px; font-weight:bold; letter-spacing:0.03em; padding:8px 16px 4px;}
  .row{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid #000000; cursor:pointer;}
  .row:last-child{border-bottom:2px solid #000000;}
  .row .name{font-size:15px; font-weight:bold;}
  .row .sub{font-size:12px; margin-top:2px;}
  .chev{font-size:18px; font-weight:bold;}
  .footer{border-top:2px solid #000000; padding:10px 16px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  button{
    font-family:inherit; font-size:13px; font-weight:bold; cursor:pointer;
    background:#ffffff; border:1.5px solid #000000; border-radius:6px; padding:8px 14px; color:#000000;
  }
  button.green{background:var(--green-bg); border-color:var(--green); color:var(--green);}
  button.red{background:var(--red-bg); border-color:var(--red); color:var(--red);}
  button.ghost{border:none; background:none; text-decoration:underline; padding:4px; font-weight:normal;}
  button.ghost.small{font-size:16px; padding:2px 6px; text-decoration:none;}
  button:disabled{opacity:0.35; cursor:default;}
  input[type=text], input[type=number], select{
    font-family:inherit; font-size:14px; padding:8px; border:1.5px solid #000000; border-radius:6px; width:100%; margin-bottom:10px;
  }
  form{padding:16px;}
  .field-label{font-size:12px; font-weight:bold; margin-bottom:4px; display:block;}
  .avatar{
    width:56px; height:56px; border-radius:50%; border:2px solid #000000;
    display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:15px; flex-shrink:0;
  }
  .avatar.small{width:38px; height:38px; font-size:12px; border-width:1.5px;}
  .stats{display:flex; border-bottom:2px solid #000000;}
  .stat{flex:1; padding:12px 8px; text-align:center;}
  .stat:first-child{border-right:1px solid #000000;}
  .stat .val{font-size:22px; font-weight:bold;}
  .stat .lbl{font-size:10px;}
  .val.red{color:var(--red);}
  .val.green{color:var(--green);}
  .entry{display:flex; align-items:center; gap:8px; padding:9px 16px; border-bottom:1px solid #000000; font-size:13px;}
  .entry .txt{flex:1;}
  .entry .date{font-size:11px;}
  .entry.positiv{color:var(--green);}
  .entry.negativ{color:var(--red);}
  .catdot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .badge{font-size:10px; border:1px solid #000000; border-radius:4px; padding:1px 6px; font-weight:bold; white-space:nowrap;}
  .grade{font-size:14px; font-weight:bold;}
  .slider-row{padding:12px 16px; border-bottom:1px solid #000000;}
  .slider-row .top{display:flex; justify-content:space-between; font-size:13px; font-weight:bold; margin-bottom:6px;}
  input[type=range]{width:100%;}
  .thumb{width:64px; height:64px; object-fit:cover; border:1.5px solid #000000; border-radius:6px;}
  .assign-bar{padding:10px 16px; border-bottom:2px solid #000000; background:#f5f5f5; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .helptext{font-size:11px; padding:8px 16px; color:#000000;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; padding:8px 16px 4px;}
  .chip{font-size:11px; font-weight:bold; border:1.5px solid #000000; border-radius:20px; padding:5px 11px; cursor:pointer; background:#fff;}
  .grade-row{display:flex; gap:6px; padding:8px 16px 4px;}
  .grade-tile{flex:1; min-width:0; aspect-ratio:1/1; border-radius:8px; border:1.5px solid #000000; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:bold; cursor:pointer;}
  .comp-item{display:flex; align-items:center; gap:8px; padding:8px 16px; border-bottom:1px solid #000000; font-size:13px;}
  .comp-check{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px;}
  #tabbar{display:flex; border-top:2px solid #000000; flex-shrink:0; position:sticky; bottom:0; background:#fff;}
  .tabbtn{flex:1; text-align:center; padding:10px 4px 8px; font-size:11px; font-weight:bold; cursor:pointer; border-top:3px solid transparent; color:#000000; background:#fff;}
  .tabbtn.active{border-top-width:3px;}

  /* Erinnerung an die Wochensicherung */
  .banner{padding:10px 16px; border-bottom:2px solid #000000; background:#FFF6DA; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .banner .txt{font-size:12px; flex:1; min-width:180px;}

  /* Foto-Avatar */
  .avatar{overflow:hidden; background:#ffffff;}
  .avatar img{width:100%; height:100%; object-fit:cover; display:block;}

  /* Eigene Beurteilungen: Farbwahl */
  .swatches{display:flex; gap:8px; flex-wrap:wrap; padding:4px 0 10px;}
  .swatch{width:26px; height:26px; border-radius:50%; border:2px solid #000000; cursor:pointer;}
  .swatch.off{border-color:#bbbbbb;}

  /* ---------- AUSDRUCK ELTERNSPRECHTAG ----------
     Am Bildschirm unsichtbar, beim Drucken wird nur dieser Bereich ausgegeben. */
  #printArea{display:none;}
  .pr-page{page-break-after:always;}
  .pr-page:last-child{page-break-after:auto;}
  .pr-head{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #000000; padding-bottom:4mm; margin-bottom:5mm;}
  .pr-h1{font-size:16pt; font-weight:bold; margin:0;}
  .pr-meta{font-size:9pt; text-align:right;}
  .pr-h2{font-size:11pt; font-weight:bold; margin:6mm 0 2mm; border-bottom:1px solid #000000; padding-bottom:1mm;}
  .pr-tbl{width:100%; border-collapse:collapse; font-size:10pt;}
  .pr-tbl th, .pr-tbl td{border:1px solid #000000; padding:2mm 2.5mm; text-align:left; vertical-align:top;}
  .pr-tbl th{background:#eeeeee; font-size:9pt;}
  .pr-kpi{display:flex; gap:0; border:1px solid #000000; margin-bottom:4mm;}
  .pr-kpi div{flex:1; padding:3mm; text-align:center; border-right:1px solid #000000;}
  .pr-kpi div:last-child{border-right:none;}
  .pr-kpi .v{font-size:16pt; font-weight:bold;}
  .pr-kpi .l{font-size:8pt;}
  .pr-note{font-size:9pt; margin-top:4mm;}
  .pr-sign{margin-top:12mm; display:flex; gap:12mm; font-size:9pt;}
  .pr-sign div{flex:1; border-top:1px solid #000000; padding-top:1.5mm;}
  @media print{
    body{background:#ffffff !important; margin:0;}
    #frame{display:none !important;}
    #printArea{display:block !important;}
    @page{ size:A4; margin:16mm 14mm; }
  }
</style>
</head>
<body>
<div id="frame">
  <div id="content"></div>
  <div id="tabbar"></div>
</div>
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="importInput" accept="application/json" style="display:none">

<div id="printArea"></div>

<script>
/* ==========================================================================
   KLASSENHEFT

   Diese eine Datei ist die ganze App. Es braucht nichts weiter, kein Internet
   und keine Installation.

   ---------------------------------------------------------------------
   HIER DARFST DU GEFAHRLOS SELBST ÄNDERN
   ---------------------------------------------------------------------
   Alles bis zur dicken Trennlinie weiter unten ist zum Anpassen gedacht:
   Farben, Bezeichnungen, Bewertungsvorlagen und Notenschlüssel. Eine
   ausführliche Anleitung dazu liegt als Bastelanleitung.md daneben.

   Drei Regeln, dann kann nichts passieren:
   1. Vorher in der App auf "Jetzt sichern" tippen.
   2. Immer nur den Text zwischen den Anführungszeichen ändern, nie die
      Schlüsselwörter davor. Aus  schularbeit: "Schularbeit"  darf
      schularbeit: "Schularbeit neu"  werden, aber niemals
      Schularbeit: "Schularbeit".
   3. Kommas und geschweifte Klammern stehen lassen.

   Die eingetragenen Noten hängen an den Schlüsselwörtern, nicht an den
   Bezeichnungen. Umbenennen kostet also keine Daten.

   ACHTUNG: Die Datei nach dem Ändern am selben Ort speichern, unter dem
   gleichen Namen. Dann findet die App ihre Daten wieder.
   ========================================================================== */

/* Die Fassung. Bitte hochzählen, wenn du etwas geändert hast. Die App legt
   dann beim nächsten Start von selbst eine Sicherheitskopie an. */
const APP_FASSUNG = "6";

/* Der Ort im Gerät, an dem die Daten liegen. Nicht ändern, sonst findet die
   App die schon eingetragenen Noten nicht mehr. */
const STORAGE_KEY = "klassenheft_daten_v1";

/* Drei Reiter: Team ist bewusst entfernt (kein Sync geplant, siehe Projektnotizen) */
const TAB_COLORS = {
  home:          { bg:"#EAF3E7", fg:"#3B6E2E", label:"Home" },
  statistik:     { bg:"#E6F1FB", fg:"#185FA5", label:"Statistik" },
  einstellungen: { bg:"#F1EFE8", fg:"#4A4943", label:"Einstellungen" }
};

const CAT_COLORS = {
  schularbeit:  { fg:"#185FA5", bg:"#E6F1FB" },
  diktat:       { fg:"#8A4B2A", bg:"#F6ECE5" },
  grammatik:    { fg:"#55606E", bg:"#ECEEF1" },
  rechtschreib: { fg:"#7A3E6B", bg:"#F5EAF2" },
  mitarbeit:    { fg:"#1B7A72", bg:"#E3F3F1" },
  kompetenz:    { fg:"#6B4FA0", bg:"#F0EBFA" },
  hausuebung:   { fg:"#9C7A2E", bg:"#F6EFDC" }
};

const CAT_LABELS = {
  schularbeit:  "Schularbeit",
  diktat:       "Diktat",
  grammatik:    "Grammatik-WH",
  rechtschreib: "Rechtschreib-Überprüfung",
  mitarbeit:    "Mitarbeit",
  kompetenz:    "Kompetenz-Check",
  hausuebung:   "Hausübung"
};

/* Kurzlabels für enge Stellen wie Chips und Filter */
const CAT_SHORT = {
  schularbeit:  "Schularbeit",
  diktat:       "Diktat",
  grammatik:    "Grammatik",
  rechtschreib: "Rechtschreibung",
  mitarbeit:    "Mitarbeit",
  kompetenz:    "Kompetenz",
  hausuebung:   "Hausübung"
};

const CAT_ORDER = ["schularbeit","diktat","grammatik","rechtschreib","mitarbeit","kompetenz","hausuebung"];

const DEFAULT_CATS = ["schularbeit","mitarbeit","kompetenz","hausuebung"];
const DEFAULT_WEIGHTS = { schularbeit: 2.0, mitarbeit: 0.5, kompetenz: 1.0, hausuebung: 0.3 };

/* ---------- BEWERTUNGSVORLAGEN JE FACH ----------
   mode "multiplikator": jede Note zählt mit ihrem eigenen Faktor
   mode "prozent":       jede Kategorie hat einen Anteil an der Gesamtnote. Innerhalb der
                         Kategorie wird zuerst gemittelt, dann mit dem Anteil verrechnet.
                         Kategorien ohne Note fallen heraus, ihr Anteil verteilt sich
                         proportional auf die übrigen.
   Die drei Deutsch-Varianten stammen aus der Vorlage der Deutschkollegin (Juli 2026). */
const SUBJECT_TEMPLATES = {
  allgemein: {
    label: "Allgemein",
    note:  "Faktor je Note. Schularbeit zählt doppelt, Mitarbeit halb.",
    mode:  "multiplikator",
    cats:  ["schularbeit","mitarbeit","kompetenz","hausuebung"],
    weights: { schularbeit:2.0, mitarbeit:0.5, kompetenz:1.0, hausuebung:0.3 }
  },
  deutsch1: {
    label: "Deutsch Variante 1",
    note:  "Schularbeiten 40 %, Hausübung + Mitarbeit + Diktate 60 % (je 20 %).",
    mode:  "prozent",
    cats:  ["schularbeit","diktat","mitarbeit","hausuebung"],
    weights: { schularbeit:40, diktat:20, mitarbeit:20, hausuebung:20 }
  },
  deutsch2: {
    label: "Deutsch Variante 2",
    note:  "Schularbeiten 50 %, Grammatik-WH 15 %, Rechtschreib-Überprüfung 15 %, Mitarbeit 10 %, Hausübung 10 %.",
    mode:  "prozent",
    cats:  ["schularbeit","grammatik","rechtschreib","mitarbeit","hausuebung"],
    weights: { schularbeit:50, grammatik:15, rechtschreib:15, mitarbeit:10, hausuebung:10 }
  },
  deutsch3: {
    label: "Deutsch Variante 3",
    note:  "Schularbeiten 50 %, Mitarbeit 50 % (davon 10 % Diktate, 45 % Hausübung, 45 % mündlich).",
    mode:  "prozent",
    cats:  ["schularbeit","diktat","mitarbeit","hausuebung"],
    weights: { schularbeit:50, diktat:5, mitarbeit:22.5, hausuebung:22.5 }
  },
  mathematik: {
    label: "Mathematik",
    note:  "Schularbeiten 60 %, Mitarbeit 25 %, Hausübung 15 %. Kompetenz-Check zusätzlich einschaltbar.",
    mode:  "prozent",
    cats:  ["schularbeit","mitarbeit","hausuebung"],
    weights: { schularbeit:60, mitarbeit:25, hausuebung:15 }
  },
  nebenfachTest: {
    label: "Nebenfach mit Tests",
    note:  "Für Geografie, Geschichte, Biologie, Physik und ähnliche Fächer: Test 50 %, Mitarbeit 35 %, Hausübung 15 %.",
    mode:  "prozent",
    cats:  ["x_test","mitarbeit","hausuebung"],
    weights: { x_test:50, mitarbeit:35, hausuebung:15 },
    customCats: [{ key:"x_test", label:"Test", short:"Test", fg:"#2E6B5A", bg:"#E4F0EC" }]
  },
  nebenfachPraktisch: {
    label: "Nebenfach praktisch",
    note:  "Für Sport, Musik, Werken und Bildnerische Erziehung: praktische Leistung 60 %, Mitarbeit und Einsatz 40 %.",
    mode:  "prozent",
    cats:  ["x_praktisch","mitarbeit"],
    weights: { x_praktisch:60, mitarbeit:40 },
    customCats: [{ key:"x_praktisch", label:"Praktische Leistung", short:"Praktisch", fg:"#A05A1F", bg:"#F7EDE2" }]
  }
};

/* Farbvorrat für selbst angelegte Beurteilungen. Bewusst dezent und deutlich
   unterscheidbar von den fest eingebauten Kategorien. */
const CUSTOM_COLORS = [
  { fg:"#2E6B5A", bg:"#E4F0EC" },
  { fg:"#A05A1F", bg:"#F7EDE2" },
  { fg:"#42528C", bg:"#EAEDF7" },
  { fg:"#8C3B3B", bg:"#F7EAEA" },
  { fg:"#5C6B21", bg:"#EFF2E1" },
  { fg:"#6E4A7A", bg:"#F1EAF5" }
];

/* ---------- NOTENSCHLÜSSEL (Vorlage Deutschkollegin) ----------
   Diktat: geübtes Diktat, Textlänge ca. 45 bis 65 Wörter, Bewertung nach Fehleranzahl.
   Die 1. Klasse kennt noch keine Leistungsniveaus, ab der 2. Klasse Standard AHS / Standard. */
const DIKTAT_KEYS = {
  stufe1:   [[1,1],[3,2],[5,3],[7,4],[Infinity,5]],
  ahs:      [[1,1],[3,2],[5,3],[7,4],[Infinity,5]],
  standard: [[5,1],[7,2],[9,3],[11,4],[Infinity,5]]
};

/* Prozentschlüssel für Schularbeit, Grammatik-WH, Rechtschreib-Überprüfung und
   Informationsfeststellung. Die 1. Klasse nutzt laut Vorlage denselben Schlüssel. */
const PROZENT_KEYS = {
  stufe1:   [[90,1],[77,2],[64,3],[25,4],[0,5]],
  ahs:      [[90,1],[77,2],[64,3],[51,4],[0,5]],
  standard: [[64,1],[51,2],[37,3],[25,4],[0,5]]
};

const NIVEAU_LABELS = { ahs: "Standard AHS", standard: "Standard" };

/* ==========================================================================
   AB HIER BEGINNT DIE TECHNIK
   Ab dieser Zeile besser nichts mehr ändern, außer du weißt, was du tust.
   ========================================================================== */

/* ---------- SEMESTER ----------
   Das Schuljahr wird in zwei Zeiträume getrennt. Jeder Eintrag merkt sich,
   in welches Semester er gehört. Ältere Einträge ohne diese Angabe werden
   aus ihrem Datum abgeleitet: September bis Jänner gehört zum ersten,
   Februar bis Juli zum zweiten Semester. */

const SEM_LABELS = { 1: "1. Semester", 2: "2. Semester", alle: "Ganzes Jahr" };

function semesterAusMonat(monat){
  return (monat >= 8 || monat <= 1) ? 1 : 2;
}

function semesterHeute(){ return semesterAusMonat(new Date().getMonth() + 1); }

/* Erwartet die in der App gespeicherte Schreibweise "12.09." */
function semesterAusDatum(text){
  const m = String(text || "").match(/^\s*\d{1,2}\.\s*(\d{1,2})\./);
  return m ? semesterAusMonat(parseInt(m[1], 10)) : 1;
}

function eintragSemester(e){
  if(e.sem === 1 || e.sem === 2) return e.sem;
  return semesterAusDatum(e.date);
}

function aktivesSemester(){
  const s = state && state.settings ? state.settings.semester : null;
  return (s === 1 || s === 2 || s === "alle") ? s : semesterHeute();
}

/* Semester, in das ein neuer Eintrag kommt. Steht die Ansicht auf
   "Ganzes Jahr", entscheidet das heutige Datum. */
function semesterFuerNeu(){
  const s = aktivesSemester();
  return (s === 1 || s === 2) ? s : semesterHeute();
}

function semesterLabel(){ return SEM_LABELS[aktivesSemester()]; }

/* Kategorien, für die es einen Notenschlüssel gibt */
const PROZENT_CATS = ["schularbeit","grammatik","rechtschreib"];

function stufeFromKlasse(name){
  const m = String(name || "").match(/\d/);
  return m && m[0] === "1" ? 1 : 2;
}

function schluesselKey(cls, student){
  if((cls.stufe || 2) === 1) return "stufe1";
  return (student && student.niveau === "standard") ? "standard" : "ahs";
}

function noteFromFehler(fehler, key){
  const tbl = DIKTAT_KEYS[key] || DIKTAT_KEYS.ahs;
  for(let i = 0; i < tbl.length; i++){ if(fehler <= tbl[i][0]) return tbl[i][1]; }
  return 5;
}

function noteFromProzent(prozent, key){
  const tbl = PROZENT_KEYS[key] || PROZENT_KEYS.ahs;
  for(let i = 0; i < tbl.length; i++){ if(prozent >= tbl[i][0]) return tbl[i][1]; }
  return 5;
}

function schluesselText(kind, key){
  if(kind === "fehler"){
    const t = DIKTAT_KEYS[key];
    return "0 bis " + t[0][0] + " = 1 &middot; bis " + t[1][0] + " = 2 &middot; bis " + t[2][0] + " = 3 &middot; bis " + t[3][0] + " = 4 &middot; ab " + (t[3][0]+1) + " = 5";
  }
  const t = PROZENT_KEYS[key];
  return "ab " + t[0][0] + " % = 1 &middot; ab " + t[1][0] + " % = 2 &middot; ab " + t[2][0] + " % = 3 &middot; ab " + t[3][0] + " % = 4 &middot; darunter = 5";
}

function stufeLabel(cls){ return (cls.stufe || 2) === 1 ? "1. Klasse" : "2. bis 4. Klasse"; }

/* ---------- KATEGORIEN ----------
   Sieben fest eingebaute Kategorien plus beliebig viele, die die Lehrkraft
   selbst anlegt. Selbst angelegte hängen am Fach (sub.customCats) und haben
   Schlüssel, die mit "x_" beginnen. */

function customCats(sub){ return (sub && Array.isArray(sub.customCats)) ? sub.customCats : []; }

function isCustomCat(key){ return String(key || "").indexOf("x_") === 0; }

function allCatKeys(sub){ return CAT_ORDER.concat(customCats(sub).map(c => c.key)); }

function findCustom(sub, key){ return customCats(sub).find(c => c.key === key); }

function catLabel(sub, key){
  const c = findCustom(sub, key);
  return c ? c.label : (CAT_LABELS[key] || key);
}

function catShort(sub, key){
  const c = findCustom(sub, key);
  return c ? (c.short || c.label) : (CAT_SHORT[key] || key);
}

function catCol(sub, key){
  const c = findCustom(sub, key);
  if(c) return { fg: c.fg, bg: c.bg };
  return CAT_COLORS[key] || { fg:"#000000", bg:"#ffffff" };
}

/* Bezeichnung einer Note. Sie hängt an der Kategorie, damit eine umbenannte
   eigene Beurteilung überall mitwandert. Für Altbestände, deren Kategorie es
   nicht mehr gibt, greift der beim Eintragen gespeicherte Text. */
function noteBezeichnung(sub, n){
  if(findCustom(sub, n.cat) || CAT_LABELS[n.cat]) return catLabel(sub, n.cat);
  return n.label || "Note";
}

function activeCats(sub){
  const list = (sub && Array.isArray(sub.cats) && sub.cats.length) ? sub.cats : DEFAULT_CATS;
  return allCatKeys(sub).filter(k => list.indexOf(k) !== -1);
}

function isProzentMode(sub){ return sub && sub.weightMode === "prozent"; }

/* Eigene Beurteilungen bekommen den Prozent- und Punkteschlüssel automatisch,
   damit ein Test oder ein Referat direkt über Punkte eingegeben werden kann.
   Die Notenkacheln bleiben daneben immer bedienbar. */
function hasSchluessel(cat){ return cat === "diktat" || PROZENT_CATS.indexOf(cat) !== -1 || isCustomCat(cat); }

/* Kurzform für die schmalen Auswahlchips. Erst sehr lange Namen werden
   gekürzt, damit gebräuchliche Bezeichnungen wie Lernzielkontrolle
   vollständig lesbar bleiben. */
function kurzName(name){
  const t = String(name || "").trim();
  return t.length > 20 ? t.slice(0, 19) + "." : t;
}

function nextCustomColor(sub){
  const belegt = customCats(sub).map(c => c.fg);
  return CUSTOM_COLORS.find(c => belegt.indexOf(c.fg) === -1) || CUSTOM_COLORS[belegt.length % CUSTOM_COLORS.length];
}

function defaultCompetencies(fach){
  const f = (fach || "").toLowerCase();
  if(f.indexOf("mathe") !== -1) return ["Grundrechnungsarten","Bruchrechnung","Prozentrechnung","Textaufgaben","Geometrie"];
  if(f.indexOf("deutsch") !== -1) return ["Rechtschreibung","Grammatik","Leseverstehen","Textproduktion"];
  if(f.indexOf("englisch") !== -1) return ["Vocabulary","Grammar","Listening","Speaking"];
  if(f.indexOf("geografie") !== -1 || f.indexOf("geographie") !== -1) return ["Karten lesen","Klima und Vegetation","Wirtschaft","Österreich und Europa"];
  if(f.indexOf("geschichte") !== -1) return ["Quellen deuten","Zeitleiste","Ursache und Wirkung","Politische Bildung"];
  if(f.indexOf("sport") !== -1 || f.indexOf("bewegung") !== -1 || f.indexOf("turnen") !== -1) return ["Ausdauer","Koordination","Ballspiele","Turnen","Fairness im Team"];
  return ["Kompetenz A","Kompetenz B","Kompetenz C"];
}

/* Vorschlag der Bewertungsvorlage anhand des eingetippten Fachnamens.
   Immer nur ein Vorschlag, die Lehrkraft kann jede Vorlage wählen. */
function templateKeyForFach(fach){
  const f = String(fach || "").toLowerCase();
  if(f.indexOf("deutsch") !== -1) return "deutsch3";
  if(f.indexOf("mathe") !== -1) return "mathematik";
  if(/sport|bewegung|turnen|musik|werken|technisch|bildner|zeichn|kochen|ernährung|ernaehrung/.test(f)) return "nebenfachPraktisch";
  if(/geografie|geographie|geschichte|biologie|physik|chemie|politische|gw|informatik|religion/.test(f)) return "nebenfachTest";
  return "allgemein";
}

function applyTemplate(sub, key){
  const t = SUBJECT_TEMPLATES[key] || SUBJECT_TEMPLATES.allgemein;
  sub.template = key;
  sub.weightMode = t.mode;
  sub.cats = t.cats.slice();
  sub.weights = Object.assign({}, t.weights);
  /* Eigene Kategorien der Vorlage ergänzen, bereits vorhandene bleiben erhalten,
     damit schon eingetragene Noten ihre Kategorie behalten. */
  if(!Array.isArray(sub.customCats)) sub.customCats = [];
  (t.customCats || []).forEach(c => {
    if(!sub.customCats.some(x => x.key === c.key)) sub.customCats.push(Object.assign({}, c));
  });
  return sub;
}

/* ---------- PERSISTENZ UND MIGRATION ----------
   Datenmodell: eine Klasse hält die Namen genau einmal, die Fächer hängen daran.
   Ältere Datenstände (Namen je Fach doppelt) werden beim Laden zusammengeführt. */

function normaliseClass(cls){
  if(!cls.id) cls.id = uid();
  if(!cls.name) cls.name = "Klasse";
  if(cls.stufe !== 1 && cls.stufe !== 2) cls.stufe = stufeFromKlasse(cls.name);
  if(!Array.isArray(cls.students)) cls.students = [];
  cls.students.forEach(s => {
    if(!s.id) s.id = uid();
    if(s.niveau !== "standard" && s.niveau !== "ahs") s.niveau = "ahs";
    if(typeof s.photo !== "string") s.photo = null;
    if(typeof s.updatedAt !== "number") s.updatedAt = 0;
  });
  if(!Array.isArray(cls.subjects)) cls.subjects = [];
  cls.subjects.forEach(sub => {
    if(!sub.id) sub.id = uid();
    if(!sub.fach) sub.fach = "Fach";
    if(!sub.template) sub.template = "allgemein";
    if(sub.weightMode !== "prozent") sub.weightMode = "multiplikator";
    if(!Array.isArray(sub.customCats)) sub.customCats = [];
    sub.customCats.forEach(c => {
      if(!c.key) c.key = "x_" + uid();
      if(!c.label) c.label = "Eigene Beurteilung";
      if(!c.short) c.short = c.label;
      if(!c.fg) c.fg = CUSTOM_COLORS[0].fg;
      if(!c.bg) c.bg = CUSTOM_COLORS[0].bg;
    });
    if(!Array.isArray(sub.cats) || !sub.cats.length) sub.cats = DEFAULT_CATS.slice();
    if(!sub.weights || typeof sub.weights !== "object") sub.weights = Object.assign({}, DEFAULT_WEIGHTS);
    activeCats(sub).forEach(k => {
      if(typeof sub.weights[k] !== "number") sub.weights[k] = isProzentMode(sub) ? 10 : 1;
    });
    if(!Array.isArray(sub.competencies)) sub.competencies = defaultCompetencies(sub.fach);
    if(!Array.isArray(sub.entries)) sub.entries = [];
    sub.entries.forEach(e => {
      if(!e.id) e.id = uid();
      /* Zeitstempel wird für das Zusammenführen zweier Geräte gebraucht.
         Ältere Einträge ohne Stempel bekommen 0 und verlieren damit nie
         gegen eine neuere Fassung desselben Eintrags. */
      if(typeof e.ts !== "number") e.ts = 0;
      /* Semester einmalig aus dem Datum ableiten, danach bleibt es fest */
      if(e.sem !== 1 && e.sem !== 2) e.sem = semesterAusDatum(e.date);
    });
  });
  return cls;
}

/* Grundeinstellungen der App, unabhängig von den Klassen */
function defaultSettings(){
  return { lehrkraft: "", schuljahr: "", lastBackup: null, intervallTage: 7, geraet: "", semester: semesterHeute(), schrift: "normal" };
}

function normaliseSettings(s){
  const d = defaultSettings();
  if(!s || typeof s !== "object") return d;
  return {
    lehrkraft: typeof s.lehrkraft === "string" ? s.lehrkraft : d.lehrkraft,
    schuljahr: typeof s.schuljahr === "string" ? s.schuljahr : d.schuljahr,
    lastBackup: typeof s.lastBackup === "string" ? s.lastBackup : null,
    intervallTage: typeof s.intervallTage === "number" && s.intervallTage > 0 ? s.intervallTage : 7,
    geraet: typeof s.geraet === "string" ? s.geraet : "",
    semester: (s.semester === 1 || s.semester === 2 || s.semester === "alle") ? s.semester : semesterHeute(),
    schrift: (s.schrift === "klein" || s.schrift === "gross") ? s.schrift : "normal"
  };
}

function migrate(data){
  const list = Array.isArray(data.classes) ? data.classes : [];
  const einst = normaliseSettings(data.settings);
  const schonNeu = list.every(c => Array.isArray(c.subjects));
  if(schonNeu){
    list.forEach(normaliseClass);
    return { classes: list, settings: einst };
  }

  /* Alter Stand: je Fach eine eigene Klasse mit eigener Namensliste.
     Gleiche Klassenbezeichnung bedeutet dieselbe Klasse, die Namen werden
     über den Namen zusammengeführt. Es geht dabei kein Eintrag verloren. */
  const byName = new Map();
  list.forEach(alt => {
    const name = String(alt.klasse || "Klasse").trim();
    const schluessel = name.toLowerCase();
    let cls = byName.get(schluessel);
    if(!cls){
      cls = { id: uid(), name: name, stufe: (alt.stufe === 1 || alt.stufe === 2) ? alt.stufe : stufeFromKlasse(name), students: [], subjects: [] };
      byName.set(schluessel, cls);
    }
    const modus = alt.weightMode === "prozent" ? "prozent" : "multiplikator";
    const cats = (Array.isArray(alt.cats) && alt.cats.length) ? alt.cats.slice() : DEFAULT_CATS.slice();
    const weights = Object.assign({}, alt.weights || {});
    cats.forEach(k => {
      if(typeof weights[k] !== "number") weights[k] = (modus === "prozent") ? Math.round(100 / cats.length) : 1;
    });
    const sub = {
      id: uid(),
      fach: String(alt.fach || "Fach"),
      template: alt.template || "allgemein",
      weightMode: modus,
      cats: cats,
      weights: weights,
      competencies: Array.isArray(alt.competencies) ? alt.competencies.slice() : defaultCompetencies(alt.fach),
      entries: []
    };
    (alt.students || []).forEach(as => {
      const nm = String(as.name || "").trim();
      let st = cls.students.find(x => x.name.toLowerCase() === nm.toLowerCase());
      if(!st){
        st = { id: as.id || uid(), name: nm, niveau: as.niveau === "standard" ? "standard" : "ahs" };
        cls.students.push(st);
      }
      (as.entries || []).forEach(e => {
        const kopie = Object.assign({}, e);
        kopie.studentId = st.id;
        if(!kopie.id) kopie.id = uid();
        sub.entries.push(kopie);
      });
    });
    cls.subjects.push(sub);
  });
  const classes = Array.from(byName.values());
  classes.forEach(normaliseClass);
  return { classes: classes, settings: einst };
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(data && Array.isArray(data.classes)) return migrate(data);
    }
  }catch(e){}
  return { classes: [], settings: defaultSettings() };
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 4, classes: state.classes, settings: state.settings }));
  }catch(e){
    alert("Speichern hat nicht geklappt. Vermutlich ist der Speicher des Gerätes voll, zum Beispiel durch viele Fotos. Bitte ein Backup exportieren und alte Fotos entfernen.");
  }
}

function uid(){ return Math.random().toString(36).slice(2,9); }

let state = load();
let pendingPhoto = null;

let tab = "home";
let homeView = { screen:"list", classId:null, subjectId:null, studentId:null, noteFilter:"alle", entryType:null,
                 newNoteCat:"schularbeit", newNoteGrade:null, noteBasis:null, noteWeight:1 };
let statView = { screen:"list", classId:null, subjectId:null };
let settingsView = { screen:"list", classId:null, subjectId:null };

function today(){
  const d = new Date();
  return String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + ".";
}

function getClass(id){ return state.classes.find(c => c.id === id); }
function getSubject(cls, id){ return cls ? cls.subjects.find(s => s.id === id) : undefined; }
function getStudent(cls, id){ return cls ? cls.students.find(s => s.id === id) : undefined; }

/* Alle Fächer als flache Liste "Klasse · Fach", so wie der Homescreen aufgebaut ist */
function allSubjectRows(){
  const rows = [];
  state.classes.forEach(c => c.subjects.forEach(s => rows.push({ cls:c, sub:s })));
  return rows;
}

/* Alle Einträge einer Person im gewählten Zeitraum. Ohne Angabe gilt das
   gerade eingestellte Semester, "alle" liefert das ganze Schuljahr. */
function entriesOf(sub, studentId, sem){
  const z = (sem === undefined) ? aktivesSemester() : sem;
  return sub.entries.filter(e => e.studentId === studentId && (z === "alle" || eintragSemester(e) === z));
}

/* Alle Noten eines Fachs im gewählten Zeitraum, über alle Personen */
function notenOf(sub, sem){
  const z = (sem === undefined) ? aktivesSemester() : sem;
  return sub.entries.filter(e => e.type === "note" && (z === "alle" || eintragSemester(e) === z));
}

/* Gewichtung einer einzelnen Note. Ältere Noten ohne eigenes Gewicht verhalten
   sich genau wie vorher, damit sich bestehende Notenschnitte nicht ändern. */
function noteWeight(sub, n){
  if(typeof n.w === "number") return n.w;
  return isProzentMode(sub) ? 1 : (sub.weights[n.cat] ?? 1);
}

function computeSchnitt(sub, studentId, sem){
  const notes = entriesOf(sub, studentId, sem).filter(e => e.type === "note");
  if(notes.length === 0) return null;

  if(isProzentMode(sub)){
    let sum = 0, wsum = 0;
    activeCats(sub).forEach(cat => {
      const inCat = notes.filter(n => n.cat === cat);
      if(!inCat.length) return;
      const anteil = sub.weights[cat] ?? 0;
      if(anteil <= 0) return;
      let s = 0, w = 0;
      inCat.forEach(n => { const nw = noteWeight(sub, n); s += n.value * nw; w += nw; });
      if(w <= 0) return;
      sum += (s / w) * anteil;
      wsum += anteil;
    });
    if(wsum <= 0) return notes.reduce((a,n) => a + n.value, 0) / notes.length;
    return sum / wsum;
  }

  let sum = 0, wsum = 0;
  notes.forEach(n => { const w = noteWeight(sub, n); sum += n.value * w; wsum += w; });
  return wsum > 0 ? sum / wsum : null;
}

function countPosNeg(sub, studentId, sem){
  let pos = 0, neg = 0;
  entriesOf(sub, studentId, sem).forEach(e => { if(e.type === "positiv") pos++; if(e.type === "negativ") neg++; });
  return { pos, neg };
}

function fmt(n){ return n === null ? "-" : n.toFixed(1).replace(".", ","); }
function fmtO(n){ return n === null ? "-" : "Ø " + fmt(n); }
function fmtPct(n){
  if(n === null || isNaN(n)) return "0";
  return (Math.round(n * 10) % 10 === 0 ? String(Math.round(n)) : n.toFixed(1).replace(".", ","));
}
function fmtW(n){ return "×" + Number(n).toFixed(1).replace(".", ","); }

function gradeColor(v){
  if(v <= 2) return { fg:"#3B6E2E", bg:"#EAF3E7" };
  if(v >= 4) return { fg:"#B3241C", bg:"#FBEAEA" };
  return { fg:"#000000", bg:"#FFFFFF" };
}

function gradeFromRatio(ratio){
  if(ratio >= 0.9) return 1;
  if(ratio >= 0.75) return 2;
  if(ratio >= 0.6) return 3;
  if(ratio >= 0.4) return 4;
  return 5;
}

function initials(name){
  return String(name).split(" ").map(p => p[0]).filter(Boolean).slice(0,2).join("").toUpperCase();
}

/* Avatar: Foto, wenn eines hinterlegt ist, sonst die Initialen.
   Fotos liegen als kleines JPEG direkt am Datensatz und bleiben damit
   auf dem Gerät und im Backup. */
function avatarHtml(s, klein){
  const cls = klein ? "avatar small" : "avatar";
  if(s && s.photo) return `<div class="${cls}"><img src="${s.photo}" alt=""></div>`;
  return `<div class="${cls}">${initials(s ? s.name : "")}</div>`;
}

/* ---------- RAHMEN ---------- */

/* Tippt man auf den Reiter, in dem man ohnehin schon ist, geht es zurück
   auf dessen Übersicht. Das ist der übliche Weg, um aus einer Unterseite
   wieder herauszukommen, ohne die Pfeile links oben zu suchen. */
function switchTab(t){
  if(tab === t){
    if(t === "home") homeView.screen = "list";
    else if(t === "statistik") statView.screen = "list";
    else settingsView.screen = "list";
  }
  tab = t;
  render();
}

/* ---------- SEMESTERLEISTE ----------
   Eine einzige Leiste, überall gleich. Sie entscheidet, welcher Zeitraum
   gerechnet, angezeigt, gedruckt und beim Eintragen vergeben wird. */

function semesterLeiste(reiter){
  const farbe = TAB_COLORS[reiter] || TAB_COLORS.home;
  const aktiv = aktivesSemester();
  const chips = [[1, "1. Semester"], [2, "2. Semester"], ["alle", "Ganzes Jahr"]].map(([k, lbl]) => {
    const an = aktiv === k;
    const style = an
      ? `background:${farbe.fg}; border-color:${farbe.fg}; color:#fff;`
      : `background:#fff; border-color:${farbe.fg}; color:${farbe.fg};`;
    return `<div class="chip" style="${style}" onclick="setSemester('${k}')">${lbl}</div>`;
  }).join("");
  return `<div class="chips" style="border-bottom:1px solid #000000; padding-bottom:8px;">${chips}</div>`;
}

function setSemester(wert){
  state.settings.semester = (wert === "alle") ? "alle" : parseInt(wert, 10);
  save();
  render();
}

function render(){
  const content = document.getElementById("content");
  if(tab === "home") content.innerHTML = renderHome();
  else if(tab === "statistik") content.innerHTML = renderStat();
  else content.innerHTML = renderSettings();
  renderTabBar();
}

function renderTabBar(){
  const bar = document.getElementById("tabbar");
  bar.innerHTML = Object.keys(TAB_COLORS).map(k => {
    const c = TAB_COLORS[k];
    const active = tab === k;
    const style = active
      ? `border-top-color:${c.fg}; background:${c.bg}; color:${c.fg};`
      : "border-top-color:transparent;";
    return `<div class="tabbtn ${active ? "active" : ""}" style="${style}" onclick="switchTab('${k}')">${c.label}</div>`;
  }).join("");
}

function headerStyle(t){ return `background:${TAB_COLORS[t].bg};`; }
function titleStyle(t){ return `color:${TAB_COLORS[t].fg};`; }

/* ---------- HOME ---------- */

function goHome(screen, classId, subjectId, studentId){
  homeView.screen = screen;
  if(classId !== undefined && classId !== null) homeView.classId = classId;
  if(subjectId !== undefined && subjectId !== null) homeView.subjectId = subjectId;
  if(studentId !== undefined && studentId !== null) homeView.studentId = studentId;
  if(screen === "student") homeView.noteFilter = "alle";
  if(screen === "newNote"){
    const sub = getSubject(getClass(homeView.classId), homeView.subjectId);
    const cats = activeCats(sub);
    homeView.newNoteCat = cats.indexOf("schularbeit") !== -1 ? "schularbeit" : (cats[0] || "mitarbeit");
    homeView.newNoteGrade = null;
    homeView.noteBasis = null;
    homeView.noteWeight = startWeight(sub, homeView.newNoteCat);
  }
  render();
}

function renderHome(){
  if(homeView.screen === "newSubject") return renderNewSubject();
  if(homeView.screen === "roster") return renderRoster();
  if(homeView.screen === "newStudent") return renderNewStudent();
  if(homeView.screen === "student") return renderStudent();
  if(homeView.screen === "newEntry") return renderNewEntry();
  if(homeView.screen === "newNote") return renderNewNote();
  return renderHomeList();
}

function renderHomeList(){
  const rows = allSubjectRows().map(({cls, sub}) => {
    const avgs = cls.students.map(s => computeSchnitt(sub, s.id)).filter(v => v !== null);
    const schnitt = avgs.length ? avgs.reduce((a,b) => a+b, 0) / avgs.length : null;
    const bad = schnitt !== null && schnitt >= 4.0;
    return `<div class="row" onclick="goHome('roster','${cls.id}','${sub.id}')">
      <div>
        <div class="name">${cls.name} &middot; ${sub.fach}</div>
        <div class="sub">${cls.students.length} Schüler:innen</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="val ${bad ? "red" : ""}" style="font-size:15px; font-weight:bold;">${fmtO(schnitt)}</span>
        <span class="chev" style="${titleStyle("home")}">&rsaquo;</span>
      </div>
    </div>`;
  }).join("");

  return `
    <div class="header" style="${headerStyle("home")}">
      <div class="title" style="${titleStyle("home")}">Klassenheft</div>
      <div class="sub">Klassen und Fächer</div>
    </div>
    ${backupBanner()}
    ${semesterLeiste("home")}
    ${rows || '<div class="helptext">Noch nichts angelegt. Leg unten eine Klasse mit einem Fach an.</div>'}
    <div class="footer">
      <button onclick="goHome('newSubject')">+ Neue Klasse oder Fach</button>
    </div>
  `;
}

function renderNewSubject(){
  /* Gibt es noch keine Klasse, wird die Auswahlliste weggelassen. Sie hätte
     ohnehin nur den einen Eintrag "Neue Klasse anlegen", und das Feld für die
     Bezeichnung muss von Anfang an sichtbar sein. */
  const ersteKlasse = state.classes.length === 0;

  const klassenOpts = state.classes.map(c =>
    `<option value="${c.id}">${esc(c.name)}</option>`).join("");

  /* Die erste Vorlage in der Liste ist beim Öffnen ausgewählt. Ihr
     Erklärungstext muss deshalb auch gleich sichtbar sein. */
  const vorlagenKeys = Object.keys(SUBJECT_TEMPLATES);
  const vorlageJetzt = vorlagenKeys[0];
  const tplOpts = vorlagenKeys.map(k =>
    `<option value="${k}">${SUBJECT_TEMPLATES[k].label}</option>`).join("");
  const tplNotes = vorlagenKeys.map(k =>
    `<div id="tplNote_${k}" style="display:${k === vorlageJetzt ? "block" : "none"};">${SUBJECT_TEMPLATES[k].note}</div>`).join("");

  const klasseFeld = ersteKlasse
    ? `<span class="field-label">Klasse</span>
       <input type="text" id="klasseInput" placeholder="z. B. 2A" required autofocus>`
    : `<span class="field-label">Klasse</span>
       <select id="klasseSelect" onchange="toggleNeueKlasse()">
         ${klassenOpts}
         <option value="__neu">Neue Klasse anlegen</option>
       </select>
       <div id="neueKlasseBox" style="display:none;">
         <span class="field-label">Bezeichnung der neuen Klasse</span>
         <input type="text" id="klasseInput" placeholder="z. B. 3B">
       </div>`;

  return `
    <div class="header" style="${headerStyle("home")}">
      <span class="back" style="${titleStyle("home")}" onclick="goHome('list')">&lsaquo;</span>
      <span class="title" style="${titleStyle("home")}">${ersteKlasse ? "Erste Klasse anlegen" : "Neue Klasse oder Fach"}</span>
    </div>
    <form onsubmit="createSubject(event)">
      ${klasseFeld}
      <span class="field-label">Fach</span>
      <input type="text" id="fachInput" placeholder="z. B. Deutsch" required oninput="suggestTemplate(this.value)">
      <span class="field-label">Bewertung</span>
      <select id="tplSelect" onchange="this.dataset.touched='1'; showTemplateNote();">${tplOpts}</select>
      <button type="submit">Anlegen</button>
    </form>
    <div class="helptext" id="tplNoteBox">${tplNotes}</div>
    <div class="helptext">Die Namen der Schüler:innen gehören zur Klasse, nicht zum Fach. Du tippst sie also nur einmal ein und siehst sie in jedem Fach dieser Klasse wieder. Bewertet wird immer nur im gewählten Fach.</div>
  `;
}

function toggleNeueKlasse(){
  const sel = document.getElementById("klasseSelect");
  const box = document.getElementById("neueKlasseBox");
  if(!sel || !box) return;
  box.style.display = (sel.value === "__neu") ? "block" : "none";
}

function suggestTemplate(fach){
  const sel = document.getElementById("tplSelect");
  if(!sel || sel.dataset.touched === "1") return;
  sel.value = templateKeyForFach(fach);
  showTemplateNote();
}

function showTemplateNote(){
  const sel = document.getElementById("tplSelect");
  if(!sel) return;
  Object.keys(SUBJECT_TEMPLATES).forEach(k => {
    const el = document.getElementById("tplNote_" + k);
    if(el) el.style.display = (k === sel.value) ? "block" : "none";

function createSubject(ev){
  ev.preventDefault();
  const fach = document.getElementById("fachInput").value.trim();
  if(!fach) return;
  /* Beim allerersten Mal gibt es keine Auswahlliste, dann wird immer eine
     neue Klasse angelegt. */
  const auswahl = document.getElementById("klasseSelect");
  const wahl = auswahl ? auswahl.value : "__neu";
  let cls;
  if(wahl === "__neu" || !wahl){
    const feld = document.getElementById("klasseInput");
    const name = feld ? feld.value.trim() : "";
    if(!name){
      alert("Bitte eine Bezeichnung für die Klasse eingeben, zum Beispiel 2A.");
      if(feld) feld.focus();
      return;
    }
    /* Gibt es die Bezeichnung schon, wird die bestehende Klasse verwendet,
       statt eine zweite mit demselben Namen anzulegen. */
    cls = state.classes.find(c => c.name.trim().toLowerCase() === name.toLowerCase());
    if(!cls){
      cls = { id: uid(), name: name, stufe: stufeFromKlasse(name), students: [], subjects: [] };
      state.classes.push(cls);
    }
  } else {
    cls = getClass(wahl);
    if(!cls) return;
  }
  if(cls.subjects.some(s => s.fach.toLowerCase() === fach.toLowerCase())){
    alert("Das Fach " + fach + " gibt es in der Klasse " + cls.name + " schon.");
    return;
  }
  const sub = { id: uid(), fach: fach, competencies: defaultCompetencies(fach), entries: [] };
  applyTemplate(sub, document.getElementById("tplSelect").value);
  cls.subjects.push(sub);
  save();
  goHome("roster", cls.id, sub.id);
}

/* ---------- NOTE EINTRAGEN ----------
   Ein Screen, keine Umschalter: Kategorie wählen, optional den Notenschlüssel
   nutzen, Note antippen, Gewichtung dieser Note einstellen, speichern. */

function startWeight(sub, cat){
  if(isProzentMode(sub)) return 1;
  const w = sub.weights[cat];
  return typeof w === "number" ? w : 1;
}

function selectNoteCat(cat){
  const sub = getSubject(getClass(homeView.classId), homeView.subjectId);
  homeView.newNoteCat = cat;
  homeView.newNoteGrade = null;
  homeView.noteBasis = null;
  homeView.noteWeight = startWeight(sub, cat);
  render();
}

/* Ein Feld für alles: "4" bei Diktat, "82", "82 %", "33/40" oder "33 von 40" sonst */
function parseLeistung(raw, cat, key){
  const t = String(raw || "").trim().replace(",", ".");
  if(!t) return null;
  if(cat === "diktat"){
    const f = parseFloat(t);
    if(isNaN(f) || f < 0) return null;
    const ganz = Math.round(f);
    return { value: noteFromFehler(ganz, key), basis: ganz + " Fehler" };
  }
  const bruch = t.match(/^([\d.]+)\s*(?:\/|von)\s*([\d.]+)$/i);
  if(bruch){
    const a = parseFloat(bruch[1]), b = parseFloat(bruch[2]);
    if(isNaN(a) || isNaN(b) || b <= 0) return null;
    const p = Math.max(0, Math.min(100, a / b * 100));
    return { value: noteFromProzent(p, key), basis: fmtPct(a) + " von " + fmtPct(b) + " Punkten, " + fmtPct(p) + " %" };
  }
  const roh = parseFloat(t.replace("%", ""));
  if(isNaN(roh)) return null;
  const p = Math.max(0, Math.min(100, roh));
  return { value: noteFromProzent(p, key), basis: fmtPct(p) + " %" };
}

function paintTiles(){
  [1,2,3,4,5].forEach(v => {
    const el = document.getElementById("tile_" + v);

    el.style.background = sel ? g.fg : g.bg;
    el.style.borderColor = g.fg;
    el.style.color = sel ? "#fff" : g.fg;
  });
  const btn = document.getElementById("saveNoteBtn");
  if(btn) btn.disabled = (homeView.newNoteGrade === null);
}

function showBasis(){
  const el = document.getElementById("basisHint");
  if(!el) return;
  el.innerHTML = homeView.noteBasis
    ? "Ergibt Note <b>" + homeView.newNoteGrade + "</b> (" + homeView.noteBasis + ")"
    : "";
}

/* Läuft bei jedem Tastendruck, bewusst ohne vollständiges Neuzeichnen,
   damit der Cursor im Feld bleibt. */
function recalcNote(){
  const cls = getClass(homeView.classId);
  const sub = getSubject(cls, homeView.subjectId);
  const s = getStudent(cls, homeView.studentId);
  const feld = document.getElementById("leistungInput");
  const res = parseLeistung(feld ? feld.value : "", homeView.newNoteCat, schluesselKey(cls, s));
  if(res){
    homeView.newNoteGrade = res.value;
    homeView.noteBasis = res.basis;
  } else {
    homeView.newNoteGrade = null;
    homeView.noteBasis = null;
  }
  paintTiles();
  showBasis();
}

  homeView.newNoteGrade = v;
  homeView.noteBasis = null;
  const feld = document.getElementById("leistungInput");
  if(feld) feld.value = "";
  paintTiles();
  showBasis();
}

  homeView.noteWeight = parseFloat(value);

  if(el) el.textContent = fmtW(homeView.noteWeight);

  const cls = getClass(homeView.classId);

  const s = getStudent(cls, homeView.studentId);
  if(!cls || !sub || !s) return renderHomeList();

  const cats = activeCats(sub);
  let cat = homeView.newNoteCat;
  if(cats.indexOf(cat) === -1){ cat = cats[0] || "mitarbeit"; homeView.newNoteCat = cat; homeView.noteWeight = startWeight(sub, cat); }
  const col = catCol(sub, cat);
  const key = schluesselKey(cls, s);

  const chips = cats.map(k => {
    const c = catCol(sub, k);
    const active = k === cat;
    const style = active
      ? `background:${c.fg}; border-color:${c.fg}; color:#fff;`
      : `background:${c.bg}; border-color:${c.fg}; color:${c.fg};`;
    return `<div class="chip" style="${style}" onclick="selectNoteCat('${k}')">${catShort(sub,k)}</div>`;
  }).join("");

  /* Kompetenz-Check bleibt eine Checkliste */
  if(cat === "kompetenz"){
    const boxen = sub.competencies.map(name =>
      `<label class="comp-check"><input type="checkbox" class="compCheck" value="${name}"> ${name}</label>`).join("");
    return `
      <div class="header" style="${headerStyle("home")}">

  let rechner = "";
  if(hasSchluessel(cat)){
    const istDiktat = cat === "diktat";
    rechner = `
      <div class="label" style="color:${col.fg};">${istDiktat ? "FEHLER" : "PROZENT ODER PUNKTE"}</div>
      <div style="padding:0 16px;">

               placeholder="${istDiktat ? "z. B. 4" : "z. B. 82 oder 33/40"}"
               oninput="recalcNote()" autofocus>
      </div>
      <div class="helptext" id="basisHint" style="padding-top:0;"></div>
      <div class="helptext" style="padding-top:0;">Schlüssel ${cls.stufe === 1 ? "1. Klasse" : NIVEAU_LABELS[key === "standard" ? "standard" : "ahs"]}: ${schluesselText(istDiktat ? "fehler" : "prozent", key)}${istDiktat ? "<br>Textlänge laut Vorlage ca. 45 bis 65 Wörter." : ""}<br>Du kannst die Note auch einfach unten antippen.</div>
    `;
  }

  const tiles = [1,2,3,4,5].map(v => {
    const g = gradeColor(v);
    const sel = homeView.newNoteGrade === v;
    const style = sel
      ? `background:${g.fg}; border-color:${g.fg}; color:#fff;`
      : `background:${g.bg}; border-color:${g.fg}; color:${g.fg};`;
    return `<div class="grade-tile" id="tile_${v}" style="${style}" onclick="selectNoteGrade(${v})">${v}</div>`;
  }).join("");

  return `
    <div class="header" style="${headerStyle("home")}">
      <span class="back" style="${titleStyle("home")}" onclick="goHome('student')">&lsaquo;</span>
      <span class="title" style="${titleStyle("home")}">Note eintragen</span>
      <div class="sub">${s.name} &middot; ${sub.fach}${cls.stufe === 1 ? "" : " &middot; " + NIVEAU_LABELS[s.niveau]} &middot; ${SEM_LABELS[semesterFuerNeu()]}</div>
    </div>
    <div class="chips">${chips}</div>
    ${rechner}
    <div class="label">NOTE</div>
    <div class="grade-row">${tiles}</div>
    ${weightSlider(sub, cat)}

      <button type="submit" id="saveNoteBtn" ${homeView.newNoteGrade === null ? "disabled" : ""}>Speichern</button>
    </form>
  `;
}

/* Bilder werden vor dem Speichern verkleinert. Beim Porträt zusätzlich
   quadratisch aus der Mitte beschnitten, damit der runde Avatar passt. */
function verkleinern(file, maxKante, quality, quadratisch, fertig){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      if(quadratisch){
        const kante = Math.min(img.width, img.height);
        canvas.width = maxKante;
        canvas.height = maxKante;
        ctx.drawImage(img, (img.width - kante) / 2, (img.height - kante) / 2, kante, kante, 0, 0, maxKante, maxKante);
      } else {
        const scale = Math.min(1, maxKante / img.width);
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      }
      fertig(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = function(){ alert("Dieses Bild konnte nicht gelesen werden."); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- SICHERUNG ----------
   Zwei Dateien je Sicherung:
   1. eine Word-Datei zum Nachlesen, Ausdrucken und Weiterverwenden
   2. eine JSON-Datei, mit der sich der Stand wieder in die App zurückholen lässt
   Beides bleibt auf dem Gerät, nichts geht ins Internet. */

/* --- ZIP ohne fremde Bibliothek (Speichermethode, keine Komprimierung) --- */

function crc32(buf){
  let table = crc32._t;
  if(!table){
    table = crc32._t = new Uint32Array(256);
    for(let n = 0; n < 256; n++){
      let c = n;
      for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for(let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ table[(crc ^ buf[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function dosDatum(){
  const d = new Date();
  const datum = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const zeit  = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
  return { datum: datum & 0xFFFF, zeit: zeit & 0xFFFF };
}

function zipStore(dateien){
  const enc = new TextEncoder();
  const teile = [], zentral = [];
  const { datum, zeit } = dosDatum();
  let offset = 0, gesamt = 0;

  dateien.forEach(f => {
    const name = enc.encode(f.name);
    const daten = f.data;
    const crc = crc32(daten);

    const lokal = new Uint8Array(30 + name.length);
    const lv = new DataView(lokal.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, zeit, true);
    lv.setUint16(12, datum, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, daten.length, true);
    lv.setUint32(22, daten.length, true);
    lv.setUint16(26, name.length, true);
    lv.setUint16(28, 0, true);
    lokal.set(name, 30);
    teile.push(lokal, daten);
    gesamt += lokal.length + daten.length;

    const cen = new Uint8Array(46 + name.length);
    const cv = new DataView(cen.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, zeit, true);
    cv.setUint16(14, datum, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, daten.length, true);
    cv.setUint32(24, daten.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cen.set(name, 46);
    zentral.push(cen);
    offset += lokal.length + daten.length;
  });

  const zGroesse = zentral.reduce((a, c) => a + c.length, 0);
  const ende = new Uint8Array(22);
  const ev = new DataView(ende.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, dateien.length, true);
  ev.setUint16(10, dateien.length, true);
  ev.setUint32(12, zGroesse, true);
  ev.setUint32(16, gesamt, true);
  ev.setUint16(20, 0, true);

  const alles = new Uint8Array(gesamt + zGroesse + 22);
  let p = 0;
  teile.forEach(t => { alles.set(t, p); p += t.length; });
  zentral.forEach(t => { alles.set(t, p); p += t.length; });
  alles.set(ende, p);
  return alles;
}

/* --- Word-Datei aufbauen --- */

function xmlEsc(t){
  return String(t === null || t === undefined ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}

function wP(text, opt){
  opt = opt || {};
  const groesse = opt.size || 20;
  const rPr = `<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:sz w:val="${groesse}"/><w:szCs w:val="${groesse}"/>${opt.bold ? "<w:b/>" : ""}</w:rPr>`;
  const abstand = (opt.after === undefined) ? 60 : opt.after;
  const davor = opt.before ? `<w:spacing w:before="${opt.before}" w:after="${abstand}"/>` : `<w:spacing w:after="${abstand}"/>`;
  return `<w:p><w:pPr>${davor}</w:pPr><w:r>${rPr}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;
}

function wCell(text, opt){
  opt = opt || {};
  const schatten = opt.kopf ? '<w:shd w:val="clear" w:color="auto" w:fill="EEEEEE"/>' : "";
  const breite = opt.w ? `<w:tcW w:w="${opt.w}" w:type="dxa"/>` : "";
  return `<w:tc><w:tcPr>${breite}${schatten}</w:tcPr>${wP(text, { bold: !!opt.kopf, after: 0, size: 18 })}</w:tc>`;
}

function wTable(kopf, zeilen, breiten){
  const rahmen = ["top","left","bottom","right","insideH","insideV"]
    .map(s => `<w:${s} w:val="single" w:sz="6" w:space="0" w:color="000000"/>`).join("");
  const grid = breiten.map(b => `<w:gridCol w:w="${b}"/>`).join("");
  const kopfZeile = `<w:tr><w:trPr><w:tblHeader/></w:trPr>${kopf.map((t,i) => wCell(t, { kopf:true, w:breiten[i] })).join("")}</w:tr>`;
  const rest = zeilen.map(r => `<w:tr>${r.map((t,i) => wCell(t, { w:breiten[i] })).join("")}</w:tr>`).join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders>${rahmen}</w:tblBorders></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${kopfZeile}${rest}</w:tbl>` + wP("", { after: 60 });
}

function wordDokument(){

  if(state.settings.schuljahr) kopfzeilen.push("Schuljahr " + state.settings.schuljahr);

  body += wP(kopfzeilen.join("  |  "), { size:18, after:200 });

  if(!state.classes.length) body += wP("Noch keine Klassen angelegt.", {});

  state.classes.forEach(cls => {
    body += wP("Klasse " + cls.name, { bold:true, size:26, before:240, after:80 });
    cls.subjects.forEach(sub => {
      body += wP(sub.fach, { bold:true, size:22, before:120, after:60 });

      const uebersicht = cls.students.map(s => {

          String(pn.pos),
          String(pn.neg)
        ];
      });
      body += wTable(["Name","Leistungsniveau","1. Sem.","2. Sem.","Jahr","Positiv","Negativ"], uebersicht, [2600,1900,900,900,900,800,800]);

      cls.students.forEach(s => {
        if(!entriesOf(sub, s.id, "alle").length) return;
        body += wP(s.name, { bold:true, size:20, before:120, after:40 });
        body += wP("1. Semester " + fmtO(computeSchnitt(sub, s.id, 1)) +
                   "  |  2. Semester " + fmtO(computeSchnitt(sub, s.id, 2)) +
                   "  |  ganzes Jahr " + fmtO(computeSchnitt(sub, s.id, "alle")), { size:18, after:60 });

        [1, 2].forEach(sem => {
          const eigene = entriesOf(sub, s.id, sem);
          if(!eigene.length) return;
          body += wP(SEM_LABELS[sem], { bold:true, size:18, before:80, after:40 });

          const noten = eigene.filter(e => e.type === "note");
          if(noten.length){
            const zeilen = noten.map(n => [
              n.date,
              noteBezeichnung(sub, n),
              n.cat === "kompetenz" ? ((n.achieved||[]).length + " von " + n.total + " Kompetenzen") : (n.basis || ""),
              fmtW(noteWeight(sub, n)),
              String(n.value)
            ]);
            body += wTable(["Datum","Beurteilung","Grundlage","Gewicht","Note"], zeilen, [1100,2400,2900,1100,900]);
          }

          const rest = eigene.filter(e => e.type === "positiv" || e.type === "negativ" || e.type === "notiz");
          if(rest.length){
            const zeilen = rest.map(e => [
              e.date,
              e.type === "positiv" ? "Positiv" : (e.type === "negativ" ? "Negativ" : "Notiz"),
              e.text || ""
            ]);
            body += wTable(["Datum","Art","Eintrag"], zeilen, [1100,1500,5800]);
          }

          const fotos = eigene.filter(e => e.type === "foto");
          if(fotos.length) body += wP(fotos.length + " Foto(s) in der App gespeichert, in dieser Word-Datei nicht enthalten.", { size:16, after:80 });
        });
      });
    });
  });

  body += wP("Diese Datei ist eine Sicherung zum Nachlesen und Weiterverwenden. Zum Zurückspielen in die App dient die JSON-Datei mit demselben Datum im Namen.", { size:16, before:240 });

  const sect = '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    "<w:body>" + body + sect + "</w:body></w:document>";
}

function docxBytes(){
  const enc = new TextEncoder();
  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    "</Types>";
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    "</Relationships>";
  return zipStore([
    { name: "[Content_Types].xml", data: enc.encode(contentTypes) },
    { name: "_rels/.rels",         data: enc.encode(rels) },
    { name: "word/document.xml",   data: enc.encode(wordDokument()) }
  ]);
}

/* --- Ordnerwahl am Rechner, damit die Sicherung immer am selben Platz landet --- */

const ORDNER_DB = "klassenheft_ordner";
let ordnerHandle = null;

function idbOrdner(schreiben, wert){
  return new Promise(function(fertig){
    if(!window.indexedDB) return fertig(null);
    const anfrage = indexedDB.open(ORDNER_DB, 1);
    anfrage.onupgradeneeded = function(){ anfrage.result.createObjectStore("h"); };
    anfrage.onerror = function(){ fertig(null); };
    anfrage.onsuccess = function(){
      const db = anfrage.result;
      const tx = db.transaction("h", schreiben ? "readwrite" : "readonly");
      const store = tx.objectStore("h");
      const r = schreiben ? store.put(wert, "ordner") : store.get("ordner");
      r.onsuccess = function(){ fertig(schreiben ? true : r.result || null); };
      r.onerror = function(){ fertig(null); };
    };
  });
}

function kannOrdner(){ return typeof window.showDirectoryPicker === "function"; }

async function ordnerWaehlen(){
  if(!kannOrdner()){
    alert("Dieses Gerät kann keinen festen Sicherungsordner merken. Die Sicherung wird stattdessen ganz normal heruntergeladen und landet im Ordner Downloads oder in der Dateien-App.");
    return;
  }
  try{
    const handle = await window.showDirectoryPicker({ mode: "readwrite" });
    ordnerHandle = handle;
    await idbOrdner(true, handle);
    render();
    alert("Sicherungsordner gemerkt. Ab jetzt legt die App die Wochensicherung direkt dort ab.");
  }catch(e){ /* Auswahl abgebrochen */ }
}

async function ordnerBereit(){
  if(!kannOrdner()) return null;
  if(!ordnerHandle) ordnerHandle = await idbOrdner(false);
  if(!ordnerHandle) return null;
  try{
    let rechte = await ordnerHandle.queryPermission({ mode:"readwrite" });
    if(rechte !== "granted") rechte = await ordnerHandle.requestPermission({ mode:"readwrite" });
    return rechte === "granted" ? ordnerHandle : null;
  }catch(e){ return null; }
}

async function inOrdnerSchreiben(handle, name, blob){
  const datei = await handle.getFileHandle(name, { create:true });
  const strom = await datei.createWritable();
  await strom.write(blob);
  await strom.close();
}

function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

function datumsStempel(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

/* ---------- SICHERHEITSKOPIE IM GERÄT ----------
   Zusätzlich zur Wochensicherung legt die App selbst eine Kopie an, sobald
   eine neue Fassung des Programms geöffnet wird oder bevor ein Stand ersetzt
   wird. Sie liegt im selben Gerät und ist nur als Netz gedacht, falls beim
   Umstieg etwas schiefgeht. Fotos bleiben bewusst draußen, sonst wird die
   Kopie zu groß für den Speicher des Browsers. */

const KOPIE_KEY = "klassenheft_sicherheitskopie";
const FASSUNG_KEY = "klassenheft_fassung";

function ohneFotos(klassen){
  return klassen.map(c => ({
    id: c.id, name: c.name, stufe: c.stufe,
    students: c.students.map(s => Object.assign({}, s, { photo: null })),
    subjects: c.subjects.map(sub => Object.assign({}, sub, {
      entries: sub.entries.map(e => e.type === "foto" ? Object.assign({}, e, { dataUrl: null }) : e)
    }))
  }));
}

function sicherheitskopieAnlegen(grund){
  if(!state.classes.length) return;
  try{
    localStorage.setItem(KOPIE_KEY, JSON.stringify({
      grund: grund,
      zeit: new Date().toISOString(),
      daten: { version: 4, classes: ohneFotos(state.classes), settings: state.settings }
    }));
  }catch(e){ /* kein Platz, dann eben nicht */ }
}

function sicherheitskopieLesen(){
  try{
    const roh = localStorage.getItem(KOPIE_KEY);
    if(!roh) return null;
    const k = JSON.parse(roh);
    return (k && k.daten && Array.isArray(k.daten.classes)) ? k : null;
  }catch(e){ return null; }
}

function kopieZeitText(k){
  const d = new Date(k.zeit);
  if(isNaN(d.getTime())) return "";
  return String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + "." + d.getFullYear() +
         " um " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

function sicherheitskopieZurueck(){
  const k = sicherheitskopieLesen();
  if(!k){ alert("Es liegt keine Sicherheitskopie auf diesem Gerät."); return; }
  const anzahl = k.daten.classes.reduce((a, c) => a + c.students.length, 0);
  if(!confirm("Sicherheitskopie vom " + kopieZeitText(k) + " zurückholen?\n\n" +
              k.daten.classes.length + " Klasse(n), " + anzahl + " Schüler:in(nen).\n" +
              "Die Kopie wird mit dem jetzigen Stand zusammengeführt, es geht nichts verloren.\n" +
              "Porträtfotos sind in der Kopie nicht enthalten.")) return;
  const bericht = mergeState(state, migrate(JSON.parse(JSON.stringify(k.daten))));
  save();
  ansichtenZuruecksetzen();
  switchTab("home");
  alert("Zurückgeholt.\n\nNeu dazugekommen:\n" +
    bericht.klassen + " Klasse(n)\n" +
    bericht.schueler + " Schüler:in(nen)\n" +
    bericht.faecher + " Fach/Fächer\n" +
    bericht.eintraege + " Eintrag/Einträge");
}

/* Beim Start prüfen, ob das Programm gegen eine neue Fassung getauscht wurde */
function fassungPruefen(){
  let alt = null;
  try{ alt = localStorage.getItem(FASSUNG_KEY); }catch(e){ return; }
  if(alt !== APP_FASSUNG){
    if(alt !== null) sicherheitskopieAnlegen("neue Fassung " + APP_FASSUNG);
    try{ localStorage.setItem(FASSUNG_KEY, APP_FASSUNG); }catch(e){}
  }
}

function sicherungsDaten(){
  return { version: 4, geraet: state.settings.geraet || "", classes: state.classes, settings: state.settings, exportedAt: new Date().toISOString() };
}

async function sicherungErstellen(){
  const stempel = datumsStempel();
  const wordBlob = new Blob([docxBytes()], { type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  const jsonBlob = new Blob([JSON.stringify(sicherungsDaten(), null, 2)], { type:"application/json" });
  const wordName = "Klassenheft_Sicherung_" + stempel + ".docx";
  const jsonName = "Klassenheft_Sicherung_" + stempel + ".json";

  const handle = await ordnerBereit();
  let wohin;
  if(handle){
    try{
      await inOrdnerSchreiben(handle, wordName, wordBlob);
      await inOrdnerSchreiben(handle, jsonName, jsonBlob);
      wohin = "in deinen Sicherungsordner";
    }catch(e){ wohin = null; }
  }
  if(!wohin){
    download(wordBlob, wordName);
    setTimeout(function(){ download(jsonBlob, jsonName); }, 700);
    wohin = "in den Ordner für Downloads bzw. in die Dateien-App";
  }

  state.settings.lastBackup = new Date().toISOString();
  save();
  render();
  alert("Wochensicherung erstellt und " + wohin + " gelegt:\n\n" + wordName + " zum Nachlesen und Bearbeiten\n" + jsonName + " zum Zurückspielen in die App");
}

function tageSeitSicherung(){
  if(!state.settings.lastBackup) return null;
  const d = new Date(state.settings.lastBackup);
  if(isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

function sicherungFaellig(){
  const tage = tageSeitSicherung();
  if(tage === null) return state.classes.length > 0;
  return tage >= (state.settings.intervallTage || 7);
}

let bannerPause = false;

function backupBanner(){
  if(bannerPause || !sicherungFaellig()) return "";
  const tage = tageSeitSicherung();
  const text = tage === null
    ? "Noch keine Sicherung vorhanden. Damit nichts verloren geht, jetzt eine Wochensicherung anlegen."
    : "Die letzte Sicherung ist " + tage + " Tage her. Zeit für die Wochensicherung.";
  return `<div class="banner">
    <div class="txt">${text}</div>
    <button onclick="sicherungErstellen()">Jetzt sichern</button>
    <button class="ghost" onclick="sicherungSpaeter()">später</button>
  </div>`;
}

/* Erinnerung für heute wegklicken, ohne das Sicherungsdatum zu fälschen */
function sicherungSpaeter(){ bannerPause = true; render(); }

let importModus = "merge";

function starteImport(modus){
  importModus = modus;
