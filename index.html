/* Alle Einträge einer Person im gewählten Zeitraum. Ohne Angabe gilt das
   gerade eingestellte Semester, "alle" liefert das ganze Schuljahr. */
function entriesOf(sub, studentId, sem){
  const z = (sem === undefined) ? aktivesSemester() : sem;
  return sub.entries.filter(e => e.studentId === studentId && (z === "alle" || eintragSemester(e) === z));
}

/* Alle Noten eines Fachs im gewählten Zeitraum, über alle Personen */
function notenOf(sub, sem){
  const z = (sem === undefined) ? aktivesSemester() : sem;
  return sub.entries.filter(e => e.type === "note" && (z === "alle" || eintragSemester(e) === z));
}

/* Wie notenOf, aber inklusive der Stufen, die mitzählen */
function wertendeNotenAlle(sub, sem){
  const z = (sem === undefined) ? aktivesSemester() : sem;
  return sub.entries.filter(e => (z === "alle" || eintragSemester(e) === z))
    .map(e => {
      if(e.type === "note") return e;
      if(e.type === "stufe" && stufeZaehlt(sub, e.cat)) return Object.assign({}, e, { value: stufenWert(sub, e), ausStufe: true });
      return null;
    }).filter(Boolean);
}

/* Gewichtung einer einzelnen Note. Ältere Noten ohne eigenes Gewicht verhalten
   sich genau wie vorher, damit sich bestehende Notenschnitte nicht ändern. */
function noteWeight(sub, n){
  if(typeof n.w === "number") return n.w;
  return isProzentMode(sub) ? 1 : (sub.weights[n.cat] ?? 1);
}

/* Alle Werte, die in den Notenschnitt eingehen: die echten Noten und
   zusätzlich jene Stufeneinträge, für die das Mitzählen eingeschaltet ist.
   Einträge vom Typ "fehlt" bleiben grundsätzlich draußen. */
function wertendeNoten(sub, studentId, sem){
  return entriesOf(sub, studentId, sem).map(e => {
    if(e.type === "note") return e;
    if(e.type === "stufe" && stufeZaehlt(sub, e.cat)){
      return Object.assign({}, e, { value: stufenWert(sub, e), w: typeof e.w === "number" ? e.w : 1, ausStufe: true });
    }
    return null;
  }).filter(Boolean);
}

/* Der Notenschnitt aus Noten und mitzählenden Einstufungen, noch ohne Bonus */
function schnittOhneBonus(sub, studentId, sem){
  const notes = wertendeNoten(sub, studentId, sem);
  if(notes.length === 0) return null;
  return schnittAus(sub, notes);
}

/* Der Notenschnitt, wie er überall angezeigt wird: mit Bonus, begrenzt auf
   die Skala von 1 bis 5. Ohne Noten gibt es keinen Schnitt und damit auch
   keinen Bonus, die Mitarbeit kann also nie allein stehen. */
function computeSchnitt(sub, studentId, sem){
  const grund = schnittOhneBonus(sub, studentId, sem);
  if(grund === null) return null;
  const bonus = bonusSumme(sub, studentId, sem).wert;
  if(!bonus) return grund;
  return Math.max(1, Math.min(5, grund + bonus));
}

function schnittAus(sub, notes){
  if(notes.length === 0) return null;

  if(isProzentMode(sub)){
    let sum = 0, wsum = 0;
    activeCats(sub).forEach(cat => {
      const inCat = notes.filter(n => n.cat === cat);
      if(!inCat.length) return;
      const anteil = sub.weights[cat] ?? 0;
      if(anteil <= 0) return;
      let s = 0, w = 0;
      inCat.forEach(n => { const nw = noteWeight(sub, n); s += n.value * nw; w += nw; });
      if(w <= 0) return;
      sum += (s / w) * anteil;
      wsum += anteil;
    });
    if(wsum <= 0) return notes.reduce((a,n) => a + n.value, 0) / notes.length;
    return sum / wsum;
  }

  let sum = 0, wsum = 0;
  notes.forEach(n => { const w = noteWeight(sub, n); sum += n.value * w; wsum += w; });
  return wsum > 0 ? sum / wsum : null;
}

/* ---------- LEISTUNGSTENDENZ UND KATEGORIENSCHNITTE ----------
   Die Anzahl der Noten sagt niemandem etwas. Nützlich ist, wie die Leistung
   je Beurteilungsart aussieht und wohin sie sich bewegt. */

/* Note in Worten, mit "eher" wenn der Wert dazwischen liegt */
const NOTEN_WORTE = ["Sehr gut", "Gut", "Befriedigend", "Genügend", "Nicht genügend"];

function notenWort(v){
  if(v === null || isNaN(v)) return "";
  const unten = Math.max(1, Math.min(5, Math.floor(v)));
  const oben = Math.max(1, Math.min(5, Math.ceil(v)));
  const rest = v - Math.floor(v);
  /* Genau dazwischen ist genau dazwischen. Ein "eher Genügend" bei 3,5 würde
     eine Entscheidung behaupten, die die Zahl nicht hergibt. */
  if(unten !== oben && rest > 0.42 && rest < 0.58){
    return "zwischen " + NOTEN_WORTE[unten - 1] + " und " + NOTEN_WORTE[oben - 1];
  }
  const nah = Math.max(1, Math.min(5, Math.round(v)));
  return (Math.abs(v - nah) < 0.25 ? "" : "eher ") + NOTEN_WORTE[nah - 1];
}

/* Schnitt je Kategorie, nur für die, die auch in den Notenschnitt eingehen */
function kategorienSchnitte(sub, studentId, sem){
  const noten = wertendeNoten(sub, studentId, sem);
  const ergebnis = [];
  activeCats(sub).forEach(cat => {
    const drin = noten.filter(n => n.cat === cat);
    if(!drin.length) return;
    let summe = 0, gewicht = 0;
    drin.forEach(n => { const q = noteWeight(sub, n); summe += n.value * q; gewicht += q; });
    if(gewicht <= 0) return;
    ergebnis.push({ cat: cat, label: catLabel(sub, cat), kurz: catShort(sub, cat),
                    schnitt: summe / gewicht, anzahl: drin.length });
  });
  return ergebnis;
}

/* Wohin bewegt sich die Leistung? Erste Hälfte der Werte gegen zweite.
   Unter vier Werten ist das Zufall, dann sagen wir lieber nichts. */
function tendenz(sub, studentId, sem){
  const noten = wertendeNoten(sub, studentId, sem);
  if(noten.length < 4) return { richtung: "unklar", pfeil: "", text: "" };
  const mitte = Math.floor(noten.length / 2);
  const mittelAus = liste => liste.reduce((a, e) => a + e.value, 0) / liste.length;
  const frueher = mittelAus(noten.slice(0, mitte));
  const spaeter = mittelAus(noten.slice(noten.length - mitte));
  const unterschied = frueher - spaeter;      /* positiv heißt: besser geworden */
  if(unterschied > 0.35) return { richtung: "besser", pfeil: "\u2197", text: "wird besser" };
  if(unterschied < -0.35) return { richtung: "schlechter", pfeil: "\u2198", text: "wird schwächer" };
  return { richtung: "stabil", pfeil: "\u2192", text: "gleichbleibend" };
}

/* Gedeckte Farbe für die große Tendenzkachel. Bewusst nicht grell:
   das Feld ist groß, ein kräftiger Ton würde den ganzen Bildschirm dominieren. */
function tendenzFarbe(v){
  if(v === null) return { fg:"#4A4943", bg:"#F4F3F0" };
  if(v < 2.5) return { fg:"#2A6B2E", bg:"#EDF5EB" };
  if(v < 3.5) return { fg:"#7A6B10", bg:"#F7F4E8" };
  if(v < 4.5) return { fg:"#96650F", bg:"#FAF3E8" };
  return { fg:"#A8241C", bg:"#FAEEEE" };
}

/* ---------- NOTENVORHERSAGE ----------
   Zum Herzeigen: Kategorien probeweise weglassen und sehen, was das mit der
   Note macht. Verändert nichts am Bestand, es wird nichts gespeichert. */
let vorschauAus = [];

function vorschauSchnitt(sub, studentId, sem){
  if(!vorschauAus.length) return computeSchnitt(sub, studentId, sem);
  const kopie = JSON.parse(JSON.stringify(sub));
  kopie.cats = (kopie.cats || []).filter(k => vorschauAus.indexOf(k) === -1);
  kopie.stufenBonus = (kopie.stufenBonus || []).filter(k => vorschauAus.indexOf(k) === -1);
  kopie.stufenZaehlt = (kopie.stufenZaehlt || []).filter(k => vorschauAus.indexOf(k) === -1);
  kopie.entries = kopie.entries.filter(e => vorschauAus.indexOf(e.cat) === -1);
  return computeSchnitt(kopie, studentId, sem);
}

/* Was käme heraus, wenn die Mitarbeit ab jetzt durchgehend die beste Stufe
   wäre? Genau der Satz, den man dem Kind sagen will. */
function bestenfalls(sub, studentId, sem){
  const bonusCats = activeCats(sub).filter(k => istBonusCat(sub, k));
  if(!bonusCats.length) return null;
  const grund = schnittOhneBonus(sub, studentId, sem);
  if(grund === null) return null;
  const jetzt = computeSchnitt(sub, studentId, sem);

  const kopie = JSON.parse(JSON.stringify(sub));
  kopie.entries = kopie.entries.map(e => {
    if(e.type === "stufe" && bonusCats.indexOf(e.cat) !== -1) return Object.assign({}, e, { stufe: 0 });
    return e;
  });
  const best = computeSchnitt(kopie, studentId, sem);
  if(best === null || Math.abs(best - jetzt) < 0.005) return null;
  return { jetzt: jetzt, best: best, cats: bonusCats.map(k => catLabel(sub, k)) };
}

function vorschauSchalten(cat){
  const i = vorschauAus.indexOf(cat);
  if(i === -1) vorschauAus.push(cat); else vorschauAus.splice(i, 1);
  render();
}

function vorschauZuruecksetzen(){ vorschauAus = []; render(); }

/* ---------- SCHULARBEITEN VERGLEICHEN ----------
   Schularbeiten haben in der Praxis das größte Gewicht. Deshalb die Frage:
   Ist die erste besser ausgefallen als die zweite?

   Wie die App weiß, was zusammengehört: Eine Schularbeit wird an einem Tag
   geschrieben, also bildet Datum plus Kategorie die Gruppe. Wer eingetragen
   wird, während die Sammelerfassung offen ist, bekommt ohnehin dasselbe
   Datum. Ein Nachschreibtermin an einem anderen Tag ist damit eine eigene
   Gruppe, und das ist auch richtig so: er ist eine eigene Arbeit. */

/* Sortierschlüssel innerhalb des Schuljahres. Die Daten haben kein Jahr,
   deshalb gilt: September bis Dezember kommen vor Jänner bis August. */
function schuljahrOrdnung(datum){
  const m = String(datum || "").match(/^(\d{1,2})\.(\d{1,2})\.?$/);
  if(!m) return 999999;
  const tag = parseInt(m[1], 10), monat = parseInt(m[2], 10);
  const versetzt = (monat >= 9) ? monat - 9 : monat + 3;
  return versetzt * 100 + tag;
}

/* Die Nummer einer Arbeit. Sie gehört der Lehrkraft, nicht dem Kalender:
   Wer die erste und die zweite Schularbeit am selben Nachmittag nachträgt,
   hätte sonst eine einzige Arbeit, und wer nachschreibt, eine eigene.
   Ältere Einträge ohne Nummer werden beim Laden aus der Datumsreihenfolge
   nachgetragen, siehe arbeitsNummernNachziehen(). */
function arbeitNr(e){
  return (typeof e.arbeit === "number" && e.arbeit > 0) ? e.arbeit : null;
}

/* Wie viele Arbeiten sind in dieser Kategorie schon angelegt? */
function hoechsteArbeitNr(sub, cat, sem){
  const z = (sem === undefined) ? aktivesSemester() : sem;
  let hoechste = 0;
  sub.entries.forEach(e => {
    if(e.cat !== cat) return;
    if(z !== "alle" && eintragSemester(e) !== z) return;
    const n = arbeitNr(e);
    if(n && n > hoechste) hoechste = n;
  });
  return hoechste;
}

/* Alle Arbeiten einer Kategorie mit ihren Kennzahlen, nach Nummer sortiert. */
function arbeiten(sub, cat, sem){
  const z = (sem === undefined) ? aktivesSemester() : sem;
  const passend = sub.entries.filter(e =>
    e.cat === cat &&
    (e.type === "note" || e.type === "fehlt") &&
    (z === "alle" || eintragSemester(e) === z));
  if(!passend.length) return [];

  const gruppen = {};
  passend.forEach(e => {
    /* Die Nummer ist der Schlüssel. Nur wo keine steht, greift das Datum. */
    const nr = arbeitNr(e);
    const schluessel = nr ? "nr" + nr : "d" + (e.date || "ohne");
    if(!gruppen[schluessel]){
      gruppen[schluessel] = { nr: nr, datum: e.date || "", noten: [], fehlt: 0, themen: {}, daten: {} };
    }
    const g = gruppen[schluessel];
    if(e.type === "fehlt") g.fehlt++; else g.noten.push(e);
    if(e.thema) g.themen[e.thema] = true;
    if(e.date) g.daten[e.date] = (g.daten[e.date] || 0) + 1;
  });

  return Object.keys(gruppen)
    .map(k => {
      const g = gruppen[k];
      const werte = g.noten.map(n => n.value);
      const verteilung = [1,2,3,4,5].map(n => werte.filter(v => v === n).length);
      const schnitt = werte.length ? werte.reduce((a, v) => a + v, 0) / werte.length : null;
      /* Bei mehreren Terminen in einer Arbeit, etwa durch Nachschreiben,
         gilt der häufigste Tag als der Termin der Arbeit. */
      const tage = Object.keys(g.daten).sort((a, b) => g.daten[b] - g.daten[a]);
      const datum = tage[0] || g.datum;
      return {
        nr: g.nr,
        datum: datum,
        weitereTermine: tage.length > 1 ? tage.slice(1) : [],
        ordnung: g.nr ? g.nr : 1000 + schuljahrOrdnung(datum) / 1000,
        thema: Object.keys(g.themen).join(", "),
        anzahl: werte.length,
        fehlt: g.fehlt,
        schnitt: schnitt,
        beste: werte.length ? Math.min.apply(null, werte) : null,
        schlechteste: werte.length ? Math.max.apply(null, werte) : null,
        negativ: verteilung[4],
        verteilung: verteilung
      };
    })
    .filter(a => a.anzahl > 0)
    .sort((a, b) => a.ordnung - b.ordnung)
    .map((a, i) => Object.assign(a, { nummer: a.nr || (i + 1) }));
}

/* Die Einträge genau einer Arbeit, mit Person dazu. Angesprochen wird die
   Arbeit über ihre Nummer; nur Altbestand ohne Nummer über das Datum. */
function arbeitEintraege(cls, sub, cat, kennung, sem){
  const z = (sem === undefined) ? aktivesSemester() : sem;
  const nr = parseInt(kennung, 10);
  const ueberNummer = !isNaN(nr) && String(kennung).indexOf(".") === -1;
  return sub.entries
    .filter(e => e.cat === cat &&
      (ueberNummer ? arbeitNr(e) === nr : (!arbeitNr(e) && e.date === kennung)) &&
      (e.type === "note" || e.type === "fehlt") &&
      (z === "alle" || eintragSemester(e) === z))
    .map(e => ({ e: e, s: cls.students.find(x => x.id === e.studentId) }))
    .filter(x => !!x.s);
}

/* Die Kennung einer Arbeit für Verweise: die Nummer, sonst das Datum. */
/* Einmalig: Einträge aus früheren Fassungen haben keine Nummer. Sie
   bekommen sie aus der Reihenfolge der Termine im Schuljahr, je Kategorie
   und je Semester getrennt. Danach hängt die Zuordnung an der Nummer und
   ein späteres Ausbessern des Datums wirft nichts mehr durcheinander. */
function arbeitsNummernNachziehen(sub){
  const cats = {};
  sub.entries.forEach(e => {
    if(e.type !== "note" && e.type !== "fehlt") return;
    if(!e.date) return;
    cats[e.cat] = true;
  });
  Object.keys(cats).forEach(cat => {
    [1, 2].forEach(sem => {
      const drin = sub.entries.filter(e =>
        e.cat === cat && (e.type === "note" || e.type === "fehlt") &&
        eintragSemester(e) === sem);
      if(!drin.length) return;
      /* Schon vergebene Nummern bleiben unangetastet */
      const ohne = drin.filter(e => !arbeitNr(e));
      if(!ohne.length) return;
      const belegt = {};
      drin.forEach(e => { const n = arbeitNr(e); if(n) belegt[n] = true; });
      const termine = [];
      ohne.forEach(e => { if(termine.indexOf(e.date) === -1) termine.push(e.date); });
      termine.sort((a, b) => schuljahrOrdnung(a) - schuljahrOrdnung(b));
      let naechste = 1;
      termine.forEach(tag => {
        while(belegt[naechste]) naechste++;
        belegt[naechste] = true;
        ohne.filter(e => e.date === tag).forEach(e => { e.arbeit = naechste; });
        naechste++;
      });
    });
  });
}

function arbeitKennung(a){
  return a.nr ? String(a.nr) : a.datum;
}

function arbeitFinden(sub, cat, kennung, sem){
  return arbeiten(sub, cat, sem).find(a => arbeitKennung(a) === String(kennung)) || null;
}

/* ---------- NOTENSPIEGEL ----------
   Wie viele Sehr gut, wie viele Gut und so weiter. Die Zahlenreihe
   1·2·3·4·5 ist kompakt, aber man muss sie übersetzen. Ausgeschrieben ist
   sie das, was in einer Konferenz vorgelesen wird. */
function notenspiegel(verteilung){
  const gesamt = verteilung.reduce((a, v) => a + v, 0);
  return verteilung.map((anzahl, i) => ({
    note: i + 1,
    wort: NOTEN_WORTE[i],
    anzahl: anzahl,
    anteil: gesamt ? (anzahl * 100) / gesamt : 0
  }));
}

function spiegelVerteilung(sub, sem){
  const noten = wertendeNotenAlle(sub, sem);
  return [1,2,3,4,5].map(n => noten.filter(e => e.value === n).length);
}

/* Notenspiegel als Tabelle. Der Balken ist reine Verstärkung, die Zahl
   daneben steht immer da. */
function spiegelTabelle(verteilung, klasse){
  const zeilen = notenspiegel(verteilung);
  const groesste = Math.max.apply(null, zeilen.map(z => z.anzahl)) || 1;
  const gesamt = zeilen.reduce((a, z) => a + z.anzahl, 0);
  if(!gesamt) return "";
  return `<table class="${klasse || "vgl-tbl"}">
    <tr><th style="width:8%;">Note</th><th>Beurteilung</th><th style="width:14%;">Anzahl</th><th style="width:14%;">Anteil</th><th style="width:30%;"></th></tr>
    ${zeilen.map(z => {
      const g = gradeColor(z.note);
      return `<tr>
        <td style="text-align:center; font-weight:bold; color:${g.fg};">${z.note}</td>
        <td>${esc(z.wort)}</td>
        <td style="text-align:center; font-weight:bold;">${z.anzahl}</td>
        <td style="text-align:center;">${fmtPct(z.anteil)} %</td>
        <td>${z.anzahl ? '<span style="display:inline-block; height:9px; border:1px solid ' + g.fg +
              "; background:" + g.bg + "; width:" + Math.max(3, Math.round((z.anzahl / groesste) * 100)) + '%;"></span>' : ""}</td>
      </tr>`;
    }).join("")}
    <tr><td></td><td style="font-weight:bold;">gesamt</td><td style="text-align:center; font-weight:bold;">${gesamt}</td><td></td><td></td></tr>
  </table>`;
}

/* Der Vergleich in einem Satz: besser oder schlechter als die vorige. */
function arbeitVergleich(liste, i){
  if(i === 0 || !liste[i - 1] || liste[i].schnitt === null || liste[i - 1].schnitt === null) return null;
  const unterschied = liste[i - 1].schnitt - liste[i].schnitt;   /* positiv heißt besser */
  if(Math.abs(unterschied) < 0.05) return { richtung: "gleich", betrag: 0, text: "gleich ausgefallen wie die vorige" };
  return {
    richtung: unterschied > 0 ? "besser" : "schlechter",
    betrag: Math.abs(unterschied),
    text: (unterschied > 0 ? "um " : "um ") + fmt(Math.abs(unterschied)) +
          (unterschied > 0 ? " besser" : " schlechter") + " als die vorige"
  };
}

/* ---------- WER BRAUCHT AUFMERKSAMKEIT ----------
   Zweck: in der Klassenliste auf einen Blick sehen, mit wem man reden sollte,
   ohne jede Person einzeln zu öffnen. Bewusst mehrere Gründe, weil ein
   schwacher Schnitt und fehlende Mitarbeit verschiedene Gespräche sind.

   Alle Schwellen stehen hier oben und lassen sich anpassen. */
const AUFFALL_SCHNITT = 4.0;      /* ab diesem Schnitt steht die Note auf der Kippe */
const AUFFALL_MITARBEIT = 0.6;    /* Anteil schwacher Einstufungen, ab dem es auffällt */
const AUFFALL_MIN_STUFEN = 4;     /* so viele Einstufungen braucht es für eine Aussage */
const AUFFALL_FUENFER = 2;        /* ab so vielen Nicht genügend, siehe unten */
const AUFFALL_WACKELT = 3.0;      /* darüber genügt schon ein einzelnes Nicht genügend */

function auffaellig(sub, studentId, sem){
  const gruende = [];
  const schnitt = computeSchnitt(sub, studentId, sem);

  if(schnitt !== null && schnitt >= AUFFALL_SCHNITT){
    gruende.push({ art: "note", text: "Schnitt " + fmt(schnitt) });
  }

  /* Nicht genügend: mehrere fallen immer auf, ein einzelnes nur dann, wenn
     der Schnitt ohnehin schon wackelt. Sonst wäre in einer normalen Klasse
     die halbe Liste markiert, und dann sagt die Markierung nichts mehr. */
  const fuenfer = wertendeNoten(sub, studentId, sem).filter(n => n.value === 5).length;
  if(fuenfer >= AUFFALL_FUENFER || (fuenfer && schnitt !== null && schnitt >= AUFFALL_WACKELT)){
    gruende.push({ art: "note", text: fuenfer + "\u00d7 Nicht genügend" });
  }

  /* Schwache Mitarbeit: die beiden untersten Stufen jener Kategorien, die
     ohne Note laufen. Das ist genau das, worüber man sprechen will. */
  activeCats(sub).forEach(cat => {
    if(!istStufenCat(sub, cat)) return;
    const liste = entriesOf(sub, studentId, sem).filter(e => e.type === "stufe" && e.cat === cat);
    if(liste.length < AUFFALL_MIN_STUFEN) return;
    const anzahlStufen = stufenListe(sub, cat).length;
    const schwach = liste.filter(e => e.stufe >= anzahlStufen - 2).length;
    const anteil = schwach / liste.length;
    if(anteil >= AUFFALL_MITARBEIT){
      gruende.push({ art: "stufe",
        text: catLabel(sub, cat) + ": " + schwach + " von " + liste.length + " schwach" });
    }
  });

  /* Wer bei einer Schularbeit gefehlt hat, ist kein Problemfall, aber es
     gehört erinnert, sobald es sich häuft. */
  const fehlt = entriesOf(sub, studentId, sem).filter(e => e.type === "fehlt").length;
  if(fehlt >= 2) gruende.push({ art: "fehlt", text: fehlt + "\u00d7 nicht mitgeschrieben" });

  return gruende;
}

/* Fasst die Klasse zusammen, für die Zeile über der Liste. */
function auffaelligeDerKlasse(cls, sub, sem){
  return cls.students
    .map(s => ({ s: s, gruende: auffaellig(sub, s.id, sem) }))
    .filter(x => x.gruende.length > 0);
}

function countPosNeg(sub, studentId, sem){
  let pos = 0, neg = 0;
  entriesOf(sub, studentId, sem).forEach(e => { if(e.type === "positiv") pos++; if(e.type === "negativ") neg++; });
  return { pos, neg };
}

function fmt(n){ return n === null ? "-" : n.toFixed(1).replace(".", ","); }
function fmtO(n){ return n === null ? "-" : "Ø " + fmt(n); }
/* Für Bonuswerte: Viertelstufen wie 0,25 dürfen nicht auf 0,3 gerundet werden */
function fmtB(n){
  if(n === null || n === undefined || isNaN(n)) return "-";
  return n.toFixed(2).replace(/0$/, "").replace(/\.$/, "").replace(".", ",");
}
function fmtPct(n){
  if(n === null || isNaN(n)) return "0";
  return (Math.round(n * 10) % 10 === 0 ? String(Math.round(n)) : n.toFixed(1).replace(".", ","));
}
function fmtW(n){ return "×" + Number(n).toFixed(1).replace(".", ","); }

function gradeColor(v){
  if(v <= 2) return { fg:"#3B6E2E", bg:"#EAF3E7" };
  if(v >= 4) return { fg:"#B3241C", bg:"#FBEAEA" };
  return { fg:"#000000", bg:"#FFFFFF" };
}

function gradeFromRatio(ratio){
  if(ratio >= 0.9) return 1;
  if(ratio >= 0.75) return 2;
  if(ratio >= 0.6) return 3;
  if(ratio >= 0.4) return 4;
  return 5;
}

function initials(name){
  return String(name).split(" ").map(p => p[0]).filter(Boolean).slice(0,2).join("").toUpperCase();
}

/* Avatar: Foto, wenn eines hinterlegt ist, sonst die Initialen.
   Fotos liegen als kleines JPEG direkt am Datensatz und bleiben damit
   auf dem Gerät und im Backup. */
function avatarHtml(s, klein){
  const cls = klein ? "avatar small" : "avatar";
  if(s && s.photo) return `<div class="${cls}"><img src="${s.photo}" alt=""></div>`;
  return `<div class="${cls}">${initials(s ? s.name : "")}</div>`;
}

/* ---------- RAHMEN ---------- */

/* Tippt man auf den Reiter, in dem man ohnehin schon ist, geht es zurück
   auf dessen Übersicht. Das ist der übliche Weg, um aus einer Unterseite
   wieder herauszukommen, ohne die Pfeile links oben zu suchen. */
function switchTab(t){
  if(tab === t){
    if(t === "home") homeView.screen = "list";
    else if(t === "statistik") statView.screen = "list";
    else settingsView.screen = "list";
  }
  tab = t;
  render();
}

/* ---------- SEMESTERLEISTE ----------
   Eine einzige Leiste, überall gleich. Sie entscheidet, welcher Zeitraum
   gerechnet, angezeigt, gedruckt und beim Eintragen vergeben wird. */

function semesterLeiste(reiter){
  const farbe = TAB_COLORS[reiter] || TAB_COLORS.home;
  const aktiv = aktivesSemester();
  const chips = [[1, "1. Semester"], [2, "2. Semester"], ["alle", "Ganzes Jahr"]].map(([k, lbl]) => {
    const an = aktiv === k;
    const style = an
      ? `background:${farbe.fg}; border-color:${farbe.fg}; color:#fff;`
      : `background:#fff; border-color:${farbe.fg}; color:${farbe.fg};`;
    return `<div class="chip" style="${style}" onclick="setSemester('${k}')">${lbl}</div>`;
  }).join("");
  return `<div class="chips" style="border-bottom:1px solid #000000; padding-bottom:8px;">${chips}</div>`;
}

function setSemester(wert){
  state.settings.semester = (wert === "alle") ? "alle" : parseInt(wert, 10);
  save();
  render();
}

function render(){
  const content = document.getElementById("content");
  if(tab === "home") content.innerHTML = renderHome();
  else if(tab === "statistik") content.innerHTML = renderStat();
  else content.innerHTML = renderSettings();
  renderTabBar();
}

function renderTabBar(){
  const bar = document.getElementById("tabbar");
  bar.innerHTML = Object.keys(TAB_COLORS).map(k => {
    const c = TAB_COLORS[k];
    const active = tab === k;
    const style = active
      ? `border-top-color:${c.fg}; background:${c.bg}; color:${c.fg};`
      : "border-top-color:transparent;";
    return `<div class="tabbtn ${active ? "active" : ""}" style="${style}" onclick="switchTab('${k}')">${c.label}</div>`;
  }).join("");
}

function headerStyle(t){ return `background:${TAB_COLORS[t].bg};`; }
function titleStyle(t){ return `color:${TAB_COLORS[t].fg};`; }

/* ---------- HOME ---------- */

function goHome(screen, classId, subjectId, studentId){
  homeView.screen = screen;
  if(classId !== undefined && classId !== null) homeView.classId = classId;
  if(subjectId !== undefined && subjectId !== null) homeView.subjectId = subjectId;
  if(studentId !== undefined && studentId !== null) homeView.studentId = studentId;
  if(screen === "student") homeView.noteFilter = "alle";
  if(screen === "newNote"){
    const sub = getSubject(getClass(homeView.classId), homeView.subjectId);
    const cats = activeCats(sub);
    homeView.newNoteCat = cats.indexOf("schularbeit") !== -1 ? "schularbeit" : (cats[0] || "mitarbeit");
    homeView.newNoteGrade = null;
    homeView.noteBasis = null;
    homeView.noteWeight = startWeight(sub, homeView.newNoteCat);
  }
  render();
}

function renderHome(){
  if(homeView.screen === "newSubject") return renderNewSubject();
  if(homeView.screen === "roster") return renderRoster();
  if(homeView.screen === "newStudent") return renderNewStudent();
  if(homeView.screen === "student") return renderStudent();
  if(homeView.screen === "newEntry") return renderNewEntry();
  if(homeView.screen === "newNote") return renderNewNote();
  if(homeView.screen === "schnell") return renderSchnell();
  return renderHomeList();
}

function renderHomeList(){
  const rows = allSubjectRows().map(({cls, sub}) => {
    const avgs = cls.students.map(s => computeSchnitt(sub, s.id)).filter(v => v !== null);
    const schnitt = avgs.length ? avgs.reduce((a,b) => a+b, 0) / avgs.length : null;
    const bad = schnitt !== null && schnitt >= 4.0;
    return `<div class="row" onclick="goHome('roster','${cls.id}','${sub.id}')">
      <div>
        <div class="name">${cls.name} &middot; ${sub.fach}</div>
        <div class="sub">${cls.students.length} Schüler:innen</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="val ${bad ? "red" : ""}" style="font-size:15px; font-weight:bold;">${fmtO(schnitt)}</span>
        <span class="chev" style="${titleStyle("home")}">&rsaquo;</span>
      </div>
    </div>`;
  }).join("");

  return `
    <div class="header" style="${headerStyle("home")}">
      <div class="title" style="${titleStyle("home")}">Klassenheft</div>
      <div class="sub">Klassen und Fächer</div>
    </div>
    ${backupBanner()}
    ${semesterLeiste("home")}
    ${rows || '<div class="helptext">Noch nichts angelegt. Leg unten eine Klasse mit einem Fach an.</div>'}
    <div class="footer">
      <button onclick="goHome('newSubject')">+ Neue Klasse oder Fach</button>
    </div>
  `;
}

function renderNewSubject(){
  /* Gibt es noch keine Klasse, wird die Auswahlliste weggelassen. Sie hätte
     ohnehin nur den einen Eintrag "Neue Klasse anlegen", und das Feld für die
     Bezeichnung muss von Anfang an sichtbar sein. */
  const ersteKlasse = state.classes.length === 0;

  const klassenOpts = state.classes.map(c =>
    `<option value="${c.id}">${esc(c.name)}</option>`).join("");

  /* Die erste Vorlage in der Liste ist beim Öffnen ausgewählt. Ihr
     Erklärungstext muss deshalb auch gleich sichtbar sein. */
  const vorlagenKeys = Object.keys(SUBJECT_TEMPLATES);
  const vorlageJetzt = vorlagenKeys[0];
  const tplOpts = vorlagenKeys.map(k =>
    `<option value="${k}">${SUBJECT_TEMPLATES[k].label}</option>`).join("");
  const tplNotes = vorlagenKeys.map(k =>
    `<div id="tplNote_${k}" style="display:${k === vorlageJetzt ? "block" : "none"};">${SUBJECT_TEMPLATES[k].note}</div>`).join("");

  const klasseFeld = ersteKlasse
    ? `<span class="field-label">Klasse</span>
       <input type="text" id="klasseInput" placeholder="z. B. 2A" required autofocus>`
    : `<span class="field-label">Klasse</span>
       <select id="klasseSelect" onchange="toggleNeueKlasse()">
         ${klassenOpts}
         <option value="__neu">Neue Klasse anlegen</option>
       </select>
       <div id="neueKlasseBox" style="display:none;">
         <span class="field-label">Bezeichnung der neuen Klasse</span>
         <input type="text" id="klasseInput" placeholder="z. B. 3B">
       </div>`;

  return `
    <div class="header" style="${headerStyle("home")}">
      <span class="back" style="${titleStyle("home")}" onclick="goHome('list')">&lsaquo;</span>
      <span class="title" style="${titleStyle("home")}">${ersteKlasse ? "Erste Klasse anlegen" : "Neue Klasse oder Fach"}</span>
    </div>
    <form onsubmit="createSubject(event)">
      ${klasseFeld}
      <span class="field-label">Fach</span>
      <input type="text" id="fachInput" placeholder="z. B. Deutsch" required oninput="suggestTemplate(this.value)">
      <span class="field-label">Bewertung</span>
      <select id="tplSelect" onchange="this.dataset.touched='1'; showTemplateNote();">${tplOpts}</select>
      <button type="submit">Anlegen</button>
    </form>
    <div class="helptext" id="tplNoteBox">${tplNotes}</div>
    <div class="helptext">Die Namen der Schüler:innen gehören zur Klasse, nicht zum Fach. Du tippst sie also nur einmal ein und siehst sie in jedem Fach dieser Klasse wieder. Bewertet wird immer nur im gewählten Fach.</div>
  `;
}

function toggleNeueKlasse(){
  const sel = document.getElementById("klasseSelect");
  const box = document.getElementById("neueKlasseBox");
  if(!sel || !box) return;
  box.style.display = (sel.value === "__neu") ? "block" : "none";
}

function suggestTemplate(fach){
  const sel = document.getElementById("tplSelect");
  if(!sel || sel.dataset.touched === "1") return;
  sel.value = templateKeyForFach(fach);
  showTemplateNote();
}

function showTemplateNote(){
  const sel = document.getElementById("tplSelect");
  if(!sel) return;
  Object.keys(SUBJECT_TEMPLATES).forEach(k => {
    const el = document.getElementById("tplNote_" + k);
    if(el) el.style.display = (k === sel.value) ? "block" : "none";
  });
}

function createSubject(ev){
  ev.preventDefault();
  const fach = document.getElementById("fachInput").value.trim();
  if(!fach) return;
  /* Beim allerersten Mal gibt es keine Auswahlliste, dann wird immer eine
     neue Klasse angelegt. */
  const auswahl = document.getElementById("klasseSelect");
  const wahl = auswahl ? auswahl.value : "__neu";
  let cls;
  if(wahl === "__neu" || !wahl){
    const feld = document.getElementById("klasseInput");
    const name = feld ? feld.value.trim() : "";
    if(!name){
      alert("Bitte eine Bezeichnung für die Klasse eingeben, zum Beispiel 2A.");
      if(feld) feld.focus();
      return;
    }
    /* Gibt es die Bezeichnung schon, wird die bestehende Klasse verwendet,
       statt eine zweite mit demselben Namen anzulegen. */
    cls = state.classes.find(c => c.name.trim().toLowerCase() === name.toLowerCase());
    if(!cls){
      cls = { id: uid(), name: name, stufe: stufeFromKlasse(name), students: [], subjects: [] };
      state.classes.push(cls);
    }
  } else {
    cls = getClass(wahl);
    if(!cls) return;
  }
  if(cls.subjects.some(s => s.fach.toLowerCase() === fach.toLowerCase())){
    alert("Das Fach " + fach + " gibt es in der Klasse " + cls.name + " schon.");
    return;
  }
  const sub = { id: uid(), fach: fach, competencies: defaultCompetencies(fach), entries: [] };
  applyTemplate(sub, document.getElementById("tplSelect").value);
  cls.subjects.push(sub);
  /* Alle Vorgaben ergänzen, zum Beispiel dass die Hausübung ohne Note läuft.
     Sonst gälten sie erst nach einem Neustart der App. */
  normaliseClass(cls);
  save();
  goHome("roster", cls.id, sub.id);
}

function renderRoster(){
  const cls = getClass(homeView.classId);
  const sub = getSubject(cls, homeView.subjectId);
  if(!cls || !sub) return renderHomeList();

  const auffaellige = auffaelligeDerKlasse(cls, sub);

  const rows = cls.students.map(s => {
    const schnitt = computeSchnitt(sub, s.id);
    const bad = schnitt !== null && schnitt >= 4.0;
    const gruende = auffaellig(sub, s.id);
    const niveau = (cls.stufe === 1) ? "" : `<div class="sub">${esc(NIVEAU_LABELS[s.niveau])}</div>`;
    /* Gedeckt, nicht grell: die Zeile bleibt lesbar, der Balken links
       trägt die Auffälligkeit. Der Grund steht daneben in Worten, damit
       die Farbe nicht der einzige Träger ist. */
    const markiert = gruende.length
      ? "background:#FAF3E8; border-left:5px solid #96650F;"
      : "";
    const grundZeile = gruende.length
      ? `<div class="sub" style="color:#7A5209;">${esc(gruende.map(g => g.text).join(" &middot; ").replace(/&middot;/g, "·"))}</div>`
      : "";
    return `<div class="row" style="${markiert}" onclick="goHome('student',null,null,'${s.id}')">
      <div style="display:flex; align-items:center; gap:10px; min-width:0;">
        ${avatarHtml(s, true)}
        <div style="min-width:0;"><div class="name" style="font-size:14px;">${esc(s.name)}</div>${niveau}${grundZeile}</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
        <span class="val ${bad ? "red" : ""}" style="font-size:15px; font-weight:bold; white-space:nowrap;">${fmtO(schnitt)}</span>
        <span class="chev" style="${titleStyle("home")}">&rsaquo;</span>
      </div>
    </div>`;
  }).join("");

  const hinweisZeile = !auffaellige.length ? "" : `
    <div style="padding:10px 16px; background:#FAF3E8; border-bottom:1px solid #000; border-left:5px solid #96650F;">
      <div style="font-size:13px; font-weight:bold; color:#7A5209;">${auffaellige.length} ${
        auffaellige.length === 1 ? "Schüler:in braucht" : "Schüler:innen brauchen"} Aufmerksamkeit</div>
      <div style="font-size:11px; margin-top:2px;">${esc(auffaellige.map(x => x.s.name).join(", "))}</div>
    </div>`;

  const andere = cls.subjects.filter(s => s.id !== sub.id);
  const wechsel = andere.length ? `
    <div class="label">ANDERE FÄCHER DIESER KLASSE</div>
    <div class="chips">${andere.map(s =>
      `<div class="chip" onclick="goHome('roster','${cls.id}','${s.id}')">${s.fach}</div>`).join("")}</div>` : "";

  return `
    <div class="header" style="${headerStyle("home")}">
      <span class="back" style="${titleStyle("home")}" onclick="goHome('list')">&lsaquo;</span>
      <span class="title" style="${titleStyle("home")}">${esc(cls.name)} &middot; ${esc(sub.fach)}</span>
      <div class="sub">${cls.students.length} Schüler:innen</div>
    </div>
    ${semesterLeiste("home")}
    ${hinweisZeile}
    ${rows || '<div class="helptext">Noch keine Schüler:innen in der Klasse ' + esc(cls.name) + '.</div>'}
    ${wechsel}
    <div class="footer">
      <button class="gross" onclick="goSchnell()">Ganze Klasse bewerten</button>
      <button onclick="goHome('newStudent')">+ Schüler:in</button>
    </div>
  `;
}

      <span class="field-label">Leistungsniveau</span>

function createStudent(ev){
  ev.preventDefault();
  const name = document.getElementById("nameInput").value.trim();
  if(!name) return;
  const cls = getClass(homeView.classId);
  const niveauEl = document.getElementById("niveauInput");
  cls.students.push({ id: uid(), name: name, niveau: niveauEl ? niveauEl.value : "ahs", photo: null, updatedAt: Date.now() });
  save();
  goHome("roster");
}

function setNiveau(value){
  const cls = getClass(homeView.classId);
  const s = getStudent(cls, homeView.studentId);
  s.niveau = (value === "standard") ? "standard" : "ahs";
  save();
  render();
}

function deleteStudent(){
  const cls = getClass(homeView.classId);
  const s = getStudent(cls, homeView.studentId);
  if(!confirm(s.name + " aus der Klasse " + cls.name + " löschen? Damit gehen die Einträge in allen Fächern dieser Klasse verloren.")) return;
  cls.students = cls.students.filter(x => x.id !== s.id);
  cls.subjects.forEach(sub => { sub.entries = sub.entries.filter(e => e.studentId !== s.id); });
  save();
  goHome("roster");
}

function renderStudent(){
  const cls = getClass(homeView.classId);
  const sub = getSubject(cls, homeView.subjectId);
  const s = getStudent(cls, homeView.studentId);
  if(!cls || !sub || !s) return renderHomeList();

  const schnitt = computeSchnitt(sub, s.id);
  const { pos, neg } = countPosNeg(sub, s.id);
  const eigene = entriesOf(sub, s.id);
  const alleNoten = eigene.filter(e => e.type === "note");
  const noten = homeView.noteFilter === "alle" ? alleNoten : alleNoten.filter(n => n.cat === homeView.noteFilter);
  const verlauf = eigene.filter(e => e.type !== "note").slice().reverse();

  const anzahlNoten = wertendeNoten(sub, s.id).length;
  const bonus = bonusSumme(sub, s.id);
  const grundschnitt = schnittOhneBonus(sub, s.id);
  const anzahlFehlt = eigene.filter(e => e.type === "fehlt").length;
  const verlauf2 = verlaufSvg(sub, s.id);
  const bilanz = stufenBilanz(sub, s.id);
  const bilanzZeilen = bilanz.length ? bilanz.map(b => {
    const c = catCol(sub, b.cat);
    return `<div class="entry">
      <span class="catdot" style="background:${c.fg};"></span>
      <div class="txt"><b>${esc(b.label)}</b> &middot; ${esc(b.teile.join(", "))}</div>
      <span class="badge" style="border-color:${c.fg}; color:${c.fg}; background:${c.bg};">${
        b.bonus ? "Bonus " + (bonusTeilText(bonus, b.cat)) : (b.zaehlt ? "zählt mit" : "zählt nicht")}</span>
    </div>`;
  }).join("") : "";

  const chipDefs = [["alle","Alle",null]].concat(activeCats(sub).map(k => [k, catShort(sub,k), catCol(sub,k)]));
  const chips = chipDefs.map(([key,lbl,col]) => {
    const active = homeView.noteFilter === key;
    const style = !col
      ? (active ? "background:#000; border-color:#000; color:#fff;" : "background:#fff; border-color:#000; color:#000;")
      : (active ? `background:${col.fg}; border-color:${col.fg}; color:#fff;` : `background:${col.bg}; border-color:${col.fg}; color:${col.fg};`);
    return `<div class="chip" style="${style}" onclick="setNoteFilter('${key}')">${lbl}</div>`;
  }).join("");

  const noteRows = noten.map(n => {
    const col = catCol(sub, n.cat);
    const gcol = gradeColor(n.value);
    if(n.cat === "kompetenz"){
      const liste = (n.achieved || []).join(", ") || "keine";
      return `<div class="entry">
        <span class="catdot" style="background:${col.fg};"></span>
        <div class="txt">${esc(eintragTitel(sub, n))} &ndash; ${esc(liste)} (${(n.achieved||[]).length}/${n.total})</div>
        ${datumFeld(n)}
        <span class="grade" style="color:${gcol.fg};">${n.value}</span>
        <button class="ghost small" onclick="deleteEntry('${n.id}')" title="löschen">&times;</button>
      </div>`;
    }
    const basis = n.basis ? ` <span style="font-size:11px;">(${n.basis})</span>` : "";
    return `<div class="entry">
      <span class="catdot" style="background:${col.fg};"></span>
      <div class="txt">${esc(eintragTitel(sub, n))}${basis}</div>
      ${datumFeld(n)}
      <span class="badge" style="border-color:${col.fg}; color:${col.fg}; background:${col.bg};">${fmtW(noteWeight(sub, n))}</span>
      <span class="grade" style="color:${gcol.fg};">${n.value}</span>
      <button class="ghost small" onclick="deleteEntry('${n.id}')" title="löschen">&times;</button>
    </div>`;
  }).join("");

  const verlaufRows = verlauf.map(e => {
    const del = `<button class="ghost small" onclick="deleteEntry('${e.id}')" title="löschen">&times;</button>`;
    if(e.type === "positiv") return `<div class="entry positiv"><span>+</span><div class="txt">${esc(e.text)}</div>${datumFeld(e)}${del}</div>`;
    if(e.type === "negativ") return `<div class="entry negativ"><span>&minus;</span><div class="txt">${esc(e.text)}</div>${datumFeld(e)}${del}</div>`;
    if(e.type === "foto") return `<div class="entry"><img class="thumb" src="${e.dataUrl}"><div class="txt">Foto &ndash; ${esc(e.tag)}</div>${datumFeld(e)}${del}</div>`;
    if(e.type === "stufe"){
      const c = catCol(sub, e.cat);
      return `<div class="entry">
        <span class="catdot" style="background:${c.fg};"></span>
        <div class="txt"><b>${esc(stufenZeichen(e.cat, e.stufe, stufenListe(sub, e.cat).length))}</b> ${esc(catLabel(sub, e.cat))}${e.thema ? " (" + esc(e.thema) + ")" : ""}: ${esc(stufenText(sub, e))}</div>
        ${datumFeld(e)}${del}</div>`;
    }
    if(e.type === "fehlt"){
      const c = catCol(sub, e.cat);
      return `<div class="entry">
        <span class="catdot" style="background:${c.fg};"></span>
        <div class="txt">${esc(catLabel(sub, e.cat))}${e.thema ? " (" + esc(e.thema) + ")" : ""}: nicht mitgeschrieben, keine Note</div>
        ${datumFeld(e)}${del}</div>`;
    }
    return `<div class="entry"><span>&#9633;</span><div class="txt">${esc(e.text || "")}</div>${datumFeld(e)}${del}</div>`;
  }).join("");

  const assignBar = pendingPhoto ? `
    <div class="assign-bar">
      <span style="font-size:12px;">Foto zuordnen:</span>
      <button class="green" onclick="assignPhoto('Hausübung')">Hausübung</button>
      <button onclick="assignPhoto('Schülerarbeit')">Schülerarbeit</button>
      <button class="ghost" onclick="pendingPhoto=null; render();">Abbrechen</button>
    </div>` : "";

  /* ---------- Kopfbereich: Tendenz groß, Kategorien darunter ---------- */
  const tend = tendenz(sub, s.id);
  const tf = tendenzFarbe(schnitt);
  const wort = notenWort(schnitt);
  const bonusZusatz = (schnitt !== null && bonus.wert)
    ? fmt(grundschnitt) + " " + (bonus.wert < 0 ? "\u2212" : "+") + " " + fmtB(Math.abs(bonus.wert)) + " Bonus"
    : "";

  const tendenzBlock = `
    <div style="padding:16px; border-bottom:2px solid #000; background:${tf.bg};">
      <div style="display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;">
        <span style="font-size:40px; font-weight:bold; line-height:1; color:${tf.fg};">${fmtO(schnitt)}</span>
        <span style="font-size:17px; font-weight:bold; color:${tf.fg};">${esc(wort)}</span>
        ${tend.pfeil ? '<span style="font-size:15px; color:' + tf.fg + ';">' + tend.pfeil + " " + esc(tend.text) + "</span>" : ""}
      </div>
      <div style="font-size:11px; margin-top:6px;">Allgemeine Leistungstendenz${
        bonusZusatz ? " &middot; " + esc(bonusZusatz) : ""}${
        anzahlFehlt ? " &middot; " + anzahlFehlt + "\u00d7 nicht mitgeschrieben" : ""}${
        tend.richtung === "unklar" && schnitt !== null ? " &middot; für eine Richtung braucht es mindestens vier Noten" : ""}</div>
    </div>`;

  /* Schnitt je Beurteilungsart, die tatsächlich in die Note eingeht */
  const kats = kategorienSchnitte(sub, s.id);
  const katZeile = !kats.length ? "" : `
    <div class="stats" style="flex-wrap:wrap;">
      ${kats.map(k => {
        const c = catCol(sub, k.cat);
        return `<div class="stat" style="min-width:88px; border-right:1px solid #000;">
          <div class="val" style="font-size:19px; color:${c.fg};">${fmt(k.schnitt)}</div>
          <div class="lbl">${esc(k.kurz)}${k.anzahl > 1 ? " &middot; " + k.anzahl + "\u00d7" : ""}</div>
        </div>`;
      }).join("")}
    </div>`;

  /* ---------- Notenvorhersage ---------- */
  const vorschauCats = activeCats(sub).filter(k =>
    notenCats(sub).indexOf(k) !== -1 || istBonusCat(sub, k));
  const vorschauWert = vorschauSchnitt(sub, s.id);
  const best = bestenfalls(sub, s.id);
  const vorschauBlock = (!vorschauCats.length || schnitt === null) ? "" : `
    <div class="label" style="border-top:2px solid #000;">WAS-WÄRE-WENN</div>
    <div class="helptext">Zum Herzeigen: Beurteilungsarten wegschalten und sehen, was das mit der Note macht. Es wird dabei nichts verändert und nichts gespeichert.</div>
    <div class="chips">
      ${vorschauCats.map(k => {
        const c = catCol(sub, k);
        const aus = vorschauAus.indexOf(k) !== -1;
        const stil = aus
          ? "background:#fff; border-color:#999; color:#999; text-decoration:line-through;"
          : `background:${c.bg}; border-color:${c.fg}; color:${c.fg};`;
        return `<div class="chip vorschau-chip" style="${stil}" onclick="vorschauSchalten('${k}')">${esc(catShort(sub, k))}</div>`;
      }).join("")}
      ${vorschauAus.length ? '<div class="chip vorschau-chip" style="background:#000; border-color:#000; color:#fff;" onclick="vorschauZuruecksetzen()">zurücksetzen</div>' : ""}
    </div>
    ${vorschauAus.length ? `
      <div style="padding:0 16px 12px;">
        <div style="font-size:15px; font-weight:bold;">Ohne ${esc(vorschauAus.map(k => catLabel(sub, k)).join(", "))}: ${fmtO(vorschauWert)}</div>
        <div style="font-size:12px;">statt ${fmtO(schnitt)} mit allem.</div>
      </div>` : ""}
    ${best ? `
      <div style="padding:0 16px 12px;">
        <div style="font-size:15px; font-weight:bold;">Bei durchgehend bester ${esc(best.cats.join(" und "))}: ${fmtO(best.best)}</div>
        <div style="font-size:12px;">statt ${fmtO(best.jetzt)} jetzt. Das ist der Unterschied, den die Mitarbeit noch machen kann.</div>
      </div>` : ""}`;

  const niveauZeile = (cls.stufe === 1) ? "" : `
    <div style="padding:10px 16px; border-bottom:1px solid #000; display:flex; align-items:center; gap:10px;">
      <span style="font-size:12px; font-weight:bold;">Leistungsniveau</span>
      <select style="margin-bottom:0; flex:1;" onchange="setNiveau(this.value)">
        <option value="ahs" ${s.niveau !== "standard" ? "selected" : ""}>Standard AHS</option>
        <option value="standard" ${s.niveau === "standard" ? "selected" : ""}>Standard</option>
      </select>
    </div>`;

  return `
    <div class="header" style="${headerStyle("home")}">
      <span class="back" style="${titleStyle("home")}" onclick="goHome('roster')">&lsaquo;</span>
      <span class="title" style="${titleStyle("home")}">${esc(cls.name)} &middot; ${esc(sub.fach)}</span>
    </div>
    ${assignBar}
    ${semesterLeiste("home")}
    <div style="padding:16px; display:flex; align-items:center; gap:14px; border-bottom:1px solid #000;">
      ${avatarHtml(s, false)}
      <div style="flex:1;">
        <div style="display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;">
          <span style="font-size:17px; font-weight:bold; text-decoration:underline; cursor:pointer;"
                title="Namen ändern" onclick="nameAendern()">${esc(s.name)}</span>
          <button class="ghost small" onclick="nameAendern()">ändern</button>
        </div>
        <div style="font-size:12px;">Klasse ${esc(cls.name)}</div>
        <div style="margin-top:6px; display:flex; gap:4px; flex-wrap:wrap;">
          <button class="ghost" onclick="pickAvatar('kamera')">Foto aufnehmen</button>
          <button class="ghost" onclick="pickAvatar('mediathek')">aus Mediathek</button>
          ${s.photo ? '<button class="ghost" onclick="removeAvatar()">Foto entfernen</button>' : ""}

/* ---------- NACHTRÄGLICH AUSBESSERN ----------
   Ein Tippfehler im Namen fällt oft erst Wochen später auf. Dann muss er sich
   in Sekunden ausbessern lassen, ohne dass Noten verloren gehen. Der Name
   hängt an der id, nicht am Text, also kostet das Umbenennen nichts. */
function nameAendern(){
  const cls = getClass(homeView.classId);
  const s = getStudent(cls, homeView.studentId);
  if(!s) return;
  const neu = prompt("Name ausbessern:", s.name);
  if(neu === null) return;
  const sauber = String(neu).trim();
  if(!sauber){ alert("Der Name darf nicht leer sein."); return; }
  const doppelt = cls.students.some(x => x.id !== s.id && x.name.trim().toLowerCase() === sauber.toLowerCase());
  if(doppelt && !confirm("In dieser Klasse gibt es schon jemanden mit diesem Namen. Trotzdem so nennen?")) return;
  s.name = sauber;
  s.updatedAt = Date.now();
  save();
  render();
}

/* Datum eines Eintrags ändern. Der Tag der Schularbeit ist nicht der Tag,
   an dem man sie korrigiert und einträgt. */
function datumGueltig(text){
  const t = String(text || "").trim();
  const m = t.match(/^(\d{1,2})\.(\d{1,2})\.?$/);
  if(!m) return null;
  const tag = parseInt(m[1], 10), monat = parseInt(m[2], 10);
  if(monat < 1 || monat > 12) return null;
  const tageImMonat = [31,29,31,30,31,30,31,31,30,31,30,31][monat - 1];
  if(tag < 1 || tag > tageImMonat) return null;
  return String(tag).padStart(2, "0") + "." + String(monat).padStart(2, "0") + ".";
}

function datumAendern(entryId){
  const cls = getClass(homeView.classId);
  const sub = getSubject(cls, homeView.subjectId);
  const e = sub && sub.entries.find(x => x.id === entryId);
  if(!e) return;
  const eingabe = prompt("Datum ändern, Format TT.MM.\n\nDer Tag der Leistung, nicht der Tag des Eintragens.", e.date || "");
  if(eingabe === null) return;
  const sauber = datumGueltig(eingabe);
  if(!sauber){ alert("Das Datum konnte ich nicht lesen. Bitte als TT.MM. eingeben, zum Beispiel 04.12."); return; }
  e.date = sauber;
  e.ts = Date.now();
  save();
  render();
}

function startWeight(sub, cat){
  if(isProzentMode(sub)) return 1;

/* Ein Feld für alles: "4" bei Diktat, "82", "82 %", "33/40" oder "33 von 40" sonst */
function parseLeistung(raw, cat, key){
  const t = String(raw || "").trim().replace(",", ".");
  if(!t) return null;
  if(cat === "diktat"){
    const f = parseFloat(t);
    if(isNaN(f) || f < 0) return null;
    const ganz = Math.round(f);
    return { value: noteFromFehler(ganz, key), basis: ganz + " Fehler" };
  }
  const bruch = t.match(/^([\d.]+)\s*(?:\/|von)\s*([\d.]+)$/i);
  if(bruch){
    const a = parseFloat(bruch[1]), b = parseFloat(bruch[2]);
    if(isNaN(a) || isNaN(b) || b <= 0) return null;
    const p = Math.max(0, Math.min(100, a / b * 100));
    return { value: noteFromProzent(p, key), basis: fmtPct(a) + " von " + fmtPct(b) + " Punkten, " + fmtPct(p) + " %" };
  }
  const roh = parseFloat(t.replace("%", ""));
  if(isNaN(roh)) return null;
  const p = Math.max(0, Math.min(100, roh));
  return { value: noteFromProzent(p, key), basis: fmtPct(p) + " %" };
}

/* ---------- SCHNELLERFASSUNG ----------
   Der kurze Weg für den Alltag: Kategorie einmal wählen, danach je
   Schüler:in ein einziger Tipp. Jeder Tipp speichert sofort, ein zweiter
   Tipp auf dieselbe Zeile bessert aus. */

function goSchnell(){
  const sub = getSubject(getClass(homeView.classId), homeView.subjectId);
  const cats = activeCats(sub);
  if(cats.indexOf(homeView.newNoteCat) === -1) homeView.newNoteCat = cats[0] || "mitarbeit";
  homeView.noteWeight = startWeight(sub, homeView.newNoteCat);
  homeView.schnellIds = {};
  homeView.schnellMax = null;
  homeView.schnellThema = null;
  homeView.schnellArbeit = nummeriert(sub, homeView.newNoteCat)
    ? Math.min(ARBEITEN_MAX, hoechsteArbeitNr(sub, homeView.newNoteCat) + 1) : null;
  homeView.screen = "schnell";
  render();
}

function schnellCat(cat){
  const sub = getSubject(getClass(homeView.classId), homeView.subjectId);
  homeView.newNoteCat = cat;
  homeView.noteWeight = startWeight(sub, cat);
  homeView.schnellIds = {};
  homeView.schnellMax = null;
  homeView.schnellThema = null;
  homeView.schnellArbeit = nummeriert(sub, cat)
    ? Math.min(ARBEITEN_MAX, hoechsteArbeitNr(sub, cat) + 1) : null;
  render();
}

/* Punkteeingabe: die Höchstpunktezahl wird einmal für die ganze Klasse
   eingetragen, danach genügt je Zeile die erreichte Punktezahl. Die Note
   rechnet die App aus dem Leistungsniveau der jeweiligen Person. */
function schnellMax(wert){
  const roh = String(wert || "").trim().replace(",", ".");
  const zahl = parseFloat(roh);
  homeView.schnellMax = (isNaN(zahl) || zahl <= 0) ? null : zahl;
  render();
}

function schnellPunkte(studentId, roh){
  const cls = getClass(homeView.classId);
  const sub = getSubject(cls, homeView.subjectId);
  const s = getStudent(cls, studentId);
  const max = homeView.schnellMax;
  if(!sub || !s || !max) return;
  const text = String(roh || "").trim().replace(",", ".");
  if(text === ""){ schnellLoeschen(studentId); return; }
  const punkte = parseFloat(text);
  if(isNaN(punkte) || punkte < 0){ render(); return; }
  const prozent = Math.max(0, Math.min(100, (punkte / max) * 100));
  const note = noteFromProzent(prozent, schluesselKey(cls, s));
  const basis = fmtPct(punkte) + " von " + fmtPct(max) + " Punkten, " + fmtPct(prozent) + " %";
  schnellSpeichern(studentId, { value: note, basis: basis });
}

/* Gemeinsamer Kern: legt an oder bessert den in diesem Durchgang
   erzeugten Eintrag aus, statt einen zweiten anzulegen. */
function schnellSpeichern(studentId, daten){
  const sub = getSubject(getClass(homeView.classId), homeView.subjectId);
  const cat = homeView.newNoteCat;
  if(!sub) return;
  const bekannt = homeView.schnellIds[studentId];
  const vorhanden = bekannt ? sub.entries.find(e => e.id === bekannt) : null;
  const thema = homeView.schnellThema || null;
  if(vorhanden && vorhanden.type === "note"){
    vorhanden.value = daten.value;
    vorhanden.basis = daten.basis || null;
    vorhanden.thema = thema;
    vorhanden.arbeit = homeView.schnellArbeit || null;
    vorhanden.ts = Date.now();
  } else {
    if(vorhanden) sub.entries = sub.entries.filter(e => e.id !== vorhanden.id);
    const eintrag = { id: uid(), studentId: studentId, type: "note", cat: cat,
      value: daten.value, w: typeof homeView.noteWeight === "number" ? homeView.noteWeight : 1,
      basis: daten.basis || null, thema: thema, arbeit: homeView.schnellArbeit || null,
      ts: Date.now(), sem: semesterFuerNeu(), date: today(),
      label: catLabel(sub, cat) };
    sub.entries.push(eintrag);
    homeView.schnellIds[studentId] = eintrag.id;
  }
  save();
  render();
}

/* Nicht mitgeschrieben, für eine ganze Zeile */
function schnellFehlt(studentId){
  const sub = getSubject(getClass(homeView.classId), homeView.subjectId);
  const cat = homeView.newNoteCat;
  if(!sub) return;
  const bekannt = homeView.schnellIds[studentId];
  if(bekannt) sub.entries = sub.entries.filter(e => e.id !== bekannt);
  const eintrag = { id: uid(), studentId: studentId, type: "fehlt", cat: cat,
    thema: homeView.schnellThema || null, arbeit: homeView.schnellArbeit || null,
    ts: Date.now(), sem: semesterFuerNeu(), date: today() };
  sub.entries.push(eintrag);
  homeView.schnellIds[studentId] = eintrag.id;
  save();
  render();
}

/* Note über die Kacheln. Läuft über denselben Kern wie die Punkteeingabe,
   damit ein vorher gesetzter Vermerk "nicht mitgeschrieben" sauber ersetzt
   wird statt daneben stehen zu bleiben. */
function schnellNote(studentId, wert){
  schnellSpeichern(studentId, { value: wert, basis: null });

function schnellStufe(studentId, index){
  const cls = getClass(homeView.classId);
  const sub = getSubject(cls, homeView.subjectId);
  const cat = homeView.newNoteCat;
  if(!sub) return;
  const bekannt = homeView.schnellIds[studentId];
  let vorhanden = bekannt ? sub.entries.find(e => e.id === bekannt) : null;
  if(vorhanden && vorhanden.type !== "stufe"){
    sub.entries = sub.entries.filter(e => e.id !== vorhanden.id);
    vorhanden = null;
  }
  if(vorhanden){
    vorhanden.stufe = index;
    vorhanden.label = stufenListe(sub, cat)[index];
    vorhanden.thema = homeView.schnellThema || null;
    vorhanden.ts = Date.now();
  } else {
    const eintrag = { id: uid(), studentId: studentId, type: "stufe", cat: cat,
      stufe: index, label: stufenListe(sub, cat)[index],
      thema: homeView.schnellThema || null, ts: Date.now(),
      sem: semesterFuerNeu(), date: today() };

    homeView.schnellIds[studentId] = eintrag.id;

  render();
}

function renderSchnell(){
  const cls = getClass(homeView.classId);
  const sub = getSubject(cls, homeView.subjectId);
  if(!cls || !sub) return renderHomeList();

  const cats = activeCats(sub);
  let cat = homeView.newNoteCat;
  if(cats.indexOf(cat) === -1){ cat = cats[0] || "mitarbeit"; homeView.newNoteCat = cat; }
  const stufenModus = istStufenCat(sub, cat);
  const col = catCol(sub, cat);

  const chips = cats.map(k => {
    const c = catCol(sub, k);
    const aktiv = k === cat;
    const style = aktiv
      ? `background:${c.fg}; border-color:${c.fg}; color:#fff;`
      : `background:${c.bg}; border-color:${c.fg}; color:${c.fg};`;
    return `<div class="chip" style="${style}" onclick="schnellCat('${k}')">${catShort(sub,k)}</div>`;
  }).join("");

  const stufen = stufenListe(sub, cat);
  const gesetzt = Object.keys(homeView.schnellIds || {}).length;

  const punkteModus = !stufenModus && hasSchluessel(cat) && cat !== "diktat" && homeView.schnellMax;

  const zeilen = cls.students.map(s => {
    const id = homeView.schnellIds[s.id];
    const eintrag = id ? sub.entries.find(e => e.id === id) : null;
    const fehlt = eintrag && eintrag.type === "fehlt";
    let felder;

    if(stufenModus){
      felder = `<div class="schnell-stufen">` + stufen.map((t, i) => {
        const g = stufenFarbe(i, stufen.length);
        const sel = eintrag && eintrag.stufe === i;
        const style = sel
          ? `background:${g.fg}; border-color:${g.fg}; color:#fff;`
          : `background:${g.bg}; border-color:${g.fg}; color:${g.fg};`;
        return `<div class="schnell-stufe" style="${style}" title="${esc(t)}" onclick="schnellStufe('${s.id}',${i})">${esc(stufenZeichen(cat, i, stufen.length))}</div>`;
      }).join("") + `</div>`;

    } else if(punkteModus){
      const wert = (eintrag && eintrag.type === "note" && eintrag.basis)
        ? (eintrag.basis.split(" von ")[0] || "") : "";
      const anzeige = fehlt
        ? `<span class="schnell-ergebnis" style="color:#4A4943;">&ndash;</span>`
        : (eintrag && eintrag.type === "note"
            ? `<span class="schnell-ergebnis" style="color:${gradeColor(eintrag.value).fg};">${eintrag.value}</span>`

    } else {
      felder = `<div class="schnell-tiles">` + [1,2,3,4,5].map(v => {
        const g = gradeColor(v);
        const sel = eintrag && eintrag.type === "note" && eintrag.value === v;
        const style = sel
          ? `background:${g.fg}; border-color:${g.fg}; color:#fff;`
          : `background:${g.bg}; border-color:${g.fg}; color:${g.fg};`;
        return `<div class="schnell-tile" style="${style}" onclick="schnellNote('${s.id}',${v})">${v}</div>`;
      }).join("") + `</div>`;
    }

    /* Feld für alle, die nicht mitgeschrieben haben */
    const fehltFeld = stufenModus ? "" :
      `<div class="schnell-tile schnell-fehlt" title="nicht mitgeschrieben"
            style="${fehlt ? "background:#4A4943; border-color:#4A4943; color:#fff;" : "background:#F1EFE8; border-color:#4A4943; color:#4A4943;"}"
            onclick="schnellFehlt('${s.id}')">&ndash;</div>`;

    const zurueck = eintrag ? `<button class="ghost small" title="Eintrag wieder entfernen" onclick="schnellLoeschen('${s.id}')">&times;</button>` : "";
    return `<div class="schnell-zeile">
      <div class="schnell-name">${esc(s.name)}</div>
      ${felder}${fehltFeld}${zurueck}
    </div>`;
  }).join("");

  /* Ein Thema für die ganze Runde. Wird beim Tippen mitgespeichert und
     nachträglich auch auf schon gesetzte Zeilen übernommen. */
  const themaZeile = `
    <div class="feinbereich" style="border-top:none; padding-bottom:6px;">
      <div class="feinzeile">
        <span class="feinlabel">Thema, freiwillig</span>
        <input type="text" id="schnellThemaInput" style="margin-bottom:0; flex:1;"
               value="${esc(homeView.schnellThema || "")}"

    </div>`;

  /* Höchstpunktezahl einmal für die ganze Klasse */
  const punkteZeile = (stufenModus || !hasSchluessel(cat) || cat === "diktat") ? "" : `
    <div class="feinbereich" style="border-top:none; padding-bottom:6px;">
      <div class="feinzeile">
        <span class="feinlabel">Punkte gesamt</span>
        <input type="text" id="maxInput" inputmode="decimal" style="margin-bottom:0; width:90px; flex-shrink:0;"
               value="${homeView.schnellMax ? esc(fmtPct(homeView.schnellMax)) : ""}"
               placeholder="z. B. 40" onchange="schnellMax(this.value)">
        <span style="font-size:11px;">${homeView.schnellMax
          ? "Jetzt je Zeile nur die erreichten Punkte eintragen."
          : "Leer lassen, dann werden die Noten direkt angetippt."}</span>
      </div>
    </div>`;

  const gewichtZeile = stufenModus ? "" : `
    <div class="feinbereich" style="border-top:none;">
      <div class="feinzeile">
        <span class="feinlabel">Gewichtung für alle</span>
        <span id="noteWeightVal" style="font-weight:bold;">${fmtW(homeView.noteWeight)}</span>
        <button class="ghost" onclick="toggleGewicht()">${homeView.zeigeGewicht ? "zuklappen" : "ändern"}</button>
      </div>
      ${homeView.zeigeGewicht ? `<input type="range" min="0" max="3" step="0.5" value="${homeView.noteWeight}" oninput="updateNoteWeight(this.value)" style="margin-top:6px;">` : ""}
    </div>`;

  return `
    <div class="header" style="${headerStyle("home")}">
      <span class="back" style="${titleStyle("home")}" onclick="goHome('roster')">&lsaquo;</span>
      <span class="title" style="${titleStyle("home")}">Ganze Klasse bewerten</span>
      <div class="sub">${esc(cls.name)} &middot; ${esc(sub.fach)} &middot; ${SEM_LABELS[semesterFuerNeu()]}</div>
    </div>
    <div class="chips">${chips}</div>
    <div class="helptext" style="color:${col.fg};">${stufenModus
      ? catLabel(sub, cat) + ": ein Tipp je Zeile, wird sofort gespeichert. " + zaehltText(sub, cat) + "."
      : "Ein Tipp je Zeile genügt, die Note wird sofort gespeichert. Nochmal tippen bessert aus."}</div>
    ${nummeriert(sub, cat) ? arbeitWahl(sub, cat, homeView.schnellArbeit, "setSchnellArbeit") : ""}
    ${themaZeile}
    ${gewichtZeile}
    ${punkteZeile}
    ${zeilen || '<div class="helptext">Noch keine Schüler:innen in dieser Klasse.</div>'}
    <div class="footer">
      <button onclick="goHome('roster')">Fertig${gesetzt ? " (" + gesetzt + " eingetragen)" : ""}</button>
      ${(gesetzt && nummeriert(sub, cat) && homeView.schnellArbeit)
        ? `<button class="gross" onclick="goArbeit('${cls.id}','${sub.id}','${cat}','${homeView.schnellArbeit}')">Auswertung dieser ${esc(catLabel(sub, cat))} ansehen</button>`
        : ""}
    </div>
  `;
}

/* Bilder werden vor dem Speichern verkleinert. Beim Porträt zusätzlich
   quadratisch aus der Mitte beschnitten, damit der runde Avatar passt. */
function verkleinern(file, maxKante, quality, quadratisch, fertig){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      if(quadratisch){
        const kante = Math.min(img.width, img.height);
        canvas.width = maxKante;
        canvas.height = maxKante;
        ctx.drawImage(img, (img.width - kante) / 2, (img.height - kante) / 2, kante, kante, 0, 0, maxKante, maxKante);
      } else {
        const scale = Math.min(1, maxKante / img.width);
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      }
      fertig(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = function(){ alert("Dieses Bild konnte nicht gelesen werden."); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
