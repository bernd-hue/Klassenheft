  drucken(blattSchueler(cls, s));
}

function printKlasse(classId, subjectId){
  const cls = getClass(classId);
  const sub = getSubject(cls, subjectId);
  if(!cls || !sub) return;
  drucken(blattKlasse(cls, sub));
}

/* Alle Blätter einer Klasse auf einmal, ein Blatt je Schüler:in.
   Praktisch am Abend vor dem Elternsprechtag. */
function printAlleSchueler(classId){
  const cls = getClass(classId);
  if(!cls || !cls.students.length) return;
  drucken(cls.students.map(s => blattSchueler(cls, s)).join(""));
}

/* ---------- STATISTIK ---------- */

function goStat(screen, classId, subjectId){
  statView.screen = screen;
  if(classId !== undefined && classId !== null) statView.classId = classId;
  if(subjectId !== undefined && subjectId !== null) statView.subjectId = subjectId;
  render();
}

function renderStat(){
  if(statView.screen === "arbeit") return renderStatArbeit();
  return statView.screen === "detail" ? renderStatDetail() : renderStatList();
}

/* Eine einzelne Arbeit für sich, mit allem was dazugehört. */
function goArbeit(classId, subjectId, cat, kennung){
  statView.screen = "arbeit";
  statView.classId = classId;
  statView.subjectId = subjectId;
  statView.arbeitCat = cat;
  statView.arbeitKennung = String(kennung);
  render();
}

function renderStatArbeit(){
  const cls = getClass(statView.classId);
  const sub = getSubject(cls, statView.subjectId);
  if(!cls || !sub) return renderStatList();
  const liste = arbeiten(sub, statView.arbeitCat);
  const a = liste.find(x => arbeitKennung(x) === statView.arbeitKennung);
  if(!a) return renderStatDetail();

  const i = liste.indexOf(a);
  const v = arbeitVergleich(liste, i);
  const label = catLabel(sub, statView.arbeitCat);
  const alle = arbeitEintraege(cls, sub, statView.arbeitCat, arbeitKennung(a));
  const mitNote = alle.filter(x => x.e.type === "note")
    .sort((x, y) => x.e.value - y.e.value || x.s.name.localeCompare(y.s.name));
  const ohneNote = alle.filter(x => x.e.type === "fehlt");

  const schnitteAlle = liste.map(x => x.schnitt).filter(x => x !== null);
  const mittelAller = schnitteAlle.length
    ? schnitteAlle.reduce((x, y) => x + y, 0) / schnitteAlle.length : null;

  const zeilen = mitNote.map(x => {
    const g = gradeColor(x.e.value);
    return `<div class="row" style="cursor:default;">
      <div style="display:flex; align-items:center; gap:10px;">
        ${avatarHtml(x.s, true)}
        <div class="name" style="font-size:14px;">${esc(x.s.name)}</div>
      </div>
      <div style="text-align:right; display:flex; gap:10px; align-items:center;">
        ${x.e.basis ? '<span style="font-size:11px;">' + esc(x.e.basis) + "</span>" : ""}
        <span class="grade" style="color:${g.fg}; font-size:16px;">${x.e.value}</span>
      </div>
    </div>`;
  }).join("");

  const fehlZeilen = ohneNote.map(x => `<div class="row" style="cursor:default; opacity:0.7;">
      <div style="display:flex; align-items:center; gap:10px;">
        ${avatarHtml(x.s, true)}
        <div class="name" style="font-size:14px;">${esc(x.s.name)}</div>
      </div>
      <span style="font-size:12px;">nicht mitgeschrieben</span>
    </div>`).join("");

  const tf = tendenzFarbe(a.schnitt);

  return `
    <div class="header" style="${headerStyle("statistik")}">
      <span class="back" style="${titleStyle("statistik")}" onclick="goStat('detail')">&lsaquo;</span>
      <span class="title" style="${titleStyle("statistik")}">${a.nummer}. ${esc(label)}</span>
      <div class="sub">${esc(cls.name)} &middot; ${esc(sub.fach)} &middot; ${esc(a.datum)}${a.thema ? " &middot; " + esc(a.thema) : ""}</div>
    </div>
    <div style="padding:16px; border-bottom:2px solid #000; background:${tf.bg};">
      <div style="display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;">
        <span style="font-size:36px; font-weight:bold; line-height:1; color:${tf.fg};">${fmtO(a.schnitt)}</span>
        <span style="font-size:15px; font-weight:bold; color:${tf.fg};">${esc(notenWort(a.schnitt))}</span>
      </div>
      <div style="font-size:11px; margin-top:6px;">
        ${a.anzahl} geschrieben${a.fehlt ? ", " + a.fehlt + " nicht mitgeschrieben" : ""}${
        a.negativ ? ", " + a.negativ + "\u00d7 Nicht genügend" : ", kein Nicht genügend"}${
        v ? " &middot; " + esc(v.text) : " &middot; erste " + esc(label)}${
        mittelAller !== null && liste.length > 1
          ? " &middot; Mittel aller " + liste.length + ": " + fmt(mittelAller) : ""}
      </div>
    </div>
    <div class="chart">${verteilungSvg(sub, undefined, 380, 130, a.verteilung)}</div>
    <div class="label">NOTENSPIEGEL</div>
    <div style="padding:0 16px 12px; overflow-x:auto;">${spiegelTabelle(a.verteilung)}</div>
    <div class="label" style="border-top:2px solid #000;">BESTE UND SCHWÄCHSTE NOTE</div>
    <div class="helptext">Beste Note ${a.beste}, schwächste Note ${a.schlechteste}.${
      a.anzahl > 1 ? " Die Liste unten ist nach der Note sortiert." : ""}</div>
    <div class="label" style="border-top:2px solid #000;">ALLE NOTEN</div>
    ${zeilen || '<div class="helptext">Keine Noten.</div>'}
    ${fehlZeilen}
    <div class="footer">
      <button onclick="printArbeit('${cls.id}','${sub.id}','${statView.arbeitCat}','${arbeitKennung(a)}')">Diese ${esc(label)} drucken</button>
      <button class="ghost" onclick="goStat('detail')">zurück zur Übersicht</button>
    </div>
  `;
}

function renderStatList(){
  const rows = allSubjectRows().map(({cls, sub}) => `
    <div class="row" onclick="goStat('detail','${cls.id}','${sub.id}')">
      <div>
        <div class="name">${cls.name} &middot; ${sub.fach}</div>
        <div class="sub">${cls.students.length} Schüler:innen</div>
      </div>
      <div class="chev" style="${titleStyle("statistik")}">&rsaquo;</div>
    </div>`).join("");
  return `
    <div class="header" style="${headerStyle("statistik")}">
      <div class="title" style="${titleStyle("statistik")}">Statistik</div>
      <div class="sub">Auswertung je Klasse und Fach</div>
    </div>
    ${semesterLeiste("statistik")}
    ${rows || '<div class="helptext">Noch nichts angelegt.</div>'}
  `;
}

function renderStatDetail(){
  const cls = getClass(statView.classId);
  const sub = getSubject(cls, statView.subjectId);
  if(!cls || !sub) return renderStatList();

  const je = cls.students.map(s => ({ s: s, schnitt: computeSchnitt(sub, s.id),
    fuenfer: wertendeNoten(sub, s.id).filter(n => n.value === 5).length,
    ...countPosNeg(sub, s.id) }));
  const avgs = je.map(p => p.schnitt).filter(v => v !== null);
  const klassenschnitt = avgs.length ? avgs.reduce((a,b) => a+b, 0) / avgs.length : null;
  const totalPos = je.reduce((a,p) => a + p.pos, 0);
  const totalNeg = je.reduce((a,p) => a + p.neg, 0);
  const sortiert = je.slice().sort((a,b) => (b.schnitt ?? 0) - (a.schnitt ?? 0));

  const rows = sortiert.map(p => {
    const bad = p.schnitt !== null && p.schnitt >= 4.0;
    return `<div class="row" style="cursor:default;">
      <div style="display:flex; align-items:center; gap:10px;">
        ${avatarHtml(p.s, true)}
        <div class="name" style="font-size:14px;">${p.s.name}</div>
      </div>
      <div style="text-align:right; display:flex; gap:10px; align-items:center; flex-shrink:0;">
        ${(p.pos + p.neg) > 0
          ? '<span style="font-size:12px;"><span class="green">' + p.pos + '</span>/<span class="' + (p.neg > p.pos ? "red" : "") + '">' + p.neg + "</span></span>"
          : (p.fuenfer ? '<span style="font-size:11px; color:#A8241C;">' + p.fuenfer + "\u00d7 5</span>" : "")}
        <span class="val ${bad ? "red" : ""}" style="font-size:14px; white-space:nowrap;">${fmtO(p.schnitt)}</span>
        <button class="ghost" onclick="printSchueler('${cls.id}','${p.s.id}')">Blatt</button>
      </div>
    </div>`;
  }).join("");

  const verteilung = verteilungSvg(sub);
  const verteilungZahlen = spiegelVerteilung(sub);
  const spiegelGesamt = spiegelTabelle(verteilungZahlen);
  const negGesamt = verteilungZahlen[4];
  const notenGesamt = verteilungZahlen.reduce((x, y) => x + y, 0);

  /* Stufen zählen nicht in den Schnitt, gehören aber in die Auswertung */
  const stufenUebersicht = activeCats(sub).filter(k => istStufenCat(sub, k) && !stufeZaehlt(sub, k)).map(k => {
    const c = catCol(sub, k);
    const liste = sub.entries.filter(e => e.type === "stufe" && e.cat === k &&
      (aktivesSemester() === "alle" || eintragSemester(e) === aktivesSemester()));
    if(!liste.length) return "";
    const zaehler = {};
    liste.forEach(e => { const t = stufenText(sub, e); zaehler[t] = (zaehler[t] || 0) + 1; });
    const teile = stufenListe(sub, k).filter(t => zaehler[t]).map(t => zaehler[t] + "× " + t);
    return `<div class="entry">
      <span class="catdot" style="background:${c.fg};"></span>
      <div class="txt">${esc(catLabel(sub, k))} &middot; ${esc(teile.join(", "))}</div>
      <span class="badge" style="border-color:${c.fg}; color:${c.fg}; background:${c.bg};">zählt nicht</span>
    </div>`;
  }).join("");

  /* ---------- Jede Arbeit als Kachel, ganz oben ----------
     Bernd hat die Auswertung nicht gefunden, weil sie hinter einer
     Tabellenzeile weit unten lag. Sie steht jetzt als Erstes. */
  const arbeitKacheln = notenCats(sub).map(k => {
    const liste = arbeiten(sub, k);
    if(!liste.length) return "";
    const c = catCol(sub, k);
    const kacheln = liste.map(a => {
      const tf = tendenzFarbe(a.schnitt);
      return `<div style="flex:1; min-width:132px; border:2px solid #000; border-radius:8px;
                   padding:10px; background:${tf.bg}; cursor:pointer;"
                   onclick="goArbeit('${cls.id}','${sub.id}','${k}','${arbeitKennung(a)}')">
        <div style="font-size:12px; font-weight:bold;">${a.nummer}. ${esc(catShort(sub, k))}</div>
        <div style="font-size:26px; font-weight:bold; line-height:1.1; color:${tf.fg};">${fmtO(a.schnitt)}</div>
        <div style="font-size:10px;">${esc(a.datum)}${a.thema ? " &middot; " + esc(a.thema) : ""}</div>
        <div style="font-size:10px; margin-top:3px;">${a.anzahl} geschrieben${
          a.negativ ? ", <b>" + a.negativ + "\u00d7 Nicht gen.</b>" : ""}</div>
        <div style="font-size:10px; text-decoration:underline;">Auswertung ansehen</div>
      </div>`;
    }).join("");
    return `<div class="label" style="border-top:2px solid #000; color:${c.fg};">${esc(catLabel(sub, k).toUpperCase())}</div>
      <div style="padding:0 16px 12px; display:flex; gap:8px; flex-wrap:wrap;">${kacheln}</div>`;
  }).join("");

  /* ---------- Schularbeiten und andere Arbeiten vergleichen ----------
     Gezeigt wird jede benotete Kategorie, in der es mindestens zwei Termine
     gibt. Bei nur einem Termin gibt es nichts zu vergleichen. */
  const vergleichBloecke = notenCats(sub).map(k => {
    const liste = arbeiten(sub, k);
    if(liste.length < 2) return "";
    const c = catCol(sub, k);
    const label = catLabel(sub, k);

    const zeilen = liste.map((a, i) => {
      const v = arbeitVergleich(liste, i);
      const farbe = !v ? "" : (v.richtung === "besser" ? "#2A6B2E" : (v.richtung === "schlechter" ? "#A8241C" : "#4A4943"));
      const pfeil = !v ? "" : (v.richtung === "besser" ? "\u2197" : (v.richtung === "schlechter" ? "\u2198" : "\u2192"));
      return `<tr class="vgl-zeile" onclick="goArbeit('${cls.id}','${sub.id}','${k}','${arbeitKennung(a)}')" title="Diese ${esc(label)} für sich ansehen">
        <td style="font-weight:bold; text-decoration:underline;">${a.nummer}.</td>
        <td>${esc(a.datum)}${a.thema ? '<br><span style="font-size:11px;">' + esc(a.thema) + "</span>" : ""}</td>
        <td style="text-align:center; font-weight:bold;">${fmt(a.schnitt)}</td>
        <td style="text-align:center;">${a.anzahl}${a.fehlt ? '<br><span style="font-size:11px;">+' + a.fehlt + " fehlt</span>" : ""}</td>
        <td style="text-align:center; color:${a.negativ ? "#A8241C" : "inherit"}; font-weight:${a.negativ ? "bold" : "normal"};">${a.negativ}</td>
        <td style="font-size:11px; color:${farbe};">${v ? pfeil + " " + esc(v.text) : "erste"}</td>
      </tr>`;
    }).join("");

    const schnitte = liste.map(a => a.schnitt).filter(v => v !== null);
    const beste = liste.reduce((a, x) => (a === null || x.schnitt < a.schnitt) ? x : a, null);
    const schwaechste = liste.reduce((a, x) => (a === null || x.schnitt > a.schnitt) ? x : a, null);
    const spanne = Math.max.apply(null, schnitte) - Math.min.apply(null, schnitte);

    /* Kleine Vielfache: je Arbeit dieselbe Verteilungsgrafik */
    const kleine = liste.map(a => `
      <div style="flex:1; min-width:150px;">
        <div style="font-size:11px; font-weight:bold; padding:0 0 2px;">${a.nummer}. ${esc(a.datum)} &middot; Ø ${fmt(a.schnitt)}</div>
        ${verteilungSvg(sub, undefined, 220, 100, a.verteilung)}
        <div style="font-size:10px; line-height:1.5;">${notenspiegel(a.verteilung)
          .filter(z => z.anzahl > 0)
          .map(z => z.anzahl + "\u00d7 " + z.wort).join("<br>")}</div>
      </div>`).join("");

    return `
      <div class="label" style="border-top:2px solid #000; color:${c.fg};">${esc(label.toUpperCase())} IM VERGLEICH</div>
      <div class="chart">${arbeitenSvg(liste, 380, 160)}</div>
      <div style="padding:0 16px 12px; overflow-x:auto;">
        <table class="vgl-tbl">
          <tr><th>Nr.</th><th>Termin</th><th>Ø</th><th>geschr.</th><th>Nicht<br>gen.</th><th>gegenüber der vorigen</th></tr>
          ${zeilen}
        </table>
      </div>
      <div class="helptext">
        Auf eine Zeile tippen, um diese ${esc(label)} für sich anzusehen.
        Am besten ausgefallen ist die <b>${beste.nummer}.</b> mit ${fmt(beste.schnitt)},
        am schwächsten die <b>${schwaechste.nummer}.</b> mit ${fmt(schwaechste.schnitt)},
        Unterschied ${fmt(spanne)} Notenstufen.
        ${liste.some(a => a.fehlt) ? "Wer nicht mitgeschrieben hat, geht in keinen Schnitt ein." : ""}
      </div>
      <div style="padding:0 16px 12px; display:flex; gap:12px; flex-wrap:wrap;">${kleine}</div>`;
  }).join("");

  const perCat = notenCats(sub).map(k => {
    const noten = wertendeNotenAlle(sub).filter(e => e.cat === k);
    if(!noten.length) return "";
    const mittel = noten.reduce((a,n) => a + n.value, 0) / noten.length;
    const c = catCol(sub, k);
    return `<div class="entry">
      <span class="catdot" style="background:${c.fg};"></span>
      <div class="txt">${catLabel(sub,k)}</div>
      <span class="badge" style="border-color:${c.fg}; color:${c.fg}; background:${c.bg};">${noten.length} Noten</span>
      <span class="grade">${fmtO(mittel)}</span>
    </div>`;
  }).join("");

  return `
    <div class="header" style="${headerStyle("statistik")}">
      <span class="back" style="${titleStyle("statistik")}" onclick="goStat('list')">&lsaquo;</span>
      <span class="title" style="${titleStyle("statistik")}">${cls.name} &middot; ${sub.fach}</span>
      <div class="sub">${SEM_LABELS[aktivesSemester()]}</div>
    </div>
    ${semesterLeiste("statistik")}
    <div class="stats">
      <div class="stat"><div class="val ${klassenschnitt !== null && klassenschnitt >= 4 ? "red" : ""}">${fmtO(klassenschnitt)}</div><div class="lbl">Klassenschnitt</div></div>
      ${(totalPos + totalNeg) > 0
        ? '<div class="stat"><div class="val"><span class="green">' + totalPos + '</span> / <span class="' + (totalNeg > totalPos ? "red" : "") + '">' + totalNeg + '</span></div><div class="lbl">Positiv / Negativ gesamt</div></div>'
        : '<div class="stat"><div class="val ' + (negGesamt ? "red" : "") + '">' + negGesamt + '</div><div class="lbl">Nicht genügend' + (notenGesamt ? " &middot; " + fmtPct((negGesamt * 100) / notenGesamt) + " % aller Noten" : "") + '</div></div>'}
    </div>
    ${arbeitKacheln}
    ${verteilung ? '<div class="label" style="border-top:2px solid #000;">VERTEILUNG ALLER NOTEN</div><div class="chart">' + verteilung + "</div>" : ""}
    ${spiegelGesamt ? '<div class="label">NOTENSPIEGEL</div><div style="padding:0 16px 12px; overflow-x:auto;">' + spiegelGesamt + "</div>" : ""}
    ${vergleichBloecke}
    <div class="label" style="border-top:2px solid #000;">SCHÜLER:INNEN</div>
    ${rows || '<div class="helptext">Noch keine Schüler:innen.</div>'}
    ${perCat ? '<div class="label" style="border-top:2px solid #000;">JE KATEGORIE</div>' + perCat : ""}
    ${stufenUebersicht ? '<div class="label" style="border-top:2px solid #000;">NUR VERMERKT, OHNE NOTE</div>' +
      '<div class="helptext">Du entscheidest je Fach, was in die Note einfließt. Umstellen unter Einstellungen, Fach auswählen, Abschnitt Benotet oder nur vermerkt.</div>' +
      stufenUebersicht : ""}
    <div class="label" style="border-top:2px solid #000;">ELTERNSPRECHTAG</div>
    <div class="helptext">Blatt mit Notenübersicht, Verlauf und Unterschriftenzeile. Im Druckdialog lässt es sich auch als PDF sichern und den Eltern mitgeben.</div>
    <div class="footer">
      <button onclick="printKlasse('${cls.id}','${sub.id}')">Klassenübersicht drucken</button>
      <button onclick="printAlleSchueler('${cls.id}')">Alle Einzelblätter drucken</button>
      ${notenCats(sub).filter(k => arbeiten(sub, k).length).map(k =>
        `<button onclick="printAlleArbeiten('${cls.id}','${sub.id}','${k}')">${esc(catShort(sub, k))}: alle auf einem Blatt</button>`).join("")}
    </div>
  `;
}

/* ---------- EINSTELLUNGEN ---------- */

function goSettings(screen, classId, subjectId){
  /* Ein anderes Fach oder ein Wechsel des Bildschirms klappt die Benennung
     der Stufen wieder zu. Sonst stünde sie beim nächsten Öffnen offen da,
     ohne dass man weiß, warum. */
  if(screen !== settingsView.screen || (subjectId !== undefined && subjectId !== settingsView.subjectId)){
    settingsView.stufenOffen = null;
  }
  settingsView.screen = screen;
  if(classId !== undefined && classId !== null) settingsView.classId = classId;
  if(subjectId !== undefined && subjectId !== null) settingsView.subjectId = subjectId;
  render();
}

function renderSettings(){
  return settingsView.screen === "detail" ? renderSettingsDetail() : renderSettingsList();
}

function renderSettingsList(){
  const rows = allSubjectRows().map(({cls, sub}) => `
    <div class="row" onclick="goSettings('detail','${cls.id}','${sub.id}')">
      <div>
        <div class="name">${cls.name} &middot; ${sub.fach}</div>
        <div class="sub">${SUBJECT_TEMPLATES[sub.template] ? SUBJECT_TEMPLATES[sub.template].label : "eigene Einstellung"}</div>
      </div>
      <div class="chev" style="${titleStyle("einstellungen")}">&rsaquo;</div>
    </div>`).join("");
  const tage = tageSeitSicherung();
  const standText = !state.settings.lastBackup
    ? "Noch keine Sicherung erstellt."
    : (tage === 0 ? "Heute schon gesichert."
      : (tage === 1 ? "Letzte Sicherung gestern." : "Letzte Sicherung vor " + tage + " Tagen."));
  const schriftChips = [["klein","Klein"],["normal","Normal"],["gross","Groß"]].map(([k,lbl]) => {
    const an = (state.settings.schrift || "normal") === k;
    const style = an ? "background:#000; border-color:#000; color:#fff;" : "background:#fff; border-color:#000; color:#000;";
    return `<div class="chip" style="${style}" onclick="setSchrift('${k}')">${lbl}</div>`;
  }).join("");

  const kopie = sicherheitskopieLesen();
  const kopieText = kopie
    ? "Die App hat am " + esc(kopieZeitText(kopie)) + " selbst eine Kopie angelegt, Anlass: " + esc(kopie.grund) + ". Sie liegt in diesem Gerät und enthält alles außer den Porträtfotos. Zurückholen führt sie mit dem jetzigen Stand zusammen, es geht nichts verloren."
    : "Sobald du eine neue Fassung des Programms öffnest oder einen Stand ersetzt, legt die App hier von selbst eine Kopie an. Bisher gibt es noch keine.";

  const ordnerText = kannOrdner()
    ? (ordnerHandle ? "Sicherungsordner ist gemerkt. Die Sicherung landet automatisch dort." : "Noch kein fester Ordner gewählt. Bis dahin landet die Sicherung im Ordner für Downloads.")
    : "Dieses Gerät kann keinen festen Ordner merken. Die Sicherung landet in den Downloads bzw. in der Dateien-App und lässt sich von dort ablegen, wo du möchtest.";

  return `
    <div class="header" style="${headerStyle("einstellungen")}">
      <div class="title" style="${titleStyle("einstellungen")}">Einstellungen</div>
      <div class="sub">Bewertung je Fach, Sicherung und Geräte</div>
    </div>
    ${backupBanner()}
    <div class="label">FÄCHER</div>
    ${rows || '<div class="helptext">Noch nichts angelegt.</div>'}

    <div class="label" style="border-top:2px solid #000;">ANGABEN FÜR DEN AUSDRUCK</div>
    <div style="padding:0 16px;">
      <span class="field-label">Lehrkraft</span>
      <input type="text" id="lehrkraftInput" value="${esc(state.settings.lehrkraft)}" placeholder="z. B. Bernd Stuhlhofer" onchange="setSetting('lehrkraft', this.value)">
      <span class="field-label">Schuljahr</span>
      <input type="text" id="schuljahrInput" value="${esc(state.settings.schuljahr)}" placeholder="z. B. 2026/27" onchange="setSetting('schuljahr', this.value)">
    </div>
    <div class="helptext">Erscheint im Kopf der Elternsprechtag-Blätter und in der Wochensicherung.</div>

    <div class="label" style="border-top:2px solid #000;">WOCHENSICHERUNG</div>
    <div class="helptext">${standText} Die App erinnert dich alle ${state.settings.intervallTage} Tage. Du bekommst eine Word-Datei zum Nachlesen und Bearbeiten und eine JSON-Datei zum Zurückspielen. ${ordnerText}</div>
    <div class="footer">
      <button onclick="sicherungErstellen()">Jetzt sichern</button>
      ${kannOrdner() ? '<button onclick="ordnerWaehlen()">Sicherungsordner wählen</button>' : ""}
    </div>
    <div class="slider-row">
      <div class="top"><span>Erinnerung alle</span><span id="intervallVal">${state.settings.intervallTage} Tage</span></div>
      <input type="range" min="3" max="30" step="1" value="${state.settings.intervallTage}" oninput="setIntervall(this.value)">
    </div>

    ${uebertragungBereich()}

    <div class="label" style="border-top:2px solid #000;">HANDY UND RECHNER ÜBER EINE DATEI</div>
    <div class="helptext">Am Gerät mit den neueren Einträgen auf Jetzt sichern tippen, die JSON-Datei über AirDrop, WLAN-Freigabe, Kabel oder Mail auf das andere Gerät bringen und dort auf Zusammenführen tippen. Es wird nichts überschrieben, fehlende Einträge kommen dazu. Nichts davon geht durch eine Cloud.${uebertragung.da ? "" : " Ohne Datei geht es mit dem Übertragungsprogramm im Ordner der App, siehe Anleitung."}</div>
    <div class="footer">
      <button onclick="starteImport('merge')">Sicherung zusammenführen</button>
      <button class="red" onclick="starteImport('ersetzen')">Alles ersetzen</button>
    </div>
    <div style="padding:0 16px 8px;">
      <span class="field-label">Name dieses Geräts</span>
      <input type="text" id="geraetInput" value="${esc(state.settings.geraet)}" placeholder="z. B. iPad Schule oder MacBook" onchange="setSetting('geraet', this.value)">
    </div>

    <div class="label" style="border-top:2px solid #000;">DARSTELLUNG</div>
    <div class="helptext">Schriftgröße für dieses Gerät. Am Handy meist klein oder normal, am iPad und am Rechner oft groß angenehmer.</div>
    <div class="chips">${schriftChips}</div>

    <div class="label" style="border-top:2px solid #000;">SICHERHEITSKOPIE IM GERÄT</div>
    <div class="helptext">${kopieText}</div>
    ${kopie ? '<div class="footer"><button onclick="sicherheitskopieZurueck()">Sicherheitskopie zurückholen</button></div>' : ""}

    ${(function(){
      const sp = speicherStand();
      if(!sp) return "";
      const eng = sp.anteil >= 70;
      const farbe = sp.anteil >= 85 ? "#A8241C" : (eng ? "#96650F" : "#2A6B2E");
      return `<div class="label" style="border-top:2px solid #000;">SPEICHER DIESES GERÄTS</div>
        <div style="padding:0 16px 4px;">
          <div style="display:flex; align-items:baseline; gap:8px;">
            <span style="font-size:17px; font-weight:bold; color:${farbe};">${fmtPct(sp.anteil)} % belegt</span>
            <span style="font-size:11px;">${Math.round(sp.belegt / 1024)} KB von etwa ${Math.round(sp.grenze / 1024 / 1024)} MB</span>
          </div>
          <div style="height:10px; border:1.5px solid #000; border-radius:5px; margin-top:5px; overflow:hidden;">
            <div style="height:100%; width:${Math.max(1, Math.round(sp.anteil))}%; background:${farbe};"></div>
          </div>
        </div>
        <div class="helptext">${sp.fotos
          ? sp.fotos + (sp.fotos === 1 ? " Foto belegt " : " Fotos belegen ") + fmtPct(sp.fotoAnteil) + " % davon. "
          : "Noch keine Fotos gespeichert. "}${
          eng
            ? "<b>Es wird eng.</b> Sichere jetzt und lösche danach alte Fotos, sonst lässt sich irgendwann nichts mehr eintragen. Die Sicherung enthält die Fotos weiterhin."
            : "Fotos brauchen mit Abstand den meisten Platz. Ein Foto belegt etwa 40 KB, es passen also einige hundert."}</div>`;
    })()}

    <div class="label" style="border-top:2px solid #000;">FASSUNG</div>
    <div class="helptext">Geladen ist <b>Klassenheft, Version ${APP_FASSUNG}</b>.${
      neuereFassung
        ? " Auf der Adresse liegt bereits <b>Version " + esc(neuereFassung) +
          "</b>. Dein Browser zeigt noch die alte, weil er sie zwischengespeichert hat."
        : (location.protocol.indexOf("http") === 0
            ? " Das ist die Fassung, die auch auf der Adresse liegt."
            : " Geöffnet als Datei, nicht über eine Adresse.")
    }</div>
    ${neuereFassung
      ? '<div class="footer"><button class="gross" onclick="neueFassungHolen()">Version ' + esc(neuereFassung) + ' jetzt laden</button></div>' +
        '<div class="helptext">Deine Klassen und Noten bleiben dabei erhalten. Sie liegen in einem eigenen Speicher, den das Aktualisieren nicht berührt.</div>'
      : ""}

    <div class="helptext" style="border-top:2px solid #000;">Testfassung. Alle Daten bleiben lokal auf diesem Gerät, kein Internet und keine Cloud nötig. Vor einem Gerätewechsel oder dem Löschen der Browserdaten unbedingt eine Sicherung erstellen.</div>
  `;
}

function setSetting(feld, wert){
  state.settings[feld] = String(wert || "").trim();
  save();
}

const SCHRIFT_SKALA = { klein: 0.9, normal: 1, gross: 1.2 };

function schriftAnwenden(){
  const wert = SCHRIFT_SKALA[state.settings.schrift] || 1;
  document.documentElement.style.setProperty("--skala", String(wert));
}

function setSchrift(wert){
  state.settings.schrift = (wert === "klein" || wert === "gross") ? wert : "normal";
  save();
  schriftAnwenden();
  render();
}

function setIntervall(wert){
  state.settings.intervallTage = parseInt(wert, 10) || 7;
  const el = document.getElementById("intervallVal");
  if(el) el.textContent = state.settings.intervallTage + " Tage";
  save();
}

function renderSettingsDetail(){
  const cls = getClass(settingsView.classId);
  const sub = getSubject(cls, settingsView.subjectId);
  if(!cls || !sub) return renderSettingsList();
  const prozent = isProzentMode(sub);
  const cats = activeCats(sub);

  const tplOpts = Object.keys(SUBJECT_TEMPLATES).map(k =>
    `<option value="${k}" ${sub.template === k ? "selected" : ""}>${SUBJECT_TEMPLATES[k].label}</option>`).join("");

  const stufeChips = [[1,"1. Klasse"],[2,"2. bis 4. Klasse"]].map(([k,lbl]) => {
    const active = (cls.stufe || 2) === k;
    const style = active ? "background:#000; border-color:#000; color:#fff;" : "background:#fff; border-color:#000; color:#000;";
    return `<div class="chip" style="${style}" onclick="setStufe(${k})">${lbl}</div>`;
  }).join("");

  const catToggles = allCatKeys(sub).map(k => {
    const c = catCol(sub, k);
    const on = cats.indexOf(k) !== -1;
    return `<label class="comp-check" style="padding:8px 0;">
      <input type="checkbox" ${on ? "checked" : ""} onchange="toggleCat('${k}', this.checked)">

  const modeChips = [["multiplikator","Faktor je Note"],["prozent","Anteil in Prozent"]].map(([k,lbl]) => {
    const active = (prozent ? "prozent" : "multiplikator") === k;

    return `<div class="chip" style="${style}" onclick="setWeightMode('${k}')">${lbl}</div>`;

function updateWeight(cat, value){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const v = parseFloat(value);
  sub.weights[cat] = v;
  sub.template = "eigen";
  const el = document.getElementById("val_" + cat);
  if(el) el.textContent = isProzentMode(sub) ? fmtPct(v) + " %" : fmtW(v);
  const box = document.getElementById("pctSumBox");
  if(box && isProzentMode(sub)){
    const summe = activeCats(sub).reduce((a,k) => a + (typeof sub.weights[k] === "number" ? sub.weights[k] : 0), 0);
    box.textContent = "Summe " + fmtPct(summe) + " %. Die App rechnet die Anteile automatisch hoch, die Summe muss also nicht genau 100 sein.";
  }
  save();
}

function setWeightMode(mode){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  if(sub.weightMode === mode) return;
  const hatNoten = sub.entries.some(e => e.type === "note");
  if(hatNoten && !confirm("Der Notenschnitt wird danach anders berechnet. Eingetragene Noten bleiben erhalten. Umstellen?")) return;
  sub.weightMode = mode;
  sub.template = "eigen";
  const cats = activeCats(sub);
  cats.forEach(k => {
    const w = sub.weights[k];
    if(mode === "prozent") sub.weights[k] = (typeof w === "number" && w > 3) ? w : Math.round((100 / cats.length) * 2) / 2;
    else sub.weights[k] = (typeof w === "number" && w <= 3) ? w : 1;
  });
  save();
  render();
}

function toggleCat(cat, on){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const liste = activeCats(sub);
  if(on){
    if(liste.indexOf(cat) === -1) liste.push(cat);
    if(typeof sub.weights[cat] !== "number") sub.weights[cat] = isProzentMode(sub) ? 10 : 1;
  } else {
    if(sub.entries.some(e => e.type === "note" && e.cat === cat)
       && !confirm("In " + catLabel(sub,cat) + " gibt es schon Noten. Beim Abschalten zählen sie nicht mehr im Notenschnitt. Trotzdem abschalten?")){
      render();
      return;
    }
    const i = liste.indexOf(cat);
    if(i !== -1) liste.splice(i, 1);
  }
  sub.cats = allCatKeys(sub).filter(k => liste.indexOf(k) !== -1);
  sub.template = "eigen";
  save();
  render();
}

function setStufe(stufe){
  const cls = getClass(settingsView.classId);
  cls.stufe = (stufe === 1) ? 1 : 2;
  save();
  render();
}

function reapplyTemplate(){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const sel = document.getElementById("tplSelect");
  if(!sel) return;
  const t = SUBJECT_TEMPLATES[sel.value];
  if(!t) return;
  if(!confirm("Vorlage " + t.label + " anwenden? Kategorien und Gewichtung werden überschrieben, eingetragene Noten bleiben erhalten.")) return;
  applyTemplate(sub, sel.value);
  save();
  render();
}

/* ---------- EIGENE BEURTEILUNGEN ---------- */

/* Kategorie zwischen Note und Stufen umstellen */
/* Eine Stufen-Kategorie zusätzlich in den Notenschnitt einrechnen.
   Die Stufen bekommen dafür feste Werte auf der Notenskala, es bleibt aber
   eine Einstufung und keine Note. */
/* Drei Zustände einer Kategorie ohne Note: keine Wirkung, Bonus, eigener
   Anteil. Immer nur einer davon ist gesetzt. */
function setStufenWirkung(cat, wirkung){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  if(!sub) return;
  if(!Array.isArray(sub.stufenZaehlt)) sub.stufenZaehlt = [];
  if(!Array.isArray(sub.stufenBonus)) sub.stufenBonus = [];
  const jetzt = istBonusCat(sub, cat) ? "bonus" : (stufeZaehlt(sub, cat) ? "anteil" : "nichts");
  if(jetzt === wirkung) return;

  if(wirkung === "anteil"){
    const werte = stufenListe(sub, cat).map((t, i) =>
      t + " = " + fmt(stufenWert(sub, { cat: cat, stufe: i }))).join(", ");
    if(!confirm(catLabel(sub, cat) + " mit einem eigenen Anteil in den Notenschnitt einrechnen?\n\n" +
                werte + "\n\nAchtung: Solange in den übrigen Kategorien noch keine Note steht, " +
                "trägt diese Kategorie allein den ganzen Anteil. Wenn du das nicht möchtest, nimm Bonus.")){ render(); return; }
  }
  if(wirkung === "bonus"){
    if(!confirm(catLabel(sub, cat) + " als Bonus wirken lassen?\n\n" +
                "Die Einstufungen werden zusammengezählt und verbessern oder verschlechtern den Notenschnitt, " +
                "höchstens um " + fmtB(bonusMax(sub)) + " Notenstufen. Ohne Noten in den übrigen Kategorien gibt es keinen Schnitt und damit auch keinen Bonus.")){ render(); return; }
  }

  sub.stufenZaehlt = sub.stufenZaehlt.filter(k => k !== cat);
  sub.stufenBonus = sub.stufenBonus.filter(k => k !== cat);
  if(wirkung === "anteil"){
    sub.stufenZaehlt.push(cat);
    if(typeof sub.weights[cat] !== "number") sub.weights[cat] = isProzentMode(sub) ? 10 : 1;
  } else if(wirkung === "bonus"){
    sub.stufenBonus.push(cat);
  }
  save();
  render();
}

/* Ausführliche Erklärung erst auf Wunsch aufklappen. Die Einstellungen
   sollen kurz aussehen, die Begründung soll trotzdem greifbar sein. */
function toggleHilfe(id){
  const el = document.getElementById(id);
  if(el) el.style.display = (el.style.display === "none") ? "inline" : "none";
}

function setBonusMax(wert){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  if(!sub) return;
  sub.bonusMax = parseFloat(wert);
  const el = document.getElementById("bonusMaxVal");
  if(el) el.textContent = fmtB(sub.bonusMax) + " Notenstufen";
  save();
}

/* Altbestand aus Fassung 8, als es nur zwei Zustände gab.  Führt auf
   setStufenWirkung, damit nie beides gleichzeitig gesetzt sein kann. */
function setStufeZaehlt(cat, an){
  setStufenWirkung(cat, an ? "anteil" : "nichts");
}

function setStufenCat(cat, aufStufen){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  if(!sub) return;
  if(!Array.isArray(sub.stufenCats)) sub.stufenCats = [];
  const istJetzt = istStufenCat(sub, cat);
  if(istJetzt === !!aufStufen) return;
  if(aufStufen && sub.entries.some(e => e.type === "note" && e.cat === cat)){
    if(!confirm("In " + catLabel(sub, cat) + " gibt es schon Noten. Sie bleiben erhalten, zählen aber ab jetzt nicht mehr in den Notenschnitt. Umstellen?")) { render(); return; }
  }
  if(!aufStufen && sub.entries.some(e => e.type === "stufe" && e.cat === cat)){
    if(!confirm("In " + catLabel(sub, cat) + " gibt es schon Einträge ohne Note. Sie bleiben erhalten und zählen weiterhin nicht mit. Auf Noten umstellen?")) { render(); return; }
  }
  sub.stufenCats = aufStufen
    ? sub.stufenCats.concat([cat])
    : sub.stufenCats.filter(k => k !== cat);
  if(!aufStufen){
    if(Array.isArray(sub.stufenZaehlt)) sub.stufenZaehlt = sub.stufenZaehlt.filter(k => k !== cat);
    if(Array.isArray(sub.stufenBonus)) sub.stufenBonus = sub.stufenBonus.filter(k => k !== cat);
  }
  if(!aufStufen && typeof sub.weights[cat] !== "number") sub.weights[cat] = isProzentMode(sub) ? 10 : 1;
  save();
  render();
}

/* ---------- STUFEN SELBST BENENNEN ----------
   Die Vorgabetexte passen für Hausübung und Mitarbeit, aber nicht für jede
   Kategorie, die eine Lehrkraft auf "ohne Note" stellt. Deshalb lässt sich
   jede Stufe je Fach umbenennen. Die Einträge hängen am Stufenindex, nicht
   am Text, Umbenennen kostet also keine Daten. */
function toggleStufenTexte(cat){
  settingsView.stufenOffen = (settingsView.stufenOffen === cat) ? null : cat;
  render();
}

function setStufenText(cat, index, text){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  if(!sub) return;
  if(!sub.stufenTexte || typeof sub.stufenTexte !== "object") sub.stufenTexte = {};
  const liste = stufenListe(sub, cat).slice();
  const neu = String(text || "").trim();
  if(!neu){
    /* Leeres Feld heißt: die Vorgabe für diese eine Stufe zurückholen */
    const vorgabe = STUFEN_LISTEN[cat] || STUFEN_LISTEN.hausuebung;
    liste[index] = vorgabe[index] || ("Stufe " + (index + 1));
  } else {
    liste[index] = neu;
  }
  sub.stufenTexte[cat] = liste;
  save();
  render();
}

/* Eine Stufe mehr oder weniger. Beim Entfernen wandern vorhandene Einträge
   der letzten Stufe nicht mit, deshalb die Rückfrage. */
function setStufenAnzahl(cat, richtung){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  if(!sub) return;
  if(!sub.stufenTexte || typeof sub.stufenTexte !== "object") sub.stufenTexte = {};
  const liste = stufenListe(sub, cat).slice();
  if(richtung > 0){
    if(liste.length >= 5){ alert("Mehr als fünf Stufen werden beim Eintragen unübersichtlich."); return; }
    liste.splice(liste.length - 1, 0, "neue Stufe");
  } else {
    if(liste.length <= 2){ alert("Weniger als zwei Stufen ergeben keine Auswahl."); return; }
    const letzte = liste.length - 1;
    const betroffen = sub.entries.filter(e => e.type === "stufe" && e.cat === cat && e.stufe >= letzte).length;
    if(betroffen && !confirm(betroffen + " Eintrag/Einträge liegen auf der letzten Stufe. Sie rücken auf die neue letzte Stufe. Trotzdem entfernen?")){ render(); return; }
    liste.splice(letzte - 1, 1);
    sub.entries.forEach(e => {
      if(e.type === "stufe" && e.cat === cat && e.stufe >= liste.length) e.stufe = liste.length - 1;
    });
  }
  sub.stufenTexte[cat] = liste;
  save();
  render();
}

function stufenTexteZuruecksetzen(cat){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  if(!sub || !sub.stufenTexte) return;
  const vorgabe = STUFEN_LISTEN[cat] || STUFEN_LISTEN.hausuebung;
  const jetzt = stufenListe(sub, cat);
  if(jetzt.length !== vorgabe.length){
    const zuViel = sub.entries.filter(e => e.type === "stufe" && e.cat === cat && e.stufe >= vorgabe.length).length;
    if(zuViel && !confirm("Die Vorgabe hat " + vorgabe.length + " Stufen, aktuell sind es " + jetzt.length +
       ". " + zuViel + " Eintrag/Einträge rücken auf die letzte Stufe. Zurücksetzen?")){ render(); return; }
    sub.entries.forEach(e => {
      if(e.type === "stufe" && e.cat === cat && e.stufe >= vorgabe.length) e.stufe = vorgabe.length - 1;
    });
  }
  delete sub.stufenTexte[cat];
  save();
  render();
}

/* Weichen die Texte von der Vorgabe ab? Steuert den Zurücksetzen-Knopf. */
function hatEigeneStufenTexte(sub, cat){
  if(!sub || !sub.stufenTexte || !Array.isArray(sub.stufenTexte[cat])) return false;
  const vorgabe = STUFEN_LISTEN[cat] || STUFEN_LISTEN.hausuebung;
  const jetzt = sub.stufenTexte[cat];
  if(jetzt.length !== vorgabe.length) return true;
  return jetzt.some((t, i) => t !== vorgabe[i]);
}

function setNewCatColor(fg){
  settingsView.newCatColor = fg;
  render();
}

function addCustomCat(ev){
  ev.preventDefault();
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const input = document.getElementById("newCatInput");
  const name = input.value.trim();
  if(!name) return;
  const schonDa = allCatKeys(sub).some(k => catLabel(sub, k).toLowerCase() === name.toLowerCase());
  if(schonDa){ alert("Eine Beurteilung mit dem Namen " + name + " gibt es in diesem Fach schon."); return; }
  const farbe = CUSTOM_COLORS.find(c => c.fg === settingsView.newCatColor) || nextCustomColor(sub);
  const key = "x_" + uid();
  if(!Array.isArray(sub.customCats)) sub.customCats = [];
  sub.customCats.push({ key: key, label: name, short: kurzName(name), fg: farbe.fg, bg: farbe.bg });
  const liste = activeCats(sub).concat([key]);
  sub.cats = allCatKeys(sub).filter(k => liste.indexOf(k) !== -1);
  if(typeof sub.weights[key] !== "number") sub.weights[key] = isProzentMode(sub) ? 10 : 1;
  sub.template = "eigen";
  settingsView.newCatColor = null;
  save();
  render();
}

/* Umbenennen und Umfärben lassen die Noten unangetastet, weil sie am
   Schlüssel hängen und nicht am angezeigten Namen. */
function renameCustomCat(key, name){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const c = findCustom(sub, key);
  const neu = String(name || "").trim();
  if(!c || !neu) { render(); return; }
  if(neu === c.label) return;
  const schonDa = allCatKeys(sub).some(k => k !== key && catLabel(sub, k).toLowerCase() === neu.toLowerCase());
  if(schonDa){ alert("Eine Beurteilung mit dem Namen " + neu + " gibt es in diesem Fach schon."); render(); return; }
  c.label = neu;
  c.short = kurzName(neu);
  save();
  render();
}

function recolorCustomCat(key, fg){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const c = findCustom(sub, key);
  const farbe = CUSTOM_COLORS.find(f => f.fg === fg);
  if(!c || !farbe) return;
  c.fg = farbe.fg;
  c.bg = farbe.bg;
  save();
  render();
}

function removeCustomCat(key){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const c = findCustom(sub, key);
  if(!c) return;
  const anzahl = sub.entries.filter(e => e.type === "note" && e.cat === key).length;
  const frage = anzahl
    ? c.label + " entfernen? Die " + anzahl + " Noten dieser Beurteilung werden mitgelöscht."
    : c.label + " entfernen?";
  if(!confirm(frage)) return;
  sub.customCats = customCats(sub).filter(x => x.key !== key);
  sub.entries = sub.entries.filter(e => e.cat !== key);
  sub.cats = (sub.cats || []).filter(k => k !== key);
  delete sub.weights[key];
  sub.template = "eigen";
  save();
  render();
}

function addCompetency(ev){
  ev.preventDefault();
  const input = document.getElementById("newCompInput");
  const name = input.value.trim();
  if(!name) return;
  getSubject(getClass(settingsView.classId), settingsView.subjectId).competencies.push(name);
  save();
  render();
}

function removeCompetency(i){
  getSubject(getClass(settingsView.classId), settingsView.subjectId).competencies.splice(i, 1);
  save();
  render();
}

function deleteSubject(){
  const cls = getClass(settingsView.classId);
  const sub = getSubject(cls, settingsView.subjectId);
  if(!confirm("Fach " + sub.fach + " in der Klasse " + cls.name + " löschen? Die Noten dieses Fachs gehen verloren, die Namen der Schüler:innen bleiben erhalten.")) return;
  cls.subjects = cls.subjects.filter(x => x.id !== sub.id);
  if(!cls.subjects.length && confirm("Die Klasse " + cls.name + " hat jetzt kein Fach mehr. Klasse auch löschen?")){
    state.classes = state.classes.filter(x => x.id !== cls.id);
  }
  save();
  goSettings("list");
}

function deleteClass(){
  const cls = getClass(settingsView.classId);
  if(!confirm("Klasse " + cls.name + " komplett löschen? Alle Fächer, Schüler:innen und Noten gehen verloren.")) return;
  state.classes = state.classes.filter(x => x.id !== cls.id);
  save();
  goSettings("list");
}

/* Gemerkten Sicherungsordner nachladen, danach neu zeichnen, damit der
   Hinweis in den Einstellungen stimmt. */
if(kannOrdner()){
  idbOrdner(false).then(function(h){ if(h){ ordnerHandle = h; render(); } });
}

/* Service Worker macht die App am Homescreen startbar und offline nutzbar.
   Läuft nur, wenn die Datei über http oder https geöffnet wird. */
/* ---------- NEUE FASSUNG AUF DER ADRESSE ----------
   Wenn die App über eine Webadresse läuft, hält der Zwischenspeicher des
   Browsers gern die alte Fassung fest. Man sieht dann eine Nummer und weiß
   nicht, ob sie stimmt. Deshalb sieht die App selbst nach, welche Fassung
   auf der Adresse liegt, und sagt es, statt es die Lehrkraft raten zu lassen.

   ACHTUNG beim Benennen: fassungPruefen() gibt es schon, das legt beim
   Fassungswechsel die Sicherheitskopie an. Diese Funktion heißt deshalb
   anders. */
function adressFassungPruefen(){
  if(location.protocol.indexOf("http") !== 0) return;
  if(typeof fetch !== "function") return;
  fetch("index.html?fassungspruefung=" + Date.now(), { cache: "no-store" })
    .then(function(a){ return a.ok ? a.text() : null; })
    .then(function(text){
      if(!text) return;
      const treffer = text.match(/APP_FASSUNG\s*=\s*"([^"]+)"/);
      if(!treffer) return;
      if(treffer[1] !== APP_FASSUNG){
        neuereFassung = treffer[1];
        render();
      }
    })
    .catch(function(){});
}

/* Holt die neue Fassung wirklich: Zwischenspeicher leeren, Service Worker
   abmelden, dann neu laden. Die Noten bleiben davon unberührt, sie liegen
   in einem anderen Speicher. */
function neueFassungHolen(){
  if(!confirm("Die neue Fassung " + (neuereFassung || "") + " wird geladen.\n\n" +
              "Deine Klassen und Noten bleiben erhalten, sie liegen in einem eigenen Speicher.\n\n" +
              "Fortfahren?")) return;
  const fertig = function(){ location.reload(true); };
  const aufgaben = [];
  if("caches" in window){
    aufgaben.push(caches.keys().then(function(n){
      return Promise.all(n.map(function(k){ return caches.delete(k); }));
    }).catch(function(){}));
  }
  if("serviceWorker" in navigator){
    aufgaben.push(navigator.serviceWorker.getRegistrations().then(function(regs){
      return Promise.all(regs.map(function(r){ return r.unregister(); }));
    }).catch(function(){}));
  }
  Promise.all(aufgaben).then(fertig, fertig);
  setTimeout(fertig, 3000);
}

if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}

/* Beim Start nachsehen, und noch einmal, sobald wieder Netz da ist oder die
   App nach vorne geholt wird. Ohne das bliebe der Hinweis aus, wenn die App
   gerade offline gestartet wurde, und genau dann liefert der Zwischenspeicher
   ja die alte Fassung. */
adressFassungPruefen();
window.addEventListener("online", adressFassungPruefen);
document.addEventListener("visibilitychange", function(){
  if(!document.hidden) adressFassungPruefen();
});

/* Nachsehen, ob die App gerade über das Übertragungsprogramm läuft */
uebertragungPruefen();
