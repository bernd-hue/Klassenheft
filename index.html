/* ---------- SICHERUNG ----------
   Zwei Dateien je Sicherung:
   1. eine Word-Datei zum Nachlesen, Ausdrucken und Weiterverwenden
   2. eine JSON-Datei, mit der sich der Stand wieder in die App zurückholen lässt
   Beides bleibt auf dem Gerät, nichts geht ins Internet. */

/* --- ZIP ohne fremde Bibliothek (Speichermethode, keine Komprimierung) --- */

function crc32(buf){
  let table = crc32._t;
  if(!table){
    table = crc32._t = new Uint32Array(256);
    for(let n = 0; n < 256; n++){
      let c = n;
      for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for(let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ table[(crc ^ buf[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function dosDatum(){
  const d = new Date();
  const datum = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const zeit  = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
  return { datum: datum & 0xFFFF, zeit: zeit & 0xFFFF };
}

function zipStore(dateien){
  const enc = new TextEncoder();
  const teile = [], zentral = [];
  const { datum, zeit } = dosDatum();
  let offset = 0, gesamt = 0;

  dateien.forEach(f => {
    const name = enc.encode(f.name);
    const daten = f.data;
    const crc = crc32(daten);

    const lokal = new Uint8Array(30 + name.length);
    const lv = new DataView(lokal.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, zeit, true);
    lv.setUint16(12, datum, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, daten.length, true);
    lv.setUint32(22, daten.length, true);
    lv.setUint16(26, name.length, true);
    lv.setUint16(28, 0, true);
    lokal.set(name, 30);
    teile.push(lokal, daten);
    gesamt += lokal.length + daten.length;

    const cen = new Uint8Array(46 + name.length);
    const cv = new DataView(cen.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, zeit, true);
    cv.setUint16(14, datum, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, daten.length, true);
    cv.setUint32(24, daten.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cen.set(name, 46);
    zentral.push(cen);
    offset += lokal.length + daten.length;
  });

  const zGroesse = zentral.reduce((a, c) => a + c.length, 0);
  const ende = new Uint8Array(22);
  const ev = new DataView(ende.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, dateien.length, true);
  ev.setUint16(10, dateien.length, true);
  ev.setUint32(12, zGroesse, true);
  ev.setUint32(16, gesamt, true);
  ev.setUint16(20, 0, true);

  const alles = new Uint8Array(gesamt + zGroesse + 22);
  let p = 0;
  teile.forEach(t => { alles.set(t, p); p += t.length; });
  zentral.forEach(t => { alles.set(t, p); p += t.length; });
  alles.set(ende, p);
  return alles;
}

/* --- Word-Datei aufbauen --- */

function xmlEsc(t){
  return String(t === null || t === undefined ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}

function wP(text, opt){
  opt = opt || {};
  const groesse = opt.size || 20;
  const rPr = `<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:sz w:val="${groesse}"/><w:szCs w:val="${groesse}"/>${opt.bold ? "<w:b/>" : ""}</w:rPr>`;
  const abstand = (opt.after === undefined) ? 60 : opt.after;
  const davor = opt.before ? `<w:spacing w:before="${opt.before}" w:after="${abstand}"/>` : `<w:spacing w:after="${abstand}"/>`;
  return `<w:p><w:pPr>${davor}</w:pPr><w:r>${rPr}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;
}

function wCell(text, opt){
  opt = opt || {};
  const schatten = opt.kopf ? '<w:shd w:val="clear" w:color="auto" w:fill="EEEEEE"/>' : "";
  const breite = opt.w ? `<w:tcW w:w="${opt.w}" w:type="dxa"/>` : "";
  return `<w:tc><w:tcPr>${breite}${schatten}</w:tcPr>${wP(text, { bold: !!opt.kopf, after: 0, size: 18 })}</w:tc>`;
}

function wTable(kopf, zeilen, breiten){
  const rahmen = ["top","left","bottom","right","insideH","insideV"]
    .map(s => `<w:${s} w:val="single" w:sz="6" w:space="0" w:color="000000"/>`).join("");
  const grid = breiten.map(b => `<w:gridCol w:w="${b}"/>`).join("");
  const kopfZeile = `<w:tr><w:trPr><w:tblHeader/></w:trPr>${kopf.map((t,i) => wCell(t, { kopf:true, w:breiten[i] })).join("")}</w:tr>`;
  const rest = zeilen.map(r => `<w:tr>${r.map((t,i) => wCell(t, { w:breiten[i] })).join("")}</w:tr>`).join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders>${rahmen}</w:tblBorders></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${kopfZeile}${rest}</w:tbl>` + wP("", { after: 60 });
}

function wordDokument(){
  let body = "";
  body += wP("Klassenheft Wochensicherung", { bold:true, size:32, after:80 });
  const kopfzeilen = [];
  if(state.settings.lehrkraft) kopfzeilen.push(state.settings.lehrkraft);
  if(state.settings.schuljahr) kopfzeilen.push("Schuljahr " + state.settings.schuljahr);
  kopfzeilen.push("Stand " + heute());
  body += wP(kopfzeilen.join("  |  "), { size:18, after:200 });

  if(!state.classes.length) body += wP("Noch keine Klassen angelegt.", {});

  state.classes.forEach(cls => {
    body += wP("Klasse " + cls.name, { bold:true, size:26, before:240, after:80 });
    cls.subjects.forEach(sub => {
      body += wP(sub.fach, { bold:true, size:22, before:120, after:60 });

      const uebersicht = cls.students.map(s => {
        const pn = countPosNeg(sub, s.id, "alle");
        return [
          s.name,
          (cls.stufe === 1) ? "-" : NIVEAU_LABELS[s.niveau],
          fmt(computeSchnitt(sub, s.id, 1)),
          fmt(computeSchnitt(sub, s.id, 2)),
          fmt(computeSchnitt(sub, s.id, "alle")),
          String(pn.pos),
          String(pn.neg)
        ];
      });
      body += wTable(["Name","Leistungsniveau","1. Sem.","2. Sem.","Jahr","Positiv","Negativ"], uebersicht, [2600,1900,900,900,900,800,800]);

      /* Vergleich der Arbeiten je Kategorie, über das ganze Jahr */
      notenCats(sub).forEach(cat => {
        const liste = arbeiten(sub, cat, "alle");
        if(liste.length < 2) return;
        body += wP(catLabel(sub, cat) + " im Vergleich", { bold:true, size:18, before:120, after:40 });
        const zeilen = liste.map((a, i) => {
          const v = arbeitVergleich(liste, i);
          return [
            a.nummer + ".",
            a.datum + (a.thema ? "  ·  " + a.thema : ""),
            fmt(a.schnitt),
            a.verteilung.join(" · "),
            String(a.anzahl) + (a.fehlt ? " (+" + a.fehlt + " nicht mitgeschrieben)" : ""),
            String(a.negativ),
            v ? v.text : "erste Arbeit"
          ];
        });
        body += wTable(["Nr.","Termin","Schnitt","1·2·3·4·5","geschrieben","Nicht gen.","gegenüber der vorigen"],
          zeilen, [700,2400,1000,1600,1600,1000,2500]);
      });

      cls.students.forEach(s => {
        if(!entriesOf(sub, s.id, "alle").length) return;
        body += wP(s.name, { bold:true, size:20, before:120, after:40 });
        body += wP("1. Semester " + fmtO(computeSchnitt(sub, s.id, 1)) +
                   "  |  2. Semester " + fmtO(computeSchnitt(sub, s.id, 2)) +
                   "  |  ganzes Jahr " + fmtO(computeSchnitt(sub, s.id, "alle")), { size:18, after:60 });

        [1, 2].forEach(sem => {
          const eigene = entriesOf(sub, s.id, sem);
          if(!eigene.length) return;
          body += wP(SEM_LABELS[sem], { bold:true, size:18, before:80, after:40 });

          const noten = eigene.filter(e => e.type === "note");
          if(noten.length){
            const zeilen = noten.map(n => [
              n.date,
              eintragTitel(sub, n),
              n.cat === "kompetenz" ? ((n.achieved||[]).length + " von " + n.total + " Kompetenzen") : (n.basis || ""),
              fmtW(noteWeight(sub, n)),
              String(n.value)
            ]);
            body += wTable(["Datum","Beurteilung","Grundlage","Gewicht","Note"], zeilen, [1100,2400,2900,1100,900]);
          }

          const bSatz = bonusSatz(sub, s.id, sem);
          if(bSatz) body += wP(bSatz, { size:16, after:40 });

          const stufen = eigene.filter(e => e.type === "stufe");
          if(stufen.length){
            const zeilen = stufen.map(e => [e.date, catLabel(sub, e.cat),
              stufenText(sub, e) + (e.thema ? "  \u00b7  " + e.thema : "")]);
            const arten = {};
            stufen.forEach(e => { arten[e.cat] = true; });
            const hinweise = Object.keys(arten).map(c => catLabel(sub, c) + ": " + zaehltText(sub, c)).join("  |  ");
            body += wP(hinweise, { size:16, after:40 });
            body += wTable(["Datum","Art","Eintrag"], zeilen, [1100,2400,4900]);
          }

          const rest = eigene.filter(e => e.type === "positiv" || e.type === "negativ" || e.type === "notiz" || e.type === "fehlt");
          if(rest.length){
            const zeilen = rest.map(e => [
              e.date,
              e.type === "positiv" ? "Positiv" : (e.type === "negativ" ? "Negativ" : (e.type === "fehlt" ? catLabel(sub, e.cat) : "Notiz")),
              (e.type === "fehlt" ? "nicht mitgeschrieben, keine Note" : (e.text || "")) +
                (e.thema ? "  \u00b7  " + e.thema : "")
            ]);
            body += wTable(["Datum","Art","Eintrag"], zeilen, [1100,1500,5800]);
          }

          const fotos = eigene.filter(e => e.type === "foto");
          if(fotos.length) body += wP(fotos.length + " Foto(s) in der App gespeichert, in dieser Word-Datei nicht enthalten.", { size:16, after:80 });
        });
      });
    });
  });

  body += wP("Diese Datei ist eine Sicherung zum Nachlesen und Weiterverwenden. Zum Zurückspielen in die App dient die JSON-Datei mit demselben Datum im Namen.", { size:16, before:240 });

  const sect = '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    "<w:body>" + body + sect + "</w:body></w:document>";
}

function docxBytes(){
  const enc = new TextEncoder();
  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    "</Types>";
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    "</Relationships>";
  return zipStore([
    { name: "[Content_Types].xml", data: enc.encode(contentTypes) },
    { name: "_rels/.rels",         data: enc.encode(rels) },
    { name: "word/document.xml",   data: enc.encode(wordDokument()) }
  ]);
}

/* --- Ordnerwahl am Rechner, damit die Sicherung immer am selben Platz landet --- */

const ORDNER_DB = "klassenheft_ordner";
let ordnerHandle = null;

function idbOrdner(schreiben, wert){
  return new Promise(function(fertig){
    if(!window.indexedDB) return fertig(null);
    const anfrage = indexedDB.open(ORDNER_DB, 1);
    anfrage.onupgradeneeded = function(){ anfrage.result.createObjectStore("h"); };
    anfrage.onerror = function(){ fertig(null); };
    anfrage.onsuccess = function(){
      const db = anfrage.result;
      const tx = db.transaction("h", schreiben ? "readwrite" : "readonly");
      const store = tx.objectStore("h");
      const r = schreiben ? store.put(wert, "ordner") : store.get("ordner");
      r.onsuccess = function(){ fertig(schreiben ? true : r.result || null); };
      r.onerror = function(){ fertig(null); };
    };
  });
}

function kannOrdner(){ return typeof window.showDirectoryPicker === "function"; }

async function ordnerWaehlen(){
  if(!kannOrdner()){
    alert("Dieses Gerät kann keinen festen Sicherungsordner merken. Die Sicherung wird stattdessen ganz normal heruntergeladen und landet im Ordner Downloads oder in der Dateien-App.");
    return;
  }
  try{
    const handle = await window.showDirectoryPicker({ mode: "readwrite" });
    ordnerHandle = handle;
    await idbOrdner(true, handle);
    render();
    alert("Sicherungsordner gemerkt. Ab jetzt legt die App die Wochensicherung direkt dort ab.");
  }catch(e){ /* Auswahl abgebrochen */ }
}

async function ordnerBereit(){
  if(!kannOrdner()) return null;
  if(!ordnerHandle) ordnerHandle = await idbOrdner(false);
  if(!ordnerHandle) return null;
  try{
    let rechte = await ordnerHandle.queryPermission({ mode:"readwrite" });
    if(rechte !== "granted") rechte = await ordnerHandle.requestPermission({ mode:"readwrite" });
    return rechte === "granted" ? ordnerHandle : null;
  }catch(e){ return null; }
}

async function inOrdnerSchreiben(handle, name, blob){
  const datei = await handle.getFileHandle(name, { create:true });
  const strom = await datei.createWritable();
  await strom.write(blob);
  await strom.close();
}

function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

function datumsStempel(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

/* ---------- SICHERHEITSKOPIE IM GERÄT ----------
   Zusätzlich zur Wochensicherung legt die App selbst eine Kopie an, sobald
   eine neue Fassung des Programms geöffnet wird oder bevor ein Stand ersetzt
   wird. Sie liegt im selben Gerät und ist nur als Netz gedacht, falls beim
   Umstieg etwas schiefgeht. Fotos bleiben bewusst draußen, sonst wird die
   Kopie zu groß für den Speicher des Browsers. */

const KOPIE_KEY = "klassenheft_sicherheitskopie";
const FASSUNG_KEY = "klassenheft_fassung";

function ohneFotos(klassen){
  return klassen.map(c => ({
    id: c.id, name: c.name, stufe: c.stufe,
    students: c.students.map(s => Object.assign({}, s, { photo: null })),
    subjects: c.subjects.map(sub => Object.assign({}, sub, {
      entries: sub.entries.map(e => e.type === "foto" ? Object.assign({}, e, { dataUrl: null }) : e)
    }))
  }));
}

function sicherheitskopieAnlegen(grund){
  if(!state.classes.length) return;
  try{
    localStorage.setItem(KOPIE_KEY, JSON.stringify({
      grund: grund,
      zeit: new Date().toISOString(),
      daten: { version: 4, classes: ohneFotos(state.classes), settings: state.settings }
    }));
  }catch(e){ /* kein Platz, dann eben nicht */ }
}

function sicherheitskopieLesen(){
  try{
    const roh = localStorage.getItem(KOPIE_KEY);
    if(!roh) return null;
    const k = JSON.parse(roh);
    return (k && k.daten && Array.isArray(k.daten.classes)) ? k : null;
  }catch(e){ return null; }
}

function kopieZeitText(k){
  const d = new Date(k.zeit);
  if(isNaN(d.getTime())) return "";
  return String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + "." + d.getFullYear() +
         " um " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

function sicherheitskopieZurueck(){
  const k = sicherheitskopieLesen();
  if(!k){ alert("Es liegt keine Sicherheitskopie auf diesem Gerät."); return; }
  const anzahl = k.daten.classes.reduce((a, c) => a + c.students.length, 0);
  if(!confirm("Sicherheitskopie vom " + kopieZeitText(k) + " zurückholen?\n\n" +
              k.daten.classes.length + " Klasse(n), " + anzahl + " Schüler:in(nen).\n" +
              "Die Kopie wird mit dem jetzigen Stand zusammengeführt, es geht nichts verloren.\n" +
              "Porträtfotos sind in der Kopie nicht enthalten.")) return;
  const bericht = mergeState(state, migrate(JSON.parse(JSON.stringify(k.daten))));
  save();
  ansichtenZuruecksetzen();
  switchTab("home");
  alert("Zurückgeholt.\n\nNeu dazugekommen:\n" +
    bericht.klassen + " Klasse(n)\n" +
    bericht.schueler + " Schüler:in(nen)\n" +
    bericht.faecher + " Fach/Fächer\n" +
    bericht.eintraege + " Eintrag/Einträge");
}

/* Beim Start prüfen, ob das Programm gegen eine neue Fassung getauscht wurde */
function fassungPruefen(){
  let alt = null;
  try{ alt = localStorage.getItem(FASSUNG_KEY); }catch(e){ return; }
  if(alt !== APP_FASSUNG){
    if(alt !== null) sicherheitskopieAnlegen("neue Fassung " + APP_FASSUNG);
    try{ localStorage.setItem(FASSUNG_KEY, APP_FASSUNG); }catch(e){}
  }
}

function sicherungsDaten(){
  return { version: 4, geraet: state.settings.geraet || "", classes: state.classes, settings: state.settings, exportedAt: new Date().toISOString() };
}

async function sicherungErstellen(){
  const stempel = datumsStempel();
  const wordBlob = new Blob([docxBytes()], { type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  const jsonBlob = new Blob([JSON.stringify(sicherungsDaten(), null, 2)], { type:"application/json" });
  const wordName = "Klassenheft_Sicherung_" + stempel + ".docx";
  const jsonName = "Klassenheft_Sicherung_" + stempel + ".json";

  const handle = await ordnerBereit();
  let wohin;
  if(handle){
    try{
      await inOrdnerSchreiben(handle, wordName, wordBlob);
      await inOrdnerSchreiben(handle, jsonName, jsonBlob);
      wohin = "in deinen Sicherungsordner";
    }catch(e){ wohin = null; }
  }
  if(!wohin){
    download(wordBlob, wordName);
    setTimeout(function(){ download(jsonBlob, jsonName); }, 700);
    wohin = "in den Ordner für Downloads bzw. in die Dateien-App";
  }

  state.settings.lastBackup = new Date().toISOString();
  save();
  render();
  alert("Wochensicherung erstellt und " + wohin + " gelegt:\n\n" + wordName + " zum Nachlesen und Bearbeiten\n" + jsonName + " zum Zurückspielen in die App");
}

function tageSeitSicherung(){
  if(!state.settings.lastBackup) return null;
  const d = new Date(state.settings.lastBackup);
  if(isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

function sicherungFaellig(){
  const tage = tageSeitSicherung();
  if(tage === null) return state.classes.length > 0;
  return tage >= (state.settings.intervallTage || 7);
}

let bannerPause = false;

function backupBanner(){
  if(bannerPause || !sicherungFaellig()) return "";
  const tage = tageSeitSicherung();
  const text = tage === null
    ? "Noch keine Sicherung vorhanden. Damit nichts verloren geht, jetzt eine Wochensicherung anlegen."
    : "Die letzte Sicherung ist " + tage + " Tage her. Zeit für die Wochensicherung.";
  return `<div class="banner">
    <div class="txt">${text}</div>
    <button onclick="sicherungErstellen()">Jetzt sichern</button>
    <button class="ghost" onclick="sicherungSpaeter()">später</button>
  </div>`;
}

/* Erinnerung für heute wegklicken, ohne das Sicherungsdatum zu fälschen */
function sicherungSpaeter(){ bannerPause = true; render(); }

/* Führt einen fremden Datenstand mit dem Stand auf diesem Gerät zusammen.
   Zuordnung über die IDs, ersatzweise über die Bezeichnung. Bei zwei Fassungen
   desselben Eintrags gewinnt die neuere. Es wird nichts gelöscht. */
function mergeState(basis, fremd){
  const bericht = { klassen:0, schueler:0, faecher:0, eintraege:0 };

  fremd.classes.forEach(fc => {
    let bc = basis.classes.find(c => c.id === fc.id)
          || basis.classes.find(c => c.name.trim().toLowerCase() === fc.name.trim().toLowerCase());
    if(!bc){
      bc = { id: fc.id, name: fc.name, stufe: fc.stufe, students: [], subjects: [] };
      basis.classes.push(bc);
      bericht.klassen++;
    }

    const idMap = {};
    fc.students.forEach(fs => {
      let bs = bc.students.find(s => s.id === fs.id)
            || bc.students.find(s => s.name.trim().toLowerCase() === fs.name.trim().toLowerCase());
      if(!bs){
        bs = { id: fs.id, name: fs.name, niveau: fs.niveau, photo: fs.photo || null, updatedAt: fs.updatedAt || 0 };
        bc.students.push(bs);
        bericht.schueler++;
      } else if((fs.updatedAt || 0) > (bs.updatedAt || 0)){
        bs.niveau = fs.niveau;
        if(fs.photo) bs.photo = fs.photo;
        bs.updatedAt = fs.updatedAt || 0;
      } else if(!bs.photo && fs.photo){
        bs.photo = fs.photo;
      }
      idMap[fs.id] = bs.id;
    });

    fc.subjects.forEach(fsub => {
      let bsub = bc.subjects.find(s => s.id === fsub.id)
              || bc.subjects.find(s => s.fach.trim().toLowerCase() === fsub.fach.trim().toLowerCase());
      if(!bsub){
        bsub = {
          id: fsub.id, fach: fsub.fach, template: fsub.template, weightMode: fsub.weightMode,
          cats: (fsub.cats || []).slice(), weights: Object.assign({}, fsub.weights),
          customCats: (fsub.customCats || []).map(c => Object.assign({}, c)),
          competencies: (fsub.competencies || []).slice(), entries: []
        };
        /* Die Einstellungen zu den Stufen müssen mitkommen, sonst bekommt das
           Fach auf dem anderen Gerät wieder die Vorgaben und die Entscheidung
           der Lehrkraft ist weg. Schlimmer noch: ohne stufenStand hält
           normaliseClass das Fach für alt und zieht eine einmalige Umstellung
           ein zweites Mal nach, die auf diese Daten längst angewendet wurde. */
        if(Array.isArray(fsub.stufenCats))   bsub.stufenCats   = fsub.stufenCats.slice();
        if(Array.isArray(fsub.stufenZaehlt)) bsub.stufenZaehlt = fsub.stufenZaehlt.slice();
        if(Array.isArray(fsub.stufenBonus))  bsub.stufenBonus  = fsub.stufenBonus.slice();
        if(typeof fsub.bonusMax === "number") bsub.bonusMax    = fsub.bonusMax;
        if(typeof fsub.stufenStand === "number") bsub.stufenStand = fsub.stufenStand;
        /* arbeitsNummernNachziehen() greift danach über normaliseClass, falls nötig */
        if(fsub.stufenTexte && typeof fsub.stufenTexte === "object"){
          bsub.stufenTexte = JSON.parse(JSON.stringify(fsub.stufenTexte));
        }
        if(fsub.stufenWerte && typeof fsub.stufenWerte === "object"){
          bsub.stufenWerte = JSON.parse(JSON.stringify(fsub.stufenWerte));
        }
        bc.subjects.push(bsub);
        bericht.faecher++;
      } else {
        (fsub.customCats || []).forEach(c => {
          if(!bsub.customCats.some(x => x.key === c.key)){
            bsub.customCats.push(Object.assign({}, c));
            if(typeof bsub.weights[c.key] !== "number") bsub.weights[c.key] = fsub.weights[c.key] ?? 10;
            if((bsub.cats || []).indexOf(c.key) === -1) bsub.cats.push(c.key);
          }
        });
        /* Beim bestehenden Fach gilt die Einstellung dieses Geräts. Nur was
           hier noch gar nicht gesetzt ist, wird vom anderen Gerät übernommen. */
        if(!Array.isArray(bsub.stufenCats) && Array.isArray(fsub.stufenCats)) bsub.stufenCats = fsub.stufenCats.slice();
        if(typeof bsub.stufenStand !== "number" && typeof fsub.stufenStand === "number") bsub.stufenStand = fsub.stufenStand;
        if(fsub.stufenTexte){
          if(!bsub.stufenTexte) bsub.stufenTexte = {};
          Object.keys(fsub.stufenTexte).forEach(k => {
            if(!Array.isArray(bsub.stufenTexte[k])) bsub.stufenTexte[k] = fsub.stufenTexte[k].slice();
          });
        }
      }

      (fsub.entries || []).forEach(fe => {
        const ziel = idMap[fe.studentId] || fe.studentId;
        const vorhanden = bsub.entries.find(e => e.id === fe.id);
        if(!vorhanden){
          const kopie = Object.assign({}, fe, { studentId: ziel });
          bsub.entries.push(kopie);
          bericht.eintraege++;
        } else if((fe.ts || 0) > (vorhanden.ts || 0)){
          Object.assign(vorhanden, fe, { studentId: ziel });
        }
      });
    });
  });

  basis.classes.forEach(normaliseClass);
  if(fremd.settings && fremd.settings.lastBackup){
    if(!basis.settings.lastBackup || fremd.settings.lastBackup > basis.settings.lastBackup){
      basis.settings.lastBackup = fremd.settings.lastBackup;
    }
  }
  return bericht;
}

/* ---------- DIREKTÜBERTRAGUNG IM WLAN ----------
   Läuft nur, wenn die App über das kleine Übertragungsprogramm geöffnet wurde.
   Das Programm liegt auf dem Rechner, hält eine Ablage im Arbeitsspeicher und
   ist über das WLAN erreichbar. Es geht nichts ins Internet und nichts in eine
   Cloud. Ein vierstelliger Zahlencode, den nur das Fenster am Rechner zeigt,
   schützt die Ablage vor anderen Geräten im selben Netz. */

let uebertragung = { da: false, status: null };

function uebertragungCode(){
  try{ return localStorage.getItem("klassenheft_code") || ""; }catch(e){ return ""; }
}

function setUebertragungCode(wert){
  try{ localStorage.setItem("klassenheft_code", String(wert || "").trim()); }catch(e){}
}

function codeAusFeld(){
  const el = document.getElementById("codeInput");
  const wert = el ? el.value.trim() : uebertragungCode();
  setUebertragungCode(wert);
  return wert;
}

/* Nur nachsehen, wenn die App über eine gewöhnliche http-Adresse läuft.
   Genau so liefert das Hilfsprogramm aus. Auf einer https-Adresse wie
   GitHub Pages oder beim Öffnen der Datei selbst wird gar nicht erst
   gefragt, damit dort keine überflüssige Anfrage entsteht. */
function uebertragungPruefen(){
  if(location.protocol !== "http:" || typeof fetch !== "function") return Promise.resolve(false);
  return fetch("ablage/status", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if(j && j.klassenheft){
        uebertragung.da = true;
        uebertragung.status = j;
        render();
        return true;
      }
      return false;
    })
    .catch(function(){ return false; });
}

function ablageFehler(e){
  alert("Die Ablage ist gerade nicht erreichbar.\n\nLäuft das Übertragungsprogramm am Rechner noch, und sind beide Geräte im selben WLAN?");
}

function ablageSenden(){
  if(typeof fetch !== "function") return;
  const code = codeAusFeld();
  fetch("ablage", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Klassenheft-Code": code },
    body: JSON.stringify(sicherungsDaten())
  }).then(function(r){
    if(r.status === 403){ alert("Der Zahlencode stimmt nicht.\n\nEr steht im Fenster des Übertragungsprogramms am Rechner."); return null; }
    if(!r.ok) throw new Error("Fehler");
    return r.json();
  }).then(function(j){
    if(!j) return;
    return uebertragungPruefen().then(function(){
      alert("Daten abgelegt.\n\nJetzt am anderen Gerät auf »Daten holen und zusammenführen« tippen.");
    });
  }).catch(ablageFehler);
}

function ablageHolen(){
  if(typeof fetch !== "function") return;
  const code = codeAusFeld();
  fetch("ablage", { headers: { "X-Klassenheft-Code": code }, cache: "no-store" })
    .then(function(r){
      if(r.status === 403){ alert("Der Zahlencode stimmt nicht.\n\nEr steht im Fenster des Übertragungsprogramms am Rechner."); return null; }
      if(r.status === 404){ alert("In der Ablage liegt noch nichts.\n\nZuerst am anderen Gerät auf »Daten hier ablegen« tippen."); return null; }
      if(!r.ok) throw new Error("Fehler");
      return r.json();
    })
    .then(function(daten){
      if(!daten) return;
      if(!daten.classes || !Array.isArray(daten.classes)){ alert("In der Ablage liegen keine brauchbaren Daten."); return; }
      const woher = daten.geraet ? " von " + daten.geraet : "";
      if(!confirm("Daten" + woher + " mit diesem Gerät zusammenführen? Es wird nichts gelöscht, fehlende Einträge kommen dazu.")) return;
      const bericht = mergeState(state, migrate(daten));
      save();
      ansichtenZuruecksetzen();
      switchTab("home");
      alert("Zusammengeführt.\n\nNeu dazugekommen:\n" +
        bericht.klassen + " Klasse(n)\n" +
        bericht.schueler + " Schüler:in(nen)\n" +
        bericht.faecher + " Fach/Fächer\n" +
        bericht.eintraege + " Eintrag/Einträge");
    })
    .catch(ablageFehler);
}

function ablageLeeren(){
  if(typeof fetch !== "function") return;
  if(!confirm("Ablage leeren? Die Daten auf den Geräten bleiben unverändert.")) return;
  const code = codeAusFeld();
  fetch("ablage", { method: "DELETE", headers: { "X-Klassenheft-Code": code } })
    .then(function(r){
      if(r.status === 403){ alert("Der Zahlencode stimmt nicht."); return; }
      return uebertragungPruefen().then(function(){ alert("Ablage geleert."); });
    })
    .catch(ablageFehler);
}

function uebertragungBereich(){
  if(!uebertragung.da) return "";
  const st = uebertragung.status || {};
  const inhalt = st.vorhanden
    ? "In der Ablage liegen Daten" + (st.geraet ? " von " + esc(st.geraet) : "") + (st.zeit ? ", abgelegt um " + esc(st.zeit) : "") + "."
    : "Die Ablage ist leer.";
  return `
    <div class="label" style="border-top:2px solid #000;">DIREKTÜBERTRAGUNG IM WLAN</div>
    <div class="helptext">Das Übertragungsprogramm am Rechner läuft. ${inhalt} Am Gerät mit den neueren Einträgen auf Ablegen tippen, am anderen auf Holen. Die Daten gehen dabei nur durch euer WLAN.</div>
    <div style="padding:0 16px;">
      <span class="field-label">Zahlencode aus dem Fenster am Rechner</span>
      <input type="text" id="codeInput" inputmode="numeric" maxlength="6" value="${esc(uebertragungCode())}" placeholder="z. B. 4271">
    </div>
    <div class="footer">
      <button onclick="ablageSenden()">Daten hier ablegen</button>
      <button onclick="ablageHolen()">Daten holen und zusammenführen</button>

    </div>`;
}

    let data;
    try{
      data = JSON.parse(e.target.result);

  };
  reader.readAsText(file);
});

/* ---------- DIAGRAMME ----------
   Reines SVG, ohne fremde Bibliothek. Dadurch erscheinen die Diagramme
   genauso im Ausdruck und im PDF wie am Bildschirm.

   Bewusst einreihig und schwarz: Der Verlauf zeigt eine einzige Größe,
   nämlich die Note über die Zeit. Es braucht also keine Farbunterscheidung
   und keine Legende. Die Balken der Verteilung nutzen den bereits
   abgestimmten Notenfarbverlauf und tragen zusätzlich immer ihre Zahl,
   die Farbe steht also nie allein. */

function svgEsc(t){ return esc(t); }

/* Notenverlauf einer Person in einem Fach, in zeitlicher Folge.
   Oben die Eins, unten die Fünf, so wie man es im Zeugnis liest. */
function verlaufSvg(sub, studentId, sem, breite, hoehe){
  /* Genau die Werte, die auch in den Notenschnitt eingehen. Sonst würde die
     strichlierte Mittellinie nicht zu den Punkten passen. */
  const noten = wertendeNoten(sub, studentId, sem);
  if(noten.length < 2) return "";

  const b = breite || 380, h = hoehe || 130;
  const links = 26, rechts = 8, oben = 10, unten = 22;
  const iB = b - links - rechts, iH = h - oben - unten;
  const x = i => links + (noten.length === 1 ? iB / 2 : (iB * i) / (noten.length - 1));
  const y = wert => oben + (iH * (wert - 1)) / 4;

  let gitter = "";
  for(let n = 1; n <= 5; n++){
    gitter += `<line x1="${links}" y1="${y(n).toFixed(1)}" x2="${b - rechts}" y2="${y(n).toFixed(1)}" stroke="#cccccc" stroke-width="1"/>` +
              `<text x="${links - 7}" y="${(y(n) + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#666666">${n}</text>`;
  }

  const punkte = noten.map((e, i) => x(i).toFixed(1) + "," + y(e.value).toFixed(1)).join(" ");
  const linie = `<polyline points="${punkte}" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;

  /* Echte Noten sind gefüllt, mitgezählte Einstufungen bleiben offen.
     Damit ist auf einen Blick zu sehen, was eine Note war und was nicht. */
  const marken = noten.map((e, i) => {
    const g = gradeColor(e.value);
    const titel = e.ausStufe
      ? svgEsc(catLabel(sub, e.cat) + " " + e.date + ": " + stufenText(sub, e) + ", zählt wie " + fmt(e.value))
      : svgEsc(noteBezeichnung(sub, e) + " " + e.date + ": Note " + e.value);
    const fuellung = e.ausStufe ? "#ffffff" : g.fg;
    return `<circle cx="${x(i).toFixed(1)}" cy="${y(e.value).toFixed(1)}" r="4.5" fill="${fuellung}" stroke="${e.ausStufe ? g.fg : "#ffffff"}" stroke-width="2"><title>${titel}</title></circle>`;
  }).join("");
  const hatStufen = noten.some(e => e.ausStufe);

  /* Nur erstes und letztes Datum beschriften, sonst wird es unleserlich */
  const ersteBeschriftung = `<text x="${links}" y="${h - 6}" font-size="10" fill="#666666">${svgEsc(noten[0].date)}</text>`;
  const letzteBeschriftung = `<text x="${b - rechts}" y="${h - 6}" text-anchor="end" font-size="10" fill="#666666">${svgEsc(noten[noten.length - 1].date)}</text>`;

  /* Die strichlierte Linie liegt beim Schnitt der gezeichneten Punkte, sonst
     würde sie außerhalb aller Punkte hängen. Kommt ein Bonus dazu, steht die
     Endnote als zweite, feiner strichlierte Linie daneben. */
  const grund = schnittOhneBonus(sub, studentId, sem);
  const schnitt = computeSchnitt(sub, studentId, sem);
  const bonus = bonusSumme(sub, studentId, sem);
  const zeigeBonus = grund !== null && schnitt !== null && Math.abs(schnitt - grund) > 0.005;

  const mittellinie = grund === null ? "" :
    `<line x1="${links}" y1="${y(grund).toFixed(1)}" x2="${b - rechts}" y2="${y(grund).toFixed(1)}" stroke="#000000" stroke-width="1" stroke-dasharray="4 3" opacity="0.45"><title>Schnitt der Noten ${svgEsc(fmt(grund))}</title></line>`;
  const bonuslinie = !zeigeBonus ? "" :
    `<line x1="${links}" y1="${y(schnitt).toFixed(1)}" x2="${b - rechts}" y2="${y(schnitt).toFixed(1)}" stroke="#000000" stroke-width="1.5" stroke-dasharray="1 3" opacity="0.8"><title>mit Bonus ${svgEsc(fmt(schnitt))}</title></line>`;

  const hinweisTeile = [];
  if(hatStufen) hinweisTeile.push("Gefüllte Punkte sind Noten, offene Punkte sind Einstufungen, die du mitzählen lässt.");
  if(zeigeBonus){
    const woher = bonus.teile.map(t => t.label).join(" und ");
    const wieOft = bonus.teile.map(t => t.label + " " + t.anzahl + "\u00d7").join(", ");
    hinweisTeile.push("Lange Striche: Schnitt der Noten " + fmt(grund) + ". Kurze Striche: " +
      (wieOft || "Bonus") + " " + bonusText(bonus.wert) + " auf " + fmt(schnitt) +
      (bonus.gedeckelt ? ", begrenzt auf höchstens " + fmtB(bonusMax(sub)) + " Notenstufen" : "") + ".");
  }
  const hinweis = hinweisTeile.length
    ? `<div class="chart-hinweis">${esc(hinweisTeile.join(" "))}</div>` : "";

  return `<svg viewBox="0 0 ${b} ${h}" width="100%" height="${h}" role="img" preserveAspectRatio="xMidYMid meet"
      aria-label="Notenverlauf mit ${noten.length} Werten, Schnitt ${fmt(schnitt)}">
    ${gitter}${mittellinie}${bonuslinie}${linie}${marken}${ersteBeschriftung}${letzteBeschriftung}
  </svg>${hinweis}`;
}

/* ---------- VERGLEICH MEHRERER ARBEITEN ----------
   Eine Reihe, eine Farbe. Die Höhe zeigt den Schnitt, jede Säule trägt ihre
   Zahl. Die Säule zusätzlich nach dem Notenwert einzufärben, würde nur die
   Höhe ein zweites Mal erzählen und die einzige freie Ebene verbrauchen.
   Die Hilfslinie bei 4,0 ist die Grenze zum Nicht genügend, die einzige
   Zahl, die auf dieser Skala eine eigene Bedeutung hat. */
function arbeitenSvg(liste, breite, hoehe){
  if(liste.length < 2) return "";

  const b = breite || 380, h = hoehe || 150;
  const links = 26, rechts = 10, oben = 16, unten = 30;
  const iB = b - links - rechts, iH = h - oben - unten;
  const spalte = iB / liste.length;
  const breiteSaeule = Math.min(52, spalte * 0.5);
  const y = wert => oben + (iH * (wert - 1)) / 4;

  let gitter = "";
  for(let n = 1; n <= 5; n++){
    gitter += `<line x1="${links}" y1="${y(n).toFixed(1)}" x2="${b - rechts}" y2="${y(n).toFixed(1)}" stroke="#dddddd" stroke-width="1"/>` +
              `<text x="${links - 7}" y="${(y(n) + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#666666">${n}</text>`;
  }

  /* Grenze zum Nicht genügend */
  const grenze = `<line x1="${links}" y1="${y(4).toFixed(1)}" x2="${b - rechts}" y2="${y(4).toFixed(1)}" stroke="#B3241C" stroke-width="1.5" opacity="0.5"/>`;

  const saeulen = liste.map((a, i) => {
    if(a.schnitt === null) return "";
    const x = links + spalte * i + (spalte - breiteSaeule) / 2;
    const oberkante = y(a.schnitt);
    const hoeheSaeule = Math.max(2, (h - unten) - oberkante);
    const titel = svgEsc(a.nummer + ". am " + a.datum + (a.thema ? ", " + a.thema : "") +
      ": Schnitt " + fmt(a.schnitt) + ", " + a.anzahl + " geschrieben" +
      (a.negativ ? ", " + a.negativ + "\u00d7 Nicht genügend" : ""));
    return `<rect x="${x.toFixed(1)}" y="${oberkante.toFixed(1)}" width="${breiteSaeule.toFixed(1)}" height="${hoeheSaeule.toFixed(1)}"
                  rx="3" fill="#E9E7E1" stroke="#000000" stroke-width="1.5"><title>${titel}</title></rect>` +
           `<text x="${(x + breiteSaeule / 2).toFixed(1)}" y="${(oberkante - 5).toFixed(1)}" text-anchor="middle"
                  font-size="12" font-weight="bold" fill="#000000">${svgEsc(fmt(a.schnitt))}</text>` +
           `<text x="${(x + breiteSaeule / 2).toFixed(1)}" y="${(h - unten + 13).toFixed(1)}" text-anchor="middle"
                  font-size="11" fill="#000000">${a.nummer}.</text>` +
           `<text x="${(x + breiteSaeule / 2).toFixed(1)}" y="${(h - unten + 25).toFixed(1)}" text-anchor="middle"
                  font-size="9" fill="#666666">${svgEsc(a.datum)}</text>`;
  }).join("");

  return `<svg viewBox="0 0 ${b} ${h}" width="100%" height="${h}" role="img" preserveAspectRatio="xMidYMid meet"
      aria-label="Notenschnitt je Arbeit: ${liste.map(a => a.nummer + ". " + fmt(a.schnitt)).join(", ")}">
    ${gitter}${grenze}
    <line x1="${links}" y1="${(h - unten).toFixed(1)}" x2="${b - rechts}" y2="${(h - unten).toFixed(1)}" stroke="#000000" stroke-width="1.5"/>
    ${saeulen}
  </svg><div class="chart-hinweis">Höhe ist der Notenschnitt, oben die Eins. Die rote Linie ist die Grenze zum Nicht genügend.</div>`;
}

/* Wie oft welche Note in einer Klasse vergeben wurde */
function verteilungSvg(sub, sem, breite, hoehe, fertig){
  /* fertig: eine schon gezählte Verteilung [n1..n5], für die kleinen
     Vielfachen je Schularbeit. Ohne sie wird über das ganze Fach gezählt. */
  let anzahl;
  if(Array.isArray(fertig)){
    anzahl = fertig;
    if(!anzahl.some(v => v > 0)) return "";
  } else {
    const noten = wertendeNotenAlle(sub, sem);
    if(!noten.length) return "";
    anzahl = [1,2,3,4,5].map(n => noten.filter(e => e.value === n).length);
  }
  const groesste = Math.max.apply(null, anzahl) || 1;
  const gesamtZahl = anzahl.reduce((a, v) => a + v, 0);

  const b = breite || 380, h = hoehe || 120;
  const unten = 22, oben = 14;
  const iH = h - oben - unten;
  const spalte = b / 5;
  const balkenBreite = spalte * 0.56;

  const balken = anzahl.map((wert, i) => {
    const g = gradeColor(i + 1);
    const hoeheBalken = groesste ? (iH * wert) / groesste : 0;
    const xPos = i * spalte + (spalte - balkenBreite) / 2;
    const yPos = oben + iH - hoeheBalken;
    const stab = wert === 0 ? "" :
      `<rect x="${xPos.toFixed(1)}" y="${yPos.toFixed(1)}" width="${balkenBreite.toFixed(1)}" height="${hoeheBalken.toFixed(1)}"
             rx="3" fill="${g.bg}" stroke="${g.fg}" stroke-width="1.5"><title>Note ${i+1}: ${wert}×</title></rect>`;
    const anteil = gesamtZahl ? Math.round((wert * 100) / gesamtZahl) : 0;
    const zahl = `<text x="${(i * spalte + spalte / 2).toFixed(1)}" y="${(wert === 0 ? oben + iH - 4 : yPos - 5).toFixed(1)}"
             text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">${wert}</text>` +
      (wert ? `<text x="${(i * spalte + spalte / 2).toFixed(1)}" y="${(wert === 0 ? oben + iH + 6 : yPos + 12).toFixed(1)}"
             text-anchor="middle" font-size="9" fill="#4A4943">${anteil} %</text>` : "");
    const beschriftung = `<text x="${(i * spalte + spalte / 2).toFixed(1)}" y="${h - 6}" text-anchor="middle" font-size="11" fill="#000000">${i + 1}</text>`;
    return stab + zahl + beschriftung;
  }).join("");

  return `<svg viewBox="0 0 ${b} ${h}" width="100%" height="${h}" role="img" preserveAspectRatio="xMidYMid meet"
      aria-label="Verteilung der Noten, ${anzahl.map((v,i) => (i+1) + ": " + v + " mal").join(", ")}">
    <line x1="0" y1="${(h - unten).toFixed(1)}" x2="${b}" y2="${(h - unten).toFixed(1)}" stroke="#000000" stroke-width="1.5"/>
    ${balken}
  </svg>`;
}

/* Zusammenfassung der Stufeneinträge, zum Beispiel der Hausübungen */
/* Sagt in einem Satz, wie diese Kategorie gerade behandelt wird. Der Text
   richtet sich immer nach der Einstellung im Fach, damit auf dem Ausdruck
   nichts behauptet wird, was nicht stimmt. */
function zaehltText(sub, cat){
  if(!istStufenCat(sub, cat)) return "wird benotet";
  if(istBonusCat(sub, cat)){
    const liste = stufenListe(sub, cat).map((t, i) => {
      const v = bonusWert(sub, cat, i);
      return t + " = " + (v === 0 ? "0" : (v < 0 ? "\u2212" : "+") + fmtB(Math.abs(v)));
    }).join(", ");
    return "keine Note, wirkt als Bonus auf den Notenschnitt, höchstens " +
      fmtB(bonusMax(sub)) + " Notenstufen (" + liste + ")";
  }
  if(!stufeZaehlt(sub, cat)) return "wird nicht benotet und zählt nicht in den Notenschnitt";
  const anteil = isProzentMode(sub)
    ? "mit " + fmtPct(sub.weights[cat] ?? 0) + " % Anteil"
    : "mit Faktor " + fmtW(sub.weights[cat] ?? 1);
  const werte = stufenListe(sub, cat).map((t, i) =>
    t + " = " + fmt(stufenWert(sub, { cat: cat, stufe: i }))).join(", ");
  return "keine Note, zählt aber " + anteil + " in den Notenschnitt (" + werte + ")";
}

function stufenBilanz(sub, studentId, sem){
  const liste = stufenOf(sub, studentId, sem);
  if(!liste.length) return [];
  const cats = {};
  liste.forEach(e => {
    if(!cats[e.cat]) cats[e.cat] = {};
    const t = stufenText(sub, e);
    cats[e.cat][t] = (cats[e.cat][t] || 0) + 1;
  });
  return Object.keys(cats).map(cat => ({
    cat: cat,
    label: catLabel(sub, cat),
    zaehlt: stufeZaehlt(sub, cat),
    bonus: istBonusCat(sub, cat),
    hinweis: zaehltText(sub, cat),
    teile: stufenListe(sub, cat).filter(t => cats[cat][t]).map(t => cats[cat][t] + "× " + t)
  }));
}

/* ---------- ELTERNSPRECHTAG UND AUSDRUCK ----------
   Baut ein A4-Blatt in #printArea und ruft den Druckdialog auf. Der Ausdruck
   funktioniert auf iPad, Mac, Windows und am Handy, dort über Teilen und Drucken.
   Aus demselben Dialog lässt sich das Blatt auch als PDF sichern und mitgeben. */

function esc(t){
  return String(t === null || t === undefined ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function heute(){
  const d = new Date();
  return String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + "." + d.getFullYear();
}

function kopfMeta(){
  const teile = [];
  if(state.settings.lehrkraft) teile.push(esc(state.settings.lehrkraft));
  if(state.settings.schuljahr) teile.push("Schuljahr " + esc(state.settings.schuljahr));
  teile.push(esc(SEM_LABELS[aktivesSemester()]));
  teile.push("Stand " + heute());
  return teile.join("<br>");
}

/* Zeile mit beiden Semestern und dem Jahresschnitt. Steht auf jedem Blatt,
   damit am Elternsprechtag der Verlauf über das Schuljahr sichtbar ist. */
/* Klassenschnitt des Fachs im gewählten Zeitraum. Auf dem Elternblatt ist
   das die nützlichste zweite Zahl: erst im Vergleich sagt ein Schnitt etwas. */
function klassenSchnittVon(cls, sub, sem){
  const werte = cls.students.map(s => computeSchnitt(sub, s.id, sem)).filter(v => v !== null);
  if(!werte.length) return null;
  return werte.reduce((a, b) => a + b, 0) / werte.length;
}

function semesterZeile(sub, studentId){
  const s1 = computeSchnitt(sub, studentId, 1);
  const s2 = computeSchnitt(sub, studentId, 2);
  const ges = computeSchnitt(sub, studentId, "alle");
  const zeig = v => v === null ? "keine Note" : fmtO(v);
  return `<div class="pr-note" style="margin-top:2mm;">1. Semester ${zeig(s1)} &middot; 2. Semester ${zeig(s2)} &middot; ganzes Jahr ${zeig(ges)}</div>`;
}

function noteTabelle(sub, studentId){
  const noten = entriesOf(sub, studentId).filter(e => e.type === "note");
  if(!noten.length) return '<div class="pr-note">Noch keine Noten eingetragen.</div>';
  const zeilen = noten.map(n => {
    const grundlage = n.cat === "kompetenz"
      ? (n.achieved || []).length + " von " + n.total + " Kompetenzen"
      : (n.basis || "");
    return `<tr>
      <td>${esc(n.date)}</td>
      <td>${esc(eintragTitel(sub, n))}</td>
      <td>${esc(grundlage)}</td>
      <td>${esc(fmtW(noteWeight(sub, n)))}</td>
      <td style="text-align:center; font-weight:bold;">${n.value}</td>
    </tr>`;
  }).join("");
  return `<table class="pr-tbl">
    <tr><th style="width:14%;">Datum</th><th style="width:26%;">Beurteilung</th><th>Grundlage</th><th style="width:12%;">Gewicht</th><th style="width:10%;">Note</th></tr>
    ${zeilen}
  </table>`;
}

/* Stufeneinträge, zum Beispiel Hausübungen. Sie werden nicht benotet und
   erscheinen deshalb getrennt von der Notentabelle. */
/* Sagt in einem Satz, wie sich der Bonus bei genau dieser Person ausgewirkt
   hat. Nur wenn er tatsächlich etwas verändert, sonst wäre es nur Ballast. */
function bonusSatz(sub, studentId, sem){
  const grund = schnittOhneBonus(sub, studentId, sem);
  const schnitt = computeSchnitt(sub, studentId, sem);
  if(grund === null || schnitt === null) return "";
  const bonus = bonusSumme(sub, studentId, sem);
  if(!bonus.teile.length) return "";
  const woher = bonus.teile.map(t => t.label + " " + t.anzahl + "×").join(", ");
  if(Math.abs(schnitt - grund) < 0.005){
    return "Schnitt der Noten " + fmt(grund) + ". " + woher + " wurde eingetragen, verändert den Schnitt aber nicht.";
  }
  return "Schnitt der Noten " + fmt(grund) + ", " + woher + " " + bonusText(bonus.wert) +
    " auf " + fmt(schnitt) + (bonus.gedeckelt
      ? " (mehr als " + fmtB(bonusMax(sub)) + " Notenstufen kann die Mitarbeit nie ausmachen)" : "") + ".";
}

function bonusZeile(sub, studentId, sem){
  const satz = bonusSatz(sub, studentId, sem);
  return satz ? `<div class="pr-note" style="margin-top:2mm;">${esc(satz)}</div>` : "";
}

function stufenTabelle(sub, studentId){
  const liste = stufenOf(sub, studentId);
  if(!liste.length) return "";
  const bilanz = stufenBilanz(sub, studentId).map(b =>
    `<div class="pr-note" style="margin-top:2mm;"><b>${esc(b.label)}</b>, ${esc(b.hinweis)}: ${esc(b.teile.join(", "))}</div>`).join("");
  const zeilen = liste.map(e =>
    `<tr><td style="width:14%;">${esc(e.date)}</td><td style="width:26%;">${esc(catLabel(sub, e.cat))}</td><td>${esc(stufenText(sub, e))}${e.thema ? " &middot; " + esc(e.thema) : ""}</td></tr>`).join("");
  return bilanz + `<table class="pr-tbl" style="margin-top:2mm;">
    <tr><th>Datum</th><th>Art</th><th>Eintrag</th></tr>${zeilen}
  </table>`;
}

function verlaufTabelle(sub, studentId){
  const liste = entriesOf(sub, studentId).filter(e => e.type === "positiv" || e.type === "negativ" || e.type === "notiz" || e.type === "fehlt");
  if(!liste.length) return "";
  const zeilen = liste.map(e => {
    const art = e.type === "positiv" ? "Positiv" : (e.type === "negativ" ? "Negativ" : (e.type === "fehlt" ? catLabel(sub, e.cat) : "Notiz"));
    const text = (e.type === "fehlt" ? "nicht mitgeschrieben, keine Note" : (e.text || "")) +
                 (e.thema ? " \u00b7 " + e.thema : "");
    return `<tr><td style="width:14%;">${esc(e.date)}</td><td style="width:18%;">${esc(art)}</td><td>${esc(text)}</td></tr>`;
  }).join("");
  return `<table class="pr-tbl" style="margin-top:3mm;">
    <tr><th>Datum</th><th>Art</th><th>Eintrag</th></tr>${zeilen}
  </table>`;
}

/* Ein Blatt je Schüler:in, über alle Fächer dieser Klasse. Genau das,
   was am Elternsprechtag auf dem Tisch liegen und mitgegeben werden soll. */
function blattSchueler(cls, s){
  const teile = cls.subjects.map(sub => {
    const schnitt = computeSchnitt(sub, s.id);
    const pn = countPosNeg(sub, s.id);
    const hatWas = entriesOf(sub, s.id).length > 0;
    if(!hatWas) return "";
    const grafik = verlaufSvg(sub, s.id, undefined, 520, 150);
    return `
      <div class="pr-h2">${esc(sub.fach)}</div>
      <div class="pr-kpi">
        <div><div class="v">${fmtO(schnitt)}</div><div class="l">Notenschnitt${
          notenWort(schnitt) ? "<br>" + esc(notenWort(schnitt)) : ""}</div></div>
        ${klassenSchnittVon(cls, sub) !== null
          ? '<div><div class="v">' + fmtO(klassenSchnittVon(cls, sub)) + '</div><div class="l">Klassenschnitt<br>zum Vergleich</div></div>'
          : ""}
        ${(pn.pos + pn.neg) > 0
          ? '<div><div class="v">' + pn.pos + " / " + pn.neg + '</div><div class="l">Positiv / Negativ</div></div>'
          : ""}
        ${entriesOf(sub, s.id).filter(e => e.type === "fehlt").length
          ? '<div><div class="v">' + entriesOf(sub, s.id).filter(e => e.type === "fehlt").length + '</div><div class="l">nicht mitgeschrieben</div></div>'
          : ""}
      </div>
      ${grafik ? '<div class="pr-chart">' + grafik + "</div>" : ""}
      ${grafik ? "" : bonusZeile(sub, s.id)}
      ${noteTabelle(sub, s.id)}
      ${stufenTabelle(sub, s.id)}
      ${verlaufTabelle(sub, s.id)}
      ${semesterZeile(sub, s.id)}`;
  }).join("");

  const niveau = (cls.stufe === 1) ? "" : " &middot; " + NIVEAU_LABELS[s.niveau];
  return `<div class="pr-page">
    <div class="pr-head">
      <div>
        <div class="pr-h1">Leistungsübersicht</div>
        <div style="font-size:11pt; margin-top:1mm;">${esc(s.name)} &middot; Klasse ${esc(cls.name)}${niveau}</div>
        <div style="font-size:10pt; margin-top:1mm;">Zeitraum: ${esc(SEM_LABELS[aktivesSemester()])}</div>
      </div>
      <div class="pr-meta">${kopfMeta()}</div>
    </div>
    ${teile || '<div class="pr-note">In dieser Klasse sind für ' + esc(s.name) + ' noch keine Einträge vorhanden.</div>'}
    <div class="pr-note">Der Notenschnitt ist ein rechnerischer Zwischenstand und keine Zeugnisnote. Die endgültige Beurteilung erfolgt am Ende des Beurteilungszeitraums nach der Leistungsbeurteilungsverordnung.</div>
    <div class="pr-sign">
      <div>Unterschrift Lehrkraft</div>
      <div>Unterschrift Erziehungsberechtigte</div>
    </div>
  </div>`;
}

/* Ein Blatt für genau eine Arbeit. Das ist das Papier, das bei einer
   Konferenz oder im Gespräch mit der Fachgruppe auf dem Tisch liegt. */
function blattArbeit(cls, sub, cat, kennung){
  const liste = arbeiten(sub, cat);
  const a = liste.find(x => arbeitKennung(x) === String(kennung));
  if(!a) return "";
  const i = liste.indexOf(a);
  const v = arbeitVergleich(liste, i);
  const label = catLabel(sub, cat);
  const alle = arbeitEintraege(cls, sub, cat, arbeitKennung(a));
  const mitNote = alle.filter(x => x.e.type === "note")
    .sort((x, y) => x.e.value - y.e.value || x.s.name.localeCompare(y.s.name));
  const ohneNote = alle.filter(x => x.e.type === "fehlt");

  const zeilen = mitNote.map(x => `<tr>
      <td>${esc(x.s.name)}</td>
      <td>${cls.stufe === 1 ? "&ndash;" : esc(NIVEAU_LABELS[x.s.niveau])}</td>
      <td>${esc(x.e.basis || "")}</td>
      <td style="text-align:center; font-weight:bold;">${x.e.value}</td>
    </tr>`).join("") +
    ohneNote.map(x => `<tr>
      <td>${esc(x.s.name)}</td>
      <td>${cls.stufe === 1 ? "&ndash;" : esc(NIVEAU_LABELS[x.s.niveau])}</td>
      <td>nicht mitgeschrieben</td>
      <td style="text-align:center;">&ndash;</td>
    </tr>`).join("");

  return `<div class="pr-page">
    <div class="pr-head">
      <div>
        <div class="pr-h1">${a.nummer}. ${esc(label)}</div>
        <div style="font-size:11pt; margin-top:1mm;">Klasse ${esc(cls.name)} &middot; ${esc(sub.fach)} &middot; ${esc(a.datum)}</div>
        ${a.thema ? '<div style="font-size:10pt; margin-top:1mm;">Thema: ' + esc(a.thema) + "</div>" : ""}
      </div>
      <div class="pr-meta">${kopfMeta()}</div>
    </div>
    <div class="pr-kpi">
      <div><div class="v">${fmtO(a.schnitt)}</div><div class="l">Notenschnitt</div></div>
      <div><div class="v">${a.anzahl}</div><div class="l">geschrieben${a.fehlt ? " (+" + a.fehlt + " nicht)" : ""}</div></div>
      <div><div class="v">${a.negativ}</div><div class="l">Nicht genügend</div></div>
    </div>
    <div class="pr-chart">${verteilungSvg(sub, undefined, 520, 130, a.verteilung)}</div>
    <div class="pr-h2">Notenspiegel</div>
    ${spiegelTabelle(a.verteilung, "pr-tbl")}
    ${v ? '<div class="pr-note" style="margin-top:3mm;">Diese Arbeit ist ' + esc(v.text) + ".</div>" : ""}
    ${liste.length > 1 ? '<div class="pr-h2">Alle Termine im Vergleich</div><div class="pr-chart">' + arbeitenSvg(liste, 520, 140) + "</div>" : ""}
    <div class="pr-h2">Alle Noten</div>
    <table class="pr-tbl">
      <tr><th>Name</th><th style="width:20%;">Leistungsniveau</th><th style="width:30%;">Grundlage</th><th style="width:10%;">Note</th></tr>
      ${zeilen || '<tr><td colspan="4">Keine Einträge.</td></tr>'}
    </table>
  </div>`;
}

/* Alle Arbeiten einer Kategorie auf einem Blatt, je Arbeit ein eigener
   Block. Das ist das Blatt für das Ende des Schuljahres. */
function blattAlleArbeiten(cls, sub, cat){
  const liste = arbeiten(sub, cat);
  if(!liste.length) return "";
  const label = catLabel(sub, cat);

  const bloecke = liste.map((a, i) => {
    const v = arbeitVergleich(liste, i);
    return `<div style="margin-top:5mm; border-top:1px solid #000000; padding-top:3mm;">
      <div class="pr-h2" style="margin-top:0;">${a.nummer}. ${esc(label)} &middot; ${esc(a.datum)}${
        a.thema ? " &middot; " + esc(a.thema) : ""}</div>
      <div style="display:flex; gap:6mm; align-items:flex-start;">
        <div style="flex:1;">
          <table class="pr-tbl">
            <tr><th>Beurteilung</th><th style="width:22%;">Anzahl</th><th style="width:22%;">Anteil</th></tr>
            ${notenspiegel(a.verteilung).map(z => `<tr>
              <td>${z.note} &middot; ${esc(z.wort)}</td>
              <td style="text-align:center; font-weight:bold;">${z.anzahl}</td>
              <td style="text-align:center;">${fmtPct(z.anteil)} %</td>
            </tr>`).join("")}
            <tr><td style="font-weight:bold;">Notenschnitt</td>
                <td style="text-align:center; font-weight:bold;">${fmt(a.schnitt)}</td>
                <td style="text-align:center;">${a.anzahl} geschr.${a.fehlt ? ", " + a.fehlt + " nicht" : ""}</td></tr>
          </table>
        </div>
        <div style="flex:1;">${verteilungSvg(sub, undefined, 250, 110, a.verteilung)}</div>
      </div>
      ${v ? '<div class="pr-note" style="margin-top:2mm;">' + esc(v.text.charAt(0).toUpperCase() + v.text.slice(1)) + ".</div>" : ""}
    </div>`;
  }).join("");

  return `<div class="pr-page">
    <div class="pr-head">
      <div>
        <div class="pr-h1">${esc(label)}: alle Termine im Überblick</div>
        <div style="font-size:11pt; margin-top:1mm;">Klasse ${esc(cls.name)} &middot; ${esc(sub.fach)}</div>
        <div style="font-size:10pt; margin-top:1mm;">Zeitraum: ${esc(SEM_LABELS[aktivesSemester()])}</div>
      </div>
      <div class="pr-meta">${kopfMeta()}</div>
    </div>
    ${liste.length > 1 ? '<div class="pr-chart">' + arbeitenSvg(liste, 520, 150) + "</div>" : ""}
    ${bloecke}
  </div>`;
}

function printAlleArbeiten(classId, subjectId, cat){
  const cls = getClass(classId);
  const sub = getSubject(cls, subjectId);
  if(!cls || !sub) return;
  const blatt = blattAlleArbeiten(cls, sub, cat);
  if(!blatt){ alert("Für diese Beurteilungsart gibt es noch keine Einträge."); return; }
  document.getElementById("printArea").innerHTML = blatt;
  window.print();
}

function printArbeit(classId, subjectId, cat, kennung){
  const cls = getClass(classId);
  const sub = getSubject(cls, subjectId);
  if(!cls || !sub) return;
  document.getElementById("printArea").innerHTML = blattArbeit(cls, sub, cat, kennung);
  window.print();
}

function blattKlasse(cls, sub){
  const je = cls.students.map(s => ({ s: s, schnitt: computeSchnitt(sub, s.id), ...countPosNeg(sub, s.id) }));
  const avgs = je.map(p => p.schnitt).filter(v => v !== null);
  const klassenschnitt = avgs.length ? avgs.reduce((a,b) => a+b, 0) / avgs.length : null;
  const zeilen = je.map(p => `<tr>
      <td>${esc(p.s.name)}</td>
      <td>${cls.stufe === 1 ? "&ndash;" : esc(NIVEAU_LABELS[p.s.niveau])}</td>
      <td style="text-align:center;">${p.pos}</td>
      <td style="text-align:center;">${p.neg}</td>
      <td style="text-align:center; font-weight:bold;">${fmt(p.schnitt)}</td>
    </tr>`).join("");
  const verteilung = verteilungSvg(sub, undefined, 520, 130);

  /* Der Vergleich der Arbeiten gehört auch auf das Blatt: er ist die Zahl,
     die bei einer Konferenz zuerst gefragt wird. */
  const vergleichDruck = notenCats(sub).map(k => {
    const liste = arbeiten(sub, k);
    if(liste.length < 2) return "";
    const zeilen = liste.map((a, i) => {
      const v = arbeitVergleich(liste, i);
      return `<tr>
        <td style="text-align:center; font-weight:bold;">${a.nummer}.</td>
        <td>${esc(a.datum)}${a.thema ? " &middot; " + esc(a.thema) : ""}</td>
        <td style="text-align:center; font-weight:bold;">${fmt(a.schnitt)}</td>
        <td style="text-align:center;">${a.verteilung.join(" &middot; ")}</td>
        <td style="text-align:center;">${a.anzahl}${a.fehlt ? " (+" + a.fehlt + ")" : ""}</td>
        <td style="text-align:center;">${a.negativ}</td>
        <td>${v ? esc(v.text) : "erste Arbeit"}</td>
      </tr>`;
    }).join("");
    return `<div class="pr-h2">${esc(catLabel(sub, k))} im Vergleich</div>` +
      '<div class="pr-chart">' + arbeitenSvg(liste, 520, 150) + "</div>" +
      `<table class="pr-tbl">
        <tr><th style="width:7%;">Nr.</th><th>Termin</th><th style="width:10%;">Schnitt</th>
            <th style="width:20%;">1·2·3·4·5</th><th style="width:12%;">geschrieben</th>
            <th style="width:11%;">Nicht gen.</th><th style="width:26%;">gegenüber der vorigen</th></tr>
        ${zeilen}
      </table>`;
  }).join("");

  const proKat = notenCats(sub).map(k => {
    const noten = wertendeNotenAlle(sub).filter(e => e.cat === k);
    if(!noten.length) return "";
    const mittel = noten.reduce((a,n) => a + n.value, 0) / noten.length;
    return `<tr><td>${esc(catLabel(sub,k))}</td><td style="text-align:center;">${noten.length}</td><td style="text-align:center; font-weight:bold;">${fmt(mittel)}</td></tr>`;
  }).join("");

  return `<div class="pr-page">
    <div class="pr-head">
      <div>
        <div class="pr-h1">Klassenübersicht</div>
        <div style="font-size:11pt; margin-top:1mm;">Klasse ${esc(cls.name)} &middot; ${esc(sub.fach)}</div>
        <div style="font-size:10pt; margin-top:1mm;">Zeitraum: ${esc(SEM_LABELS[aktivesSemester()])}</div>
      </div>
      <div class="pr-meta">${kopfMeta()}</div>
    </div>
    <div class="pr-kpi">
      <div><div class="v">${fmtO(klassenschnitt)}</div><div class="l">Klassenschnitt</div></div>
      <div><div class="v">${cls.students.length}</div><div class="l">Schüler:innen</div></div>
      <div><div class="v">${wertendeNotenAlle(sub).length}</div><div class="l">Noten im Zeitraum</div></div>
    </div>
    ${verteilung ? '<div class="pr-h2">Verteilung der Noten</div><div class="pr-chart">' + verteilung + "</div>" : ""}
    <table class="pr-tbl">
      <tr><th>Name</th><th style="width:22%;">Leistungsniveau</th><th style="width:10%;">Positiv</th><th style="width:10%;">Negativ</th><th style="width:12%;">Schnitt</th></tr>
      ${zeilen || '<tr><td colspan="5">Noch keine Schüler:innen.</td></tr>'}
    </table>
    ${proKat ? '<div class="pr-h2">Mittelwerte je Beurteilung</div><table class="pr-tbl"><tr><th>Beurteilung</th><th style="width:14%;">Noten</th><th style="width:14%;">Schnitt</th></tr>' + proKat + "</table>" : ""}
    ${vergleichDruck}
  </div>`;
}

function drucken(html){
  const bereich = document.getElementById("printArea");
  bereich.innerHTML = html;
  window.print();
}

function printSchueler(classId, studentId){
  const cls = getClass(classId);
