}

/* Führt einen fremden Datenstand mit dem Stand auf diesem Gerät zusammen.
   Zuordnung über die IDs, ersatzweise über die Bezeichnung. Bei zwei Fassungen
   desselben Eintrags gewinnt die neuere. Es wird nichts gelöscht. */
function mergeState(basis, fremd){
  const bericht = { klassen:0, schueler:0, faecher:0, eintraege:0 };

  fremd.classes.forEach(fc => {
    let bc = basis.classes.find(c => c.id === fc.id)
          || basis.classes.find(c => c.name.trim().toLowerCase() === fc.name.trim().toLowerCase());
    if(!bc){
      bc = { id: fc.id, name: fc.name, stufe: fc.stufe, students: [], subjects: [] };
      basis.classes.push(bc);
      bericht.klassen++;
    }

    const idMap = {};
    fc.students.forEach(fs => {
      let bs = bc.students.find(s => s.id === fs.id)
            || bc.students.find(s => s.name.trim().toLowerCase() === fs.name.trim().toLowerCase());
      if(!bs){
        bs = { id: fs.id, name: fs.name, niveau: fs.niveau, photo: fs.photo || null, updatedAt: fs.updatedAt || 0 };
        bc.students.push(bs);
        bericht.schueler++;
      } else if((fs.updatedAt || 0) > (bs.updatedAt || 0)){
        bs.niveau = fs.niveau;
        if(fs.photo) bs.photo = fs.photo;
        bs.updatedAt = fs.updatedAt || 0;
      } else if(!bs.photo && fs.photo){
        bs.photo = fs.photo;
      }
      idMap[fs.id] = bs.id;
    });

    fc.subjects.forEach(fsub => {
      let bsub = bc.subjects.find(s => s.id === fsub.id)
              || bc.subjects.find(s => s.fach.trim().toLowerCase() === fsub.fach.trim().toLowerCase());
      if(!bsub){
        bsub = {
          id: fsub.id, fach: fsub.fach, template: fsub.template, weightMode: fsub.weightMode,
          cats: (fsub.cats || []).slice(), weights: Object.assign({}, fsub.weights),
          customCats: (fsub.customCats || []).map(c => Object.assign({}, c)),
          competencies: (fsub.competencies || []).slice(), entries: []
        };
        bc.subjects.push(bsub);
        bericht.faecher++;
      } else {
        (fsub.customCats || []).forEach(c => {
          if(!bsub.customCats.some(x => x.key === c.key)){
            bsub.customCats.push(Object.assign({}, c));
            if(typeof bsub.weights[c.key] !== "number") bsub.weights[c.key] = fsub.weights[c.key] ?? 10;
            if((bsub.cats || []).indexOf(c.key) === -1) bsub.cats.push(c.key);
          }
        });
      }

      (fsub.entries || []).forEach(fe => {
        const ziel = idMap[fe.studentId] || fe.studentId;
        const vorhanden = bsub.entries.find(e => e.id === fe.id);
        if(!vorhanden){
          const kopie = Object.assign({}, fe, { studentId: ziel });
          bsub.entries.push(kopie);
          bericht.eintraege++;
        } else if((fe.ts || 0) > (vorhanden.ts || 0)){
          Object.assign(vorhanden, fe, { studentId: ziel });
        }
      });
    });
  });

  basis.classes.forEach(normaliseClass);
  if(fremd.settings && fremd.settings.lastBackup){
    if(!basis.settings.lastBackup || fremd.settings.lastBackup > basis.settings.lastBackup){
      basis.settings.lastBackup = fremd.settings.lastBackup;
    }
  }
  return bericht;
}

/* ---------- DIREKTÜBERTRAGUNG IM WLAN ----------
   Läuft nur, wenn die App über das kleine Übertragungsprogramm geöffnet wurde.
   Das Programm liegt auf dem Rechner, hält eine Ablage im Arbeitsspeicher und
   ist über das WLAN erreichbar. Es geht nichts ins Internet und nichts in eine
   Cloud. Ein vierstelliger Zahlencode, den nur das Fenster am Rechner zeigt,
   schützt die Ablage vor anderen Geräten im selben Netz. */

let uebertragung = { da: false, status: null };

function uebertragungCode(){
  try{ return localStorage.getItem("klassenheft_code") || ""; }catch(e){ return ""; }
}

function setUebertragungCode(wert){
  try{ localStorage.setItem("klassenheft_code", String(wert || "").trim()); }catch(e){}
}

function codeAusFeld(){
  const el = document.getElementById("codeInput");
  const wert = el ? el.value.trim() : uebertragungCode();
  setUebertragungCode(wert);
  return wert;
}

/* Nur nachsehen, wenn die App über eine gewöhnliche http-Adresse läuft.
   Genau so liefert das Hilfsprogramm aus. Auf einer https-Adresse wie
   GitHub Pages oder beim Öffnen der Datei selbst wird gar nicht erst
   gefragt, damit dort keine überflüssige Anfrage entsteht. */
function uebertragungPruefen(){
  if(location.protocol !== "http:" || typeof fetch !== "function") return Promise.resolve(false);
  return fetch("ablage/status", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if(j && j.klassenheft){
        uebertragung.da = true;
        uebertragung.status = j;
        render();
        return true;
      }
      return false;
    })
    .catch(function(){ return false; });
}

function ablageFehler(e){
  alert("Die Ablage ist gerade nicht erreichbar.\n\nLäuft das Übertragungsprogramm am Rechner noch, und sind beide Geräte im selben WLAN?");
}

function ablageSenden(){
  if(typeof fetch !== "function") return;
  const code = codeAusFeld();
  fetch("ablage", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Klassenheft-Code": code },
    body: JSON.stringify(sicherungsDaten())
  }).then(function(r){
    if(r.status === 403){ alert("Der Zahlencode stimmt nicht.\n\nEr steht im Fenster des Übertragungsprogramms am Rechner."); return null; }
    if(!r.ok) throw new Error("Fehler");
    return r.json();
  }).then(function(j){
    if(!j) return;
    return uebertragungPruefen().then(function(){
      alert("Daten abgelegt.\n\nJetzt am anderen Gerät auf »Daten holen und zusammenführen« tippen.");
    });
  }).catch(ablageFehler);
}

function ablageHolen(){
  if(typeof fetch !== "function") return;
  const code = codeAusFeld();
  fetch("ablage", { headers: { "X-Klassenheft-Code": code }, cache: "no-store" })
    .then(function(r){
      if(r.status === 403){ alert("Der Zahlencode stimmt nicht.\n\nEr steht im Fenster des Übertragungsprogramms am Rechner."); return null; }
      if(r.status === 404){ alert("In der Ablage liegt noch nichts.\n\nZuerst am anderen Gerät auf »Daten hier ablegen« tippen."); return null; }
      if(!r.ok) throw new Error("Fehler");
      return r.json();
    })
    .then(function(daten){
      if(!daten) return;
      if(!daten.classes || !Array.isArray(daten.classes)){ alert("In der Ablage liegen keine brauchbaren Daten."); return; }
      const woher = daten.geraet ? " von " + daten.geraet : "";
      if(!confirm("Daten" + woher + " mit diesem Gerät zusammenführen? Es wird nichts gelöscht, fehlende Einträge kommen dazu.")) return;
      const bericht = mergeState(state, migrate(daten));
      save();
      ansichtenZuruecksetzen();
      switchTab("home");
      alert("Zusammengeführt.\n\nNeu dazugekommen:\n" +
        bericht.klassen + " Klasse(n)\n" +
        bericht.schueler + " Schüler:in(nen)\n" +
        bericht.faecher + " Fach/Fächer\n" +
        bericht.eintraege + " Eintrag/Einträge");
    })
    .catch(ablageFehler);
}

function ablageLeeren(){
  if(typeof fetch !== "function") return;
  if(!confirm("Ablage leeren? Die Daten auf den Geräten bleiben unverändert.")) return;
  const code = codeAusFeld();
  fetch("ablage", { method: "DELETE", headers: { "X-Klassenheft-Code": code } })
    .then(function(r){
      if(r.status === 403){ alert("Der Zahlencode stimmt nicht."); return; }
      return uebertragungPruefen().then(function(){ alert("Ablage geleert."); });
    })
    .catch(ablageFehler);
}

function uebertragungBereich(){
  if(!uebertragung.da) return "";
  const st = uebertragung.status || {};
  const inhalt = st.vorhanden
    ? "In der Ablage liegen Daten" + (st.geraet ? " von " + esc(st.geraet) : "") + (st.zeit ? ", abgelegt um " + esc(st.zeit) : "") + "."
    : "Die Ablage ist leer.";
  return `
    <div class="label" style="border-top:2px solid #000;">DIREKTÜBERTRAGUNG IM WLAN</div>
    <div class="helptext">Das Übertragungsprogramm am Rechner läuft. ${inhalt} Am Gerät mit den neueren Einträgen auf Ablegen tippen, am anderen auf Holen. Die Daten gehen dabei nur durch euer WLAN.</div>
    <div style="padding:0 16px;">
      <span class="field-label">Zahlencode aus dem Fenster am Rechner</span>
      <input type="text" id="codeInput" inputmode="numeric" maxlength="6" value="${esc(uebertragungCode())}" placeholder="z. B. 4271">
    </div>
    <div class="footer">
      <button onclick="ablageSenden()">Daten hier ablegen</button>
      <button onclick="ablageHolen()">Daten holen und zusammenführen</button>
      <button class="ghost" onclick="ablageLeeren()">Ablage leeren</button>
    </div>`;
}

function ansichtenZuruecksetzen(){
  homeView = { screen:"list", classId:null, subjectId:null, studentId:null, noteFilter:"alle", entryType:null,
               newNoteCat:"schularbeit", newNoteGrade:null, noteBasis:null, noteWeight:1 };
  statView = { screen:"list", classId:null, subjectId:null };
  settingsView = { screen:"list", classId:null, subjectId:null, newCatColor:null };
}

document.getElementById("importInput").addEventListener("change", function(ev){
  const file = ev.target.files[0];
  ev.target.value = "";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let data;
    try{
      data = JSON.parse(e.target.result);
      if(!data || !Array.isArray(data.classes)) throw new Error("ungültiges Format");
    }catch(err){
      alert("Diese Datei konnte nicht gelesen werden. Bitte eine Klassenheft-Sicherungsdatei mit der Endung .json wählen. Die Word-Datei lässt sich nicht zurückspielen.");
      return;
    }
    const fremd = migrate(data);
    if(importModus === "ersetzen"){
      if(!confirm("Alles ersetzen? Der aktuelle Stand auf diesem Gerät wird dabei überschrieben.\n\nDie App legt vorher von selbst eine Sicherheitskopie an.")) return;
      sicherheitskopieAnlegen("vor dem Ersetzen");
      state = fremd;
      state.settings = normaliseSettings(state.settings);
      save();
      ansichtenZuruecksetzen();
      switchTab("home");
      alert("Sicherung eingespielt.");
      return;
    }
    if(!confirm("Daten aus der Datei mit diesem Gerät zusammenführen? Es wird nichts gelöscht, fehlende Einträge kommen dazu.")) return;
    const bericht = mergeState(state, fremd);
    save();
    ansichtenZuruecksetzen();
    switchTab("home");
    alert("Zusammengeführt.\n\nNeu dazugekommen:\n" +
      bericht.klassen + " Klasse(n)\n" +
      bericht.schueler + " Schüler:in(nen)\n" +
      bericht.faecher + " Fach/Fächer\n" +
      bericht.eintraege + " Eintrag/Einträge");
  };
  reader.readAsText(file);
});

/* ---------- ELTERNSPRECHTAG UND AUSDRUCK ----------
   Baut ein A4-Blatt in #printArea und ruft den Druckdialog auf. Der Ausdruck
   funktioniert auf iPad, Mac, Windows und am Handy, dort über Teilen und Drucken.
   Aus demselben Dialog lässt sich das Blatt auch als PDF sichern und mitgeben. */

function esc(t){
  return String(t === null || t === undefined ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function heute(){
  const d = new Date();
  return String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + "." + d.getFullYear();
}

function kopfMeta(){
  const teile = [];
  if(state.settings.lehrkraft) teile.push(esc(state.settings.lehrkraft));
  if(state.settings.schuljahr) teile.push("Schuljahr " + esc(state.settings.schuljahr));
  teile.push(esc(SEM_LABELS[aktivesSemester()]));
  teile.push("Stand " + heute());
  return teile.join("<br>");
}

/* Zeile mit beiden Semestern und dem Jahresschnitt. Steht auf jedem Blatt,
   damit am Elternsprechtag der Verlauf über das Schuljahr sichtbar ist. */
function semesterZeile(sub, studentId){
  const s1 = computeSchnitt(sub, studentId, 1);
  const s2 = computeSchnitt(sub, studentId, 2);
  const ges = computeSchnitt(sub, studentId, "alle");
  const zeig = v => v === null ? "keine Note" : fmtO(v);
  return `<div class="pr-note" style="margin-top:2mm;">1. Semester ${zeig(s1)} &middot; 2. Semester ${zeig(s2)} &middot; ganzes Jahr ${zeig(ges)}</div>`;
}

function noteTabelle(sub, studentId){
  const noten = entriesOf(sub, studentId).filter(e => e.type === "note");
  if(!noten.length) return '<div class="pr-note">Noch keine Noten eingetragen.</div>';
  const zeilen = noten.map(n => {
    const grundlage = n.cat === "kompetenz"
      ? (n.achieved || []).length + " von " + n.total + " Kompetenzen"
      : (n.basis || "");
    return `<tr>
      <td>${esc(n.date)}</td>
      <td>${esc(noteBezeichnung(sub, n))}</td>
      <td>${esc(grundlage)}</td>
      <td>${esc(fmtW(noteWeight(sub, n)))}</td>
      <td style="text-align:center; font-weight:bold;">${n.value}</td>
    </tr>`;
  }).join("");
  return `<table class="pr-tbl">
    <tr><th style="width:14%;">Datum</th><th style="width:26%;">Beurteilung</th><th>Grundlage</th><th style="width:12%;">Gewicht</th><th style="width:10%;">Note</th></tr>
    ${zeilen}
  </table>`;
}

function verlaufTabelle(sub, studentId){
  const liste = entriesOf(sub, studentId).filter(e => e.type === "positiv" || e.type === "negativ" || e.type === "notiz");
  if(!liste.length) return "";
  const zeilen = liste.map(e => {
    const art = e.type === "positiv" ? "Positiv" : (e.type === "negativ" ? "Negativ" : "Notiz");
    return `<tr><td style="width:14%;">${esc(e.date)}</td><td style="width:18%;">${art}</td><td>${esc(e.text)}</td></tr>`;
  }).join("");
  return `<table class="pr-tbl" style="margin-top:3mm;">
    <tr><th>Datum</th><th>Art</th><th>Eintrag</th></tr>${zeilen}
  </table>`;
}

/* Ein Blatt je Schüler:in, über alle Fächer dieser Klasse. Genau das,
   was am Elternsprechtag auf dem Tisch liegen und mitgegeben werden soll. */
function blattSchueler(cls, s){
  const teile = cls.subjects.map(sub => {
    const schnitt = computeSchnitt(sub, s.id);
    const pn = countPosNeg(sub, s.id);
    const hatWas = entriesOf(sub, s.id).length > 0;
    if(!hatWas) return "";
    return `
      <div class="pr-h2">${esc(sub.fach)}</div>
      <div class="pr-kpi">
        <div><div class="v">${fmtO(schnitt)}</div><div class="l">Notenschnitt</div></div>
        <div><div class="v">${pn.pos}</div><div class="l">Positiv</div></div>
        <div><div class="v">${pn.neg}</div><div class="l">Negativ</div></div>
      </div>
      ${noteTabelle(sub, s.id)}
      ${verlaufTabelle(sub, s.id)}
      ${semesterZeile(sub, s.id)}`;
  }).join("");

  const niveau = (cls.stufe === 1) ? "" : " &middot; " + NIVEAU_LABELS[s.niveau];
  return `<div class="pr-page">
    <div class="pr-head">
      <div>
        <div class="pr-h1">Leistungsübersicht</div>
        <div style="font-size:11pt; margin-top:1mm;">${esc(s.name)} &middot; Klasse ${esc(cls.name)}${niveau}</div>
        <div style="font-size:10pt; margin-top:1mm;">Zeitraum: ${esc(SEM_LABELS[aktivesSemester()])}</div>
      </div>
      <div class="pr-meta">${kopfMeta()}</div>
    </div>
    ${teile || '<div class="pr-note">In dieser Klasse sind für ' + esc(s.name) + ' noch keine Einträge vorhanden.</div>'}
    <div class="pr-note">Der Notenschnitt ist ein rechnerischer Zwischenstand und keine Zeugnisnote. Die endgültige Beurteilung erfolgt am Ende des Beurteilungszeitraums nach der Leistungsbeurteilungsverordnung.</div>
    <div class="pr-sign">
      <div>Unterschrift Lehrkraft</div>
      <div>Unterschrift Erziehungsberechtigte</div>
    </div>
  </div>`;
}

function blattKlasse(cls, sub){
  const je = cls.students.map(s => ({ s: s, schnitt: computeSchnitt(sub, s.id), ...countPosNeg(sub, s.id) }));
  const avgs = je.map(p => p.schnitt).filter(v => v !== null);
  const klassenschnitt = avgs.length ? avgs.reduce((a,b) => a+b, 0) / avgs.length : null;
  const zeilen = je.map(p => `<tr>
      <td>${esc(p.s.name)}</td>
      <td>${cls.stufe === 1 ? "&ndash;" : esc(NIVEAU_LABELS[p.s.niveau])}</td>
      <td style="text-align:center;">${p.pos}</td>
      <td style="text-align:center;">${p.neg}</td>
      <td style="text-align:center; font-weight:bold;">${fmt(p.schnitt)}</td>
    </tr>`).join("");
  const proKat = activeCats(sub).map(k => {
    const noten = notenOf(sub).filter(e => e.cat === k);
    if(!noten.length) return "";
    const mittel = noten.reduce((a,n) => a + n.value, 0) / noten.length;
    return `<tr><td>${esc(catLabel(sub,k))}</td><td style="text-align:center;">${noten.length}</td><td style="text-align:center; font-weight:bold;">${fmt(mittel)}</td></tr>`;
  }).join("");

  return `<div class="pr-page">
    <div class="pr-head">
      <div>
        <div class="pr-h1">Klassenübersicht</div>
        <div style="font-size:11pt; margin-top:1mm;">Klasse ${esc(cls.name)} &middot; ${esc(sub.fach)}</div>
        <div style="font-size:10pt; margin-top:1mm;">Zeitraum: ${esc(SEM_LABELS[aktivesSemester()])}</div>
      </div>
      <div class="pr-meta">${kopfMeta()}</div>
    </div>
    <div class="pr-kpi">
      <div><div class="v">${fmtO(klassenschnitt)}</div><div class="l">Klassenschnitt</div></div>
      <div><div class="v">${cls.students.length}</div><div class="l">Schüler:innen</div></div>
      <div><div class="v">${notenOf(sub).length}</div><div class="l">Noten im Zeitraum</div></div>
    </div>
    <table class="pr-tbl">
      <tr><th>Name</th><th style="width:22%;">Leistungsniveau</th><th style="width:10%;">Positiv</th><th style="width:10%;">Negativ</th><th style="width:12%;">Schnitt</th></tr>
      ${zeilen || '<tr><td colspan="5">Noch keine Schüler:innen.</td></tr>'}
    </table>
    ${proKat ? '<div class="pr-h2">Mittelwerte je Beurteilung</div><table class="pr-tbl"><tr><th>Beurteilung</th><th style="width:14%;">Noten</th><th style="width:14%;">Schnitt</th></tr>' + proKat + "</table>" : ""}
  </div>`;
}

function drucken(html){
  const bereich = document.getElementById("printArea");
  bereich.innerHTML = html;
  window.print();
}

function printSchueler(classId, studentId){
  const cls = getClass(classId);
  const s = getStudent(cls, studentId);
  if(!cls || !s) return;
  drucken(blattSchueler(cls, s));
}

function printKlasse(classId, subjectId){
  const cls = getClass(classId);
  const sub = getSubject(cls, subjectId);
  if(!cls || !sub) return;
  drucken(blattKlasse(cls, sub));
}

/* Alle Blätter einer Klasse auf einmal, ein Blatt je Schüler:in.
   Praktisch am Abend vor dem Elternsprechtag. */
function printAlleSchueler(classId){
  const cls = getClass(classId);
  if(!cls || !cls.students.length) return;
  drucken(cls.students.map(s => blattSchueler(cls, s)).join(""));
}

}

function renderStatDetail(){
  const cls = getClass(statView.classId);
  const sub = getSubject(cls, statView.subjectId);
  if(!cls || !sub) return renderStatList();

  const je = cls.students.map(s => ({ s: s, schnitt: computeSchnitt(sub, s.id), ...countPosNeg(sub, s.id) }));
  const avgs = je.map(p => p.schnitt).filter(v => v !== null);
  const klassenschnitt = avgs.length ? avgs.reduce((a,b) => a+b, 0) / avgs.length : null;
  const totalPos = je.reduce((a,p) => a + p.pos, 0);
  const totalNeg = je.reduce((a,p) => a + p.neg, 0);
  const sortiert = je.slice().sort((a,b) => (b.schnitt ?? 0) - (a.schnitt ?? 0));

  const rows = sortiert.map(p => {
    const bad = p.schnitt !== null && p.schnitt >= 4.0;
    return `<div class="row" style="cursor:default;">
      <div style="display:flex; align-items:center; gap:10px;">
        ${avatarHtml(p.s, true)}
        <div class="name" style="font-size:14px;">${p.s.name}</div>
      </div>
      <div style="text-align:right; display:flex; gap:10px; align-items:center;">
        <span style="font-size:12px;"><span class="green">${p.pos}</span>/<span class="${p.neg > p.pos ? "red" : ""}">${p.neg}</span></span>
        <span class="val ${bad ? "red" : ""}" style="font-size:14px;">${fmtO(p.schnitt)}</span>
        <button class="ghost" onclick="printSchueler('${cls.id}','${p.s.id}')">Blatt</button>
      </div>
    </div>`;
  }).join("");

  const perCat = activeCats(sub).map(k => {
    const noten = notenOf(sub).filter(e => e.cat === k);
    if(!noten.length) return "";
    const mittel = noten.reduce((a,n) => a + n.value, 0) / noten.length;
    const c = catCol(sub, k);
    return `<div class="entry">
      <span class="catdot" style="background:${c.fg};"></span>
      <div class="txt">${catLabel(sub,k)}</div>
      <span class="badge" style="border-color:${c.fg}; color:${c.fg}; background:${c.bg};">${noten.length} Noten</span>
      <span class="grade">${fmtO(mittel)}</span>
    </div>`;
  }).join("");

  return `
    <div class="header" style="${headerStyle("statistik")}">
      <span class="back" style="${titleStyle("statistik")}" onclick="goStat('list')">&lsaquo;</span>
      <span class="title" style="${titleStyle("statistik")}">${cls.name} &middot; ${sub.fach}</span>
      <div class="sub">${SEM_LABELS[aktivesSemester()]}</div>
    </div>
    ${semesterLeiste("statistik")}
    <div class="stats">
      <div class="stat"><div class="val ${klassenschnitt !== null && klassenschnitt >= 4 ? "red" : ""}">${fmtO(klassenschnitt)}</div><div class="lbl">Klassenschnitt</div></div>
      <div class="stat"><div class="val"><span class="green">${totalPos}</span> / <span class="${totalNeg > totalPos ? "red" : ""}">${totalNeg}</span></div><div class="lbl">Positiv / Negativ gesamt</div></div>
    </div>
    <div class="label">SCHÜLER:INNEN</div>
    ${rows || '<div class="helptext">Noch keine Schüler:innen.</div>'}
    ${perCat ? '<div class="label" style="border-top:2px solid #000;">JE KATEGORIE</div>' + perCat : ""}
    <div class="label" style="border-top:2px solid #000;">ELTERNSPRECHTAG</div>
    <div class="helptext">Blatt mit Notenübersicht, Verlauf und Unterschriftenzeile. Im Druckdialog lässt es sich auch als PDF sichern und den Eltern mitgeben.</div>
    <div class="footer">
      <button onclick="printKlasse('${cls.id}','${sub.id}')">Klassenübersicht drucken</button>
      <button onclick="printAlleSchueler('${cls.id}')">Alle Einzelblätter drucken</button>
    </div>
  `;
}

/* ---------- EINSTELLUNGEN ---------- */

function goSettings(screen, classId, subjectId){
  settingsView.screen = screen;
  if(classId !== undefined && classId !== null) settingsView.classId = classId;
  if(subjectId !== undefined && subjectId !== null) settingsView.subjectId = subjectId;
  render();
}

function renderSettings(){
  return settingsView.screen === "detail" ? renderSettingsDetail() : renderSettingsList();
}

function renderSettingsList(){
  const rows = allSubjectRows().map(({cls, sub}) => `
    <div class="row" onclick="goSettings('detail','${cls.id}','${sub.id}')">
      <div>
        <div class="name">${cls.name} &middot; ${sub.fach}</div>
        <div class="sub">${SUBJECT_TEMPLATES[sub.template] ? SUBJECT_TEMPLATES[sub.template].label : "eigene Einstellung"}</div>

    </div>`).join("");
  const tage = tageSeitSicherung();
  const standText = !state.settings.lastBackup
    ? "Noch keine Sicherung erstellt."
    : (tage === 0 ? "Heute schon gesichert."
      : (tage === 1 ? "Letzte Sicherung gestern." : "Letzte Sicherung vor " + tage + " Tagen."));
  const schriftChips = [["klein","Klein"],["normal","Normal"],["gross","Groß"]].map(([k,lbl]) => {

    : "Sobald du eine neue Fassung des Programms öffnest oder einen Stand ersetzt, legt die App hier von selbst eine Kopie an. Bisher gibt es noch keine.";

  const ordnerText = kannOrdner()
    ? (ordnerHandle ? "Sicherungsordner ist gemerkt. Die Sicherung landet automatisch dort." : "Noch kein fester Ordner gewählt. Bis dahin landet die Sicherung im Ordner für Downloads.")

    <div class="header" style="${headerStyle("einstellungen")}">
      <div class="title" style="${titleStyle("einstellungen")}">Einstellungen</div>
      <div class="sub">Bewertung je Fach, Sicherung und Geräte</div>

    <div class="label">FÄCHER</div>

    <div style="padding:0 16px;">
      <span class="field-label">Lehrkraft</span>
      <input type="text" id="lehrkraftInput" value="${esc(state.settings.lehrkraft)}" placeholder="z. B. Bernd Stuhlhofer" onchange="setSetting('lehrkraft', this.value)">
      <span class="field-label">Schuljahr</span>
      <input type="text" id="schuljahrInput" value="${esc(state.settings.schuljahr)}" placeholder="z. B. 2026/27" onchange="setSetting('schuljahr', this.value)">

    <div class="helptext">Erscheint im Kopf der Elternsprechtag-Blätter und in der Wochensicherung.</div>

    <div class="label" style="border-top:2px solid #000;">WOCHENSICHERUNG</div>
    <div class="helptext">${standText} Die App erinnert dich alle ${state.settings.intervallTage} Tage. Du bekommst eine Word-Datei zum Nachlesen und Bearbeiten und eine JSON-Datei zum Zurückspielen. ${ordnerText}</div>
    <div class="footer">
      <button onclick="sicherungErstellen()">Jetzt sichern</button>
      ${kannOrdner() ? '<button onclick="ordnerWaehlen()">Sicherungsordner wählen</button>' : ""}
    </div>
    <div class="slider-row">
      <div class="top"><span>Erinnerung alle</span><span id="intervallVal">${state.settings.intervallTage} Tage</span></div>

function setSetting(feld, wert){
  state.settings[feld] = String(wert || "").trim();
  save();
}

const SCHRIFT_SKALA = { klein: 0.9, normal: 1, gross: 1.2 };

function schriftAnwenden(){
  const wert = SCHRIFT_SKALA[state.settings.schrift] || 1;
  document.documentElement.style.setProperty("--skala", String(wert));
}

function setSchrift(wert){
  state.settings.schrift = (wert === "klein" || wert === "gross") ? wert : "normal";
  save();
  schriftAnwenden();
  render();
}

function setIntervall(wert){
  state.settings.intervallTage = parseInt(wert, 10) || 7;
  const el = document.getElementById("intervallVal");
  if(el) el.textContent = state.settings.intervallTage + " Tage";
  save();
}

function renderSettingsDetail(){
  const cls = getClass(settingsView.classId);
  const sub = getSubject(cls, settingsView.subjectId);
  if(!cls || !sub) return renderSettingsList();
  const prozent = isProzentMode(sub);
  const cats = activeCats(sub);

  const tplOpts = Object.keys(SUBJECT_TEMPLATES).map(k =>
    `<option value="${k}" ${sub.template === k ? "selected" : ""}>${SUBJECT_TEMPLATES[k].label}</option>`).join("");

  const stufeChips = [[1,"1. Klasse"],[2,"2. bis 4. Klasse"]].map(([k,lbl]) => {
    const active = (cls.stufe || 2) === k;
    const style = active ? "background:#000; border-color:#000; color:#fff;" : "background:#fff; border-color:#000; color:#000;";
    return `<div class="chip" style="${style}" onclick="setStufe(${k})">${lbl}</div>`;
  }).join("");

  const catToggles = allCatKeys(sub).map(k => {
    const c = catCol(sub, k);
    const on = cats.indexOf(k) !== -1;
    return `<label class="comp-check" style="padding:8px 0;">
      <input type="checkbox" ${on ? "checked" : ""} onchange="toggleCat('${k}', this.checked)">
      <span class="catdot" style="background:${c.fg};"></span> ${catLabel(sub,k)}
    </label>`;
  }).join("");

  const modeChips = [["multiplikator","Faktor je Note"],["prozent","Anteil in Prozent"]].map(([k,lbl]) => {
    const active = (prozent ? "prozent" : "multiplikator") === k;
    const style = active ? "background:#000; border-color:#000; color:#fff;" : "background:#fff; border-color:#000; color:#000;";
    return `<div class="chip" style="${style}" onclick="setWeightMode('${k}')">${lbl}</div>`;
  }).join("");

  const weightRows = cats.map(k => {
    const c = catCol(sub, k);
    const w = typeof sub.weights[k] === "number" ? sub.weights[k] : (prozent ? 10 : 1);
    return `
    <div class="slider-row">
      <div class="top"><span style="color:${c.fg};">&#9679; ${catLabel(sub,k)}</span><span id="val_${k}" style="color:${c.fg};">${prozent ? fmtPct(w) + " %" : fmtW(w)}</span></div>
      <input type="range" min="0" max="${prozent ? 100 : 3}" step="${prozent ? 2.5 : 0.5}" value="${w}" oninput="updateWeight('${k}', this.value)">
    </div>`;
  }).join("");

  const summe = cats.reduce((a,k) => a + (typeof sub.weights[k] === "number" ? sub.weights[k] : 0), 0);
  const summeBox = prozent
    ? `<div class="helptext" id="pctSumBox">Summe ${fmtPct(summe)} %. Die App rechnet die Anteile automatisch hoch, die Summe muss also nicht genau 100 sein.</div>`
    : "";

  /* Name und Farbe bleiben jederzeit änderbar. Die eingetragenen Noten hängen
     am Schlüssel der Beurteilung, nicht am Namen, und bleiben deshalb erhalten. */
  const customRows = customCats(sub).map(c => {
    const anzahl = sub.entries.filter(e => e.type === "note" && e.cat === c.key).length;
    const farben = CUSTOM_COLORS.map(f =>
      `<div class="swatch ${c.fg === f.fg ? "" : "off"}" style="background:${f.fg};" onclick="recolorCustomCat('${c.key}','${f.fg}')" title="Farbe ändern"></div>`).join("");
    return `<div style="padding:10px 16px; border-bottom:1px solid #000000;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="catdot" style="background:${c.fg};"></span>
        <input type="text" value="${esc(c.label)}" style="margin-bottom:0; flex:1;"
               onchange="renameCustomCat('${c.key}', this.value)">
        <button class="ghost" onclick="removeCustomCat('${c.key}')">entfernen</button>
      </div>
      <div class="swatches" style="padding-bottom:0;">${farben}</div>
      <div style="font-size:11px;">${anzahl} Note(n) eingetragen. Umbenennen und Umfärben ändert daran nichts.</div>
    </div>`;
  }).join("") || '<div class="helptext">Noch keine eigene Beurteilung in diesem Fach.</div>';

  if(!settingsView.newCatColor) settingsView.newCatColor = nextCustomColor(sub).fg;
  const swatches = CUSTOM_COLORS.map(c => {
    const aktiv = settingsView.newCatColor === c.fg;
    return `<div class="swatch ${aktiv ? "" : "off"}" style="background:${c.fg};" onclick="setNewCatColor('${c.fg}')" title="Farbe wählen"></div>`;
  }).join("");

  const compRows = sub.competencies.map((name, i) => `
    <div class="comp-item">
      <div class="txt" style="flex:1;">${name}</div>
      <button class="ghost" onclick="removeCompetency(${i})">entfernen</button>
    </div>`).join("");

  return `
    <div class="header" style="${headerStyle("einstellungen")}">
      <span class="back" style="${titleStyle("einstellungen")}" onclick="goSettings('list')">&lsaquo;</span>
      <span class="title" style="${titleStyle("einstellungen")}">${cls.name} &middot; ${sub.fach}</span>
      <div class="sub">${stufeLabel(cls)}</div>
    </div>

    <div class="label">BEWERTUNGSVORLAGE</div>
    <div style="padding:0 16px;">
      <select id="tplSelect">${tplOpts}</select>
      <button onclick="reapplyTemplate()">Vorlage anwenden</button>
    </div>
    <div class="helptext">Setzt Kategorien und Gewichtung neu. Eingetragene Noten bleiben erhalten.</div>

    <div class="label" style="border-top:2px solid #000;">NOTENSCHLÜSSEL</div>
    <div class="chips">${stufeChips}</div>
    <div class="helptext">Gilt für die ganze Klasse ${cls.name}. Ab der 2. Klasse zählt zusätzlich das Leistungsniveau, das du je Schüler:in einstellst.</div>

    <div class="label" style="border-top:2px solid #000;">KATEGORIEN</div>
    <div class="helptext">Nur angehakte Kategorien erscheinen bei der Notenvergabe.</div>
    <div style="padding:0 16px 8px;">${catToggles}</div>

    <div class="label" style="border-top:2px solid #000;">EIGENE BEURTEILUNGEN</div>
    <div class="helptext">Fehlt eine Beurteilungsart, legst du sie hier selbst an, zum Beispiel Referat, Portfolio, Lernzielkontrolle oder Mitschrift. Sie erscheint danach wie jede andere Kategorie bei der Notenvergabe und in der Gewichtung.</div>
    ${customRows}
    <form onsubmit="addCustomCat(event)" style="padding:12px 16px;">
      <input type="text" id="newCatInput" placeholder="Name der Beurteilung, z. B. Referat" style="margin-bottom:8px;">
      <span class="field-label">Farbe</span>
      <div class="swatches">${swatches}</div>
      <button type="submit">+ Beurteilung anlegen</button>
    </form>

    <div class="label" style="border-top:2px solid #000;">GEWICHTUNG</div>
    <div class="chips">${modeChips}</div>
    <div class="helptext">${prozent
      ? "Jede Kategorie hat einen Anteil an der Gesamtnote. Kategorien ohne Note fallen heraus, ihr Anteil verteilt sich auf die übrigen."
      : "Jede Note zählt mit ihrem Faktor. Der Wert hier ist die Vorbelegung, beim Eintragen kannst du jede Note einzeln anders gewichten."}</div>
    ${weightRows}
    ${summeBox}

    <div class="label" style="border-top:2px solid #000;">KOMPETENZEN</div>
    <div class="helptext">Diese Liste erscheint beim Kompetenz-Check als Checkliste.</div>
    ${compRows}
    <form onsubmit="addCompetency(event)" style="padding:12px 16px; display:flex; gap:8px;">
      <input type="text" id="newCompInput" placeholder="Neue Kompetenz" style="margin-bottom:0;">
      <button type="submit">+</button>
    </form>

    <div class="footer">
      <button class="red" onclick="deleteSubject()">Fach löschen</button>
      <button class="red" onclick="deleteClass()">Ganze Klasse löschen</button>
    </div>
  `;
}

function updateWeight(cat, value){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const v = parseFloat(value);
  sub.weights[cat] = v;
  sub.template = "eigen";
  const el = document.getElementById("val_" + cat);
  if(el) el.textContent = isProzentMode(sub) ? fmtPct(v) + " %" : fmtW(v);
  const box = document.getElementById("pctSumBox");
  if(box && isProzentMode(sub)){
    const summe = activeCats(sub).reduce((a,k) => a + (typeof sub.weights[k] === "number" ? sub.weights[k] : 0), 0);
    box.textContent = "Summe " + fmtPct(summe) + " %. Die App rechnet die Anteile automatisch hoch, die Summe muss also nicht genau 100 sein.";
  }
  save();
}

function setWeightMode(mode){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  if(sub.weightMode === mode) return;
  const hatNoten = sub.entries.some(e => e.type === "note");
  if(hatNoten && !confirm("Der Notenschnitt wird danach anders berechnet. Eingetragene Noten bleiben erhalten. Umstellen?")) return;
  sub.weightMode = mode;
  sub.template = "eigen";
  const cats = activeCats(sub);
  cats.forEach(k => {
    const w = sub.weights[k];
    if(mode === "prozent") sub.weights[k] = (typeof w === "number" && w > 3) ? w : Math.round((100 / cats.length) * 2) / 2;
    else sub.weights[k] = (typeof w === "number" && w <= 3) ? w : 1;
  });
  save();
  render();
}

function toggleCat(cat, on){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const liste = activeCats(sub);
  if(on){
    if(liste.indexOf(cat) === -1) liste.push(cat);
    if(typeof sub.weights[cat] !== "number") sub.weights[cat] = isProzentMode(sub) ? 10 : 1;
  } else {
    if(sub.entries.some(e => e.type === "note" && e.cat === cat)
       && !confirm("In " + catLabel(sub,cat) + " gibt es schon Noten. Beim Abschalten zählen sie nicht mehr im Notenschnitt. Trotzdem abschalten?")){
      render();
      return;
    }
    const i = liste.indexOf(cat);
    if(i !== -1) liste.splice(i, 1);
  }
  sub.cats = allCatKeys(sub).filter(k => liste.indexOf(k) !== -1);
  sub.template = "eigen";
  save();
  render();
}

function setStufe(stufe){
  const cls = getClass(settingsView.classId);
  cls.stufe = (stufe === 1) ? 1 : 2;
  save();
  render();
}

function reapplyTemplate(){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const sel = document.getElementById("tplSelect");
  if(!sel) return;
  const t = SUBJECT_TEMPLATES[sel.value];
  if(!t) return;
  if(!confirm("Vorlage " + t.label + " anwenden? Kategorien und Gewichtung werden überschrieben, eingetragene Noten bleiben erhalten.")) return;
  applyTemplate(sub, sel.value);
  save();
  render();
}

/* ---------- EIGENE BEURTEILUNGEN ---------- */

function setNewCatColor(fg){
  settingsView.newCatColor = fg;
  render();
}

function addCustomCat(ev){
  ev.preventDefault();
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const input = document.getElementById("newCatInput");
  const name = input.value.trim();
  if(!name) return;
  const schonDa = allCatKeys(sub).some(k => catLabel(sub, k).toLowerCase() === name.toLowerCase());
  if(schonDa){ alert("Eine Beurteilung mit dem Namen " + name + " gibt es in diesem Fach schon."); return; }
  const farbe = CUSTOM_COLORS.find(c => c.fg === settingsView.newCatColor) || nextCustomColor(sub);
  const key = "x_" + uid();
  if(!Array.isArray(sub.customCats)) sub.customCats = [];
  sub.customCats.push({ key: key, label: name, short: kurzName(name), fg: farbe.fg, bg: farbe.bg });
  const liste = activeCats(sub).concat([key]);
  sub.cats = allCatKeys(sub).filter(k => liste.indexOf(k) !== -1);
  if(typeof sub.weights[key] !== "number") sub.weights[key] = isProzentMode(sub) ? 10 : 1;
  sub.template = "eigen";
  settingsView.newCatColor = null;
  save();
  render();
}

/* Umbenennen und Umfärben lassen die Noten unangetastet, weil sie am
   Schlüssel hängen und nicht am angezeigten Namen. */
function renameCustomCat(key, name){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const c = findCustom(sub, key);
  const neu = String(name || "").trim();
  if(!c || !neu) { render(); return; }
  if(neu === c.label) return;
  const schonDa = allCatKeys(sub).some(k => k !== key && catLabel(sub, k).toLowerCase() === neu.toLowerCase());
  if(schonDa){ alert("Eine Beurteilung mit dem Namen " + neu + " gibt es in diesem Fach schon."); render(); return; }
  c.label = neu;
  c.short = kurzName(neu);
  save();
  render();
}

function recolorCustomCat(key, fg){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const c = findCustom(sub, key);
  const farbe = CUSTOM_COLORS.find(f => f.fg === fg);
  if(!c || !farbe) return;
  c.fg = farbe.fg;
  c.bg = farbe.bg;
  save();
  render();
}

function removeCustomCat(key){
  const sub = getSubject(getClass(settingsView.classId), settingsView.subjectId);
  const c = findCustom(sub, key);
  if(!c) return;
  const anzahl = sub.entries.filter(e => e.type === "note" && e.cat === key).length;
  const frage = anzahl
    ? c.label + " entfernen? Die " + anzahl + " Noten dieser Beurteilung werden mitgelöscht."
    : c.label + " entfernen?";
  if(!confirm(frage)) return;
  sub.customCats = customCats(sub).filter(x => x.key !== key);
  sub.entries = sub.entries.filter(e => e.cat !== key);
  sub.cats = (sub.cats || []).filter(k => k !== key);
  delete sub.weights[key];
  sub.template = "eigen";
  save();
  render();
}

function addCompetency(ev){
  ev.preventDefault();
  const input = document.getElementById("newCompInput");
  const name = input.value.trim();
  if(!name) return;
  getSubject(getClass(settingsView.classId), settingsView.subjectId).competencies.push(name);
  save();
  render();
}

function removeCompetency(i){
  getSubject(getClass(settingsView.classId), settingsView.subjectId).competencies.splice(i, 1);
  save();
  render();
}

function deleteSubject(){
  const cls = getClass(settingsView.classId);
  const sub = getSubject(cls, settingsView.subjectId);
  if(!confirm("Fach " + sub.fach + " in der Klasse " + cls.name + " löschen? Die Noten dieses Fachs gehen verloren, die Namen der Schüler:innen bleiben erhalten.")) return;
  cls.subjects = cls.subjects.filter(x => x.id !== sub.id);
  if(!cls.subjects.length && confirm("Die Klasse " + cls.name + " hat jetzt kein Fach mehr. Klasse auch löschen?")){
    state.classes = state.classes.filter(x => x.id !== cls.id);
  }
  save();
  goSettings("list");
}

function deleteClass(){
  const cls = getClass(settingsView.classId);
  if(!confirm("Klasse " + cls.name + " komplett löschen? Alle Fächer, Schüler:innen und Noten gehen verloren.")) return;
  state.classes = state.classes.filter(x => x.id !== cls.id);
  save();
  goSettings("list");
}
