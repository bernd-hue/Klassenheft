<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Klassenheft">
<meta name="description" content="Leistungsaufzeichnung für Lehrkräfte. Alle Daten bleiben lokal auf dem Gerät.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Klassenheft</title>
<style>
  :root{
    --black:#000000; --white:#ffffff;
    --red:#B3241C; --red-bg:#FBEAEA;
    --green:#3B6E2E; --green-bg:#EAF3E7;
    --blue:#185FA5; --blue-bg:#E6F1FB;
    --neutral:#4A4943; --neutral-bg:#F1EFE8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family: Arial, Helvetica, sans-serif;
    background:#ffffff;
    margin:0;
    color:#000000;
  }
  #frame{
    zoom: var(--skala, 1);
    width:100%;
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    min-height:100vh;
    background:#ffffff;
    display:flex;
    flex-direction:column;
  }
  @media (min-width:560px){
    body{ background:#e5e5e5; }
    #frame{
      margin:24px auto;
      min-height:calc(100vh - 48px);
      min-height:calc(100dvh - 48px);
      border:2px solid #000000;
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 4px 18px rgba(0,0,0,0.15);
    }
  }
  #content{flex:1;}
  .header{padding:14px 16px 10px; border-bottom:2px solid #000000;}
  .header .title{font-size:17px; font-weight:bold; display:flex; align-items:center; gap:8px;}
  .header .sub{font-size:12px; margin-top:2px; color:#000000;}
  .back{cursor:pointer; font-size:18px; font-weight:bold; user-select:none;}
  .label{font-size:11px; font-weight:bold; letter-spacing:0.03em; padding:8px 16px 4px;}
  .row{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid #000000; cursor:pointer;}
  .row:last-child{border-bottom:2px solid #000000;}
  .row .name{font-size:15px; font-weight:bold;}
  .row .sub{font-size:12px; margin-top:2px;}
  .chev{font-size:18px; font-weight:bold;}
  .footer{border-top:2px solid #000000; padding:10px 16px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  button{
    font-family:inherit; font-size:13px; font-weight:bold; cursor:pointer;
    background:#ffffff; border:1.5px solid #000000; border-radius:6px; padding:8px 14px; color:#000000;
  }
  button.green{background:var(--green-bg); border-color:var(--green); color:var(--green);}
  button.red{background:var(--red-bg); border-color:var(--red); color:var(--red);}
  button.ghost{border:none; background:none; text-decoration:underline; padding:4px; font-weight:normal;}
  button.ghost.small{font-size:16px; padding:2px 6px; text-decoration:none;}
  button:disabled{opacity:0.35; cursor:default;}
  input[type=text], input[type=number], select{
    font-family:inherit; font-size:14px; padding:8px; border:1.5px solid #000000; border-radius:6px; width:100%; margin-bottom:10px;
  }
  form{padding:16px;}
  .field-label{font-size:12px; font-weight:bold; margin-bottom:4px; display:block;}
  .avatar{
    width:56px; height:56px; border-radius:50%; border:2px solid #000000;
    display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:15px; flex-shrink:0;
  }
  .avatar.small{width:38px; height:38px; font-size:12px; border-width:1.5px;}
  .datum-klick{text-decoration:underline; cursor:pointer;}
  .vgl-tbl{width:100%; border-collapse:collapse; font-size:12px;}
  .vgl-tbl th{text-align:left; font-size:10px; text-transform:uppercase; border-bottom:1.5px solid #000; padding:4px 5px; white-space:nowrap;}
  .vgl-tbl td{border-bottom:1px solid #d8d6d0; padding:5px; vertical-align:top;}
  .vgl-zeile{cursor:pointer;}
  .vgl-zeile:hover td{background:#F4F3F0;}
  .stats{display:flex; border-bottom:2px solid #000000;}
  .stat{flex:1; padding:12px 8px; text-align:center;}
  .stat:first-child{border-right:1px solid #000000;}
  .stat .val{font-size:22px; font-weight:bold;}
  .stat .lbl{font-size:10px;}
  .val.red{color:var(--red);}
  .val.green{color:var(--green);}
  .entry{display:flex; align-items:center; gap:8px; padding:9px 16px; border-bottom:1px solid #000000; font-size:13px;}
  .entry .txt{flex:1;}
  .entry .date{font-size:11px;}
  .entry.positiv{color:var(--green);}
  .entry.negativ{color:var(--red);}
  .catdot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .badge{font-size:10px; border:1px solid #000000; border-radius:4px; padding:1px 6px; font-weight:bold; white-space:nowrap;}
  .grade{font-size:14px; font-weight:bold;}
  .slider-row{padding:12px 16px; border-bottom:1px solid #000000;}
  .slider-row .top{display:flex; justify-content:space-between; font-size:13px; font-weight:bold; margin-bottom:6px;}
  input[type=range]{width:100%;}
  .thumb{width:64px; height:64px; object-fit:cover; border:1.5px solid #000000; border-radius:6px;}
  .assign-bar{padding:10px 16px; border-bottom:2px solid #000000; background:#f5f5f5; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .helptext{font-size:11px; padding:8px 16px; color:#000000;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; padding:8px 16px 4px;}
  .chip{font-size:11px; font-weight:bold; border:1.5px solid #000000; border-radius:20px; padding:5px 11px; cursor:pointer; background:#fff;}
  .grade-row{display:flex; gap:6px; padding:8px 16px 4px;}
  .grade-tile{flex:1; min-width:0; aspect-ratio:1/1; border-radius:8px; border:1.5px solid #000000; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:bold; cursor:pointer;}
  .comp-item{display:flex; align-items:center; gap:8px; padding:8px 16px; border-bottom:1px solid #000000; font-size:13px;}
  .comp-check{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px;}
  #tabbar{display:flex; border-top:2px solid #000000; flex-shrink:0; position:sticky; bottom:0; background:#fff;}
  .tabbtn{flex:1; text-align:center; padding:10px 4px 8px; font-size:11px; font-weight:bold; cursor:pointer; border-top:3px solid transparent; color:#000000; background:#fff;}
  .tabbtn.active{border-top-width:3px;}

  /* Notenvergabe: Hauptweg groß, Feinheiten klein darunter */
  button.gross{width:100%; font-size:16px; padding:14px;}
  .feinbereich{padding:10px 16px; border-top:1px solid #000000;}
  .feinzeile{display:flex; align-items:center; gap:10px;}
  .feinlabel{font-size:12px; font-weight:bold; white-space:nowrap;}
  .stufe-zeichen{display:inline-block; min-width:38px; margin-right:10px; font-size:22px; letter-spacing:-1px;}
  .stufe-btn{
    border:2px solid #000000; border-radius:8px; padding:15px 12px; margin-bottom:8px;
    font-size:15px; font-weight:bold; text-align:center; cursor:pointer;
  }

  /* Schnellerfassung: eine Zeile je Schüler:in */
  .schnell-zeile{display:flex; align-items:center; gap:8px; padding:8px 16px; border-bottom:1px solid #000000;}
  .schnell-name{flex:1; min-width:0; font-size:13px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .schnell-tiles{display:flex; gap:4px; flex-shrink:0;}
  .schnell-tile{
    width:31px; height:31px; border-radius:6px; border:1.5px solid #000000;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:bold; cursor:pointer;
  }
  .schnell-stufen{display:flex; gap:4px; flex-shrink:0;}
  /* Die allgemeine Regel für Textfelder hat eine höhere Gewichtung, deshalb
     steht hier ausdrücklich input davor. */
  input.schnell-punkte{width:64px; margin-bottom:0; text-align:center; padding:6px; flex-shrink:0;}
  .schnell-ergebnis{width:26px; text-align:center; font-size:17px; font-weight:bold; flex-shrink:0;}
  .schnell-fehlt{flex-shrink:0;}
  .schnell-stufe{
    min-width:40px; height:34px; padding:0 8px; border-radius:6px; border:2px solid #000000;
    display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:bold;
    letter-spacing:-1px; cursor:pointer;
  }

  /* Diagramme */
  .chart{padding:8px 16px 12px; border-bottom:1px solid #000000;}
  .chart svg{display:block;}
  .chart-hinweis{font-size:11px; padding-top:4px;}

  /* Erinnerung an die Wochensicherung */
  .banner{padding:10px 16px; border-bottom:2px solid #000000; background:#FFF6DA; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .banner .txt{font-size:12px; flex:1; min-width:180px;}

  /* Foto-Avatar */
  .avatar{overflow:hidden; background:#ffffff;}
  .avatar img{width:100%; height:100%; object-fit:cover; display:block;}

  /* Eigene Beurteilungen: Farbwahl */
  .swatches{display:flex; gap:8px; flex-wrap:wrap; padding:4px 0 10px;}
  .swatch{width:26px; height:26px; border-radius:50%; border:2px solid #000000; cursor:pointer;}
  .swatch.off{border-color:#bbbbbb;}

  /* ---------- AUSDRUCK ELTERNSPRECHTAG ----------
     Am Bildschirm unsichtbar, beim Drucken wird nur dieser Bereich ausgegeben. */
  #printArea{display:none;}
  .pr-page{page-break-after:always;}
  .pr-page:last-child{page-break-after:auto;}
  .pr-head{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #000000; padding-bottom:4mm; margin-bottom:5mm;}
  .pr-h1{font-size:16pt; font-weight:bold; margin:0;}
  .pr-meta{font-size:9pt; text-align:right;}
  .pr-h2{font-size:11pt; font-weight:bold; margin:6mm 0 2mm; border-bottom:1px solid #000000; padding-bottom:1mm;}
  .pr-tbl{width:100%; border-collapse:collapse; font-size:10pt;}
  .pr-tbl th, .pr-tbl td{border:1px solid #000000; padding:2mm 2.5mm; text-align:left; vertical-align:top;}
  .pr-tbl th{background:#eeeeee; font-size:9pt;}
  .pr-kpi{display:flex; gap:0; border:1px solid #000000; margin-bottom:4mm;}
  .pr-kpi > div{flex:1; padding:3mm; text-align:center; border-right:1px solid #000000;}
  .pr-kpi > div:last-child{border-right:none;}
  .pr-kpi .v{font-size:16pt; font-weight:bold;}
  .pr-kpi .l{font-size:8pt;}
  .pr-chart{margin:2mm 0 3mm; page-break-inside:avoid;}
  .pr-chart svg{width:100%; height:auto; display:block;}
  .pr-chart .chart-hinweis{font-size:8pt; padding-top:1mm;}
  .pr-note{font-size:9pt; margin-top:4mm;}
  .pr-sign{margin-top:12mm; display:flex; gap:12mm; font-size:9pt;}
  .pr-sign div{flex:1; border-top:1px solid #000000; padding-top:1.5mm;}
  @media print{
    body{background:#ffffff !important; margin:0;}
    #frame{display:none !important;}
    #printArea{display:block !important;}
    @page{ size:A4; margin:16mm 14mm; }
  }
</style>
</head>
<body>
<div id="frame">
  <div id="content"></div>
  <div id="tabbar"></div>
</div>
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="importInput" accept="application/json" style="display:none">
<input type="file" id="avatarCamInput" accept="image/*" capture="user" style="display:none">
<input type="file" id="avatarLibInput" accept="image/*" style="display:none">
<div id="printArea"></div>

<script>
/* ==========================================================================
   KLASSENHEFT

   Diese eine Datei ist die ganze App. Es braucht nichts weiter, kein Internet
   und keine Installation.

   ---------------------------------------------------------------------
   HIER DARFST DU GEFAHRLOS SELBST ÄNDERN
   ---------------------------------------------------------------------
   Alles bis zur dicken Trennlinie weiter unten ist zum Anpassen gedacht:
   Farben, Bezeichnungen, Bewertungsvorlagen und Notenschlüssel. Eine
   ausführliche Anleitung dazu liegt als Bastelanleitung.md daneben.

   Drei Regeln, dann kann nichts passieren:
   1. Vorher in der App auf "Jetzt sichern" tippen.
   2. Immer nur den Text zwischen den Anführungszeichen ändern, nie die
      Schlüsselwörter davor. Aus  schularbeit: "Schularbeit"  darf
      schularbeit: "Schularbeit neu"  werden, aber niemals
      Schularbeit: "Schularbeit".
   3. Kommas und geschweifte Klammern stehen lassen.

   Die eingetragenen Noten hängen an den Schlüsselwörtern, nicht an den
   Bezeichnungen. Umbenennen kostet also keine Daten.

   ACHTUNG: Die Datei nach dem Ändern am selben Ort speichern, unter dem
   gleichen Namen. Dann findet die App ihre Daten wieder.
   ========================================================================== */

/* Die Fassung. Bitte hochzählen, wenn du etwas geändert hast. Die App legt
   dann beim nächsten Start von selbst eine Sicherheitskopie an. */
const APP_FASSUNG = "17.1";

/* Der Ort im Gerät, an dem die Daten liegen. Nicht ändern, sonst findet die
   App die schon eingetragenen Noten nicht mehr. */
const STORAGE_KEY = "klassenheft_daten_v1";

/* Drei Reiter: Team ist bewusst entfernt (kein Sync geplant, siehe Projektnotizen) */
const TAB_COLORS = {
  home:          { bg:"#EAF3E7", fg:"#3B6E2E", label:"Home" },
  statistik:     { bg:"#E6F1FB", fg:"#185FA5", label:"Statistik" },
  einstellungen: { bg:"#F1EFE8", fg:"#4A4943", label:"Einstellungen" }
};

const CAT_COLORS = {
  schularbeit:  { fg:"#185FA5", bg:"#E6F1FB" },
  diktat:       { fg:"#8A4B2A", bg:"#F6ECE5" },
  grammatik:    { fg:"#55606E", bg:"#ECEEF1" },
  rechtschreib: { fg:"#7A3E6B", bg:"#F5EAF2" },
  mitarbeit:    { fg:"#1B7A72", bg:"#E3F3F1" },
  kompetenz:    { fg:"#6B4FA0", bg:"#F0EBFA" },
  hausuebung:   { fg:"#9C7A2E", bg:"#F6EFDC" }
};

const CAT_LABELS = {
  schularbeit:  "Schularbeit",
  diktat:       "Diktat",
  grammatik:    "Grammatik-WH",
  rechtschreib: "Rechtschreib-Überprüfung",
  mitarbeit:    "Mitarbeit",
  kompetenz:    "Kompetenz-Check",
  hausuebung:   "Hausübung"
};

/* Kurzlabels für enge Stellen wie Chips und Filter */
const CAT_SHORT = {
  schularbeit:  "Schularbeit",
  diktat:       "Diktat",
  grammatik:    "Grammatik",
  rechtschreib: "Rechtschreibung",
  mitarbeit:    "Mitarbeit",
  kompetenz:    "Kompetenz",
  hausuebung:   "Hausübung"
};

const CAT_ORDER = ["schularbeit","diktat","grammatik","rechtschreib","mitarbeit","kompetenz","hausuebung"];

const DEFAULT_CATS = ["schularbeit","mitarbeit","kompetenz","hausuebung"];
const DEFAULT_WEIGHTS = { schularbeit: 2.0, mitarbeit: 0.5, kompetenz: 1.0, hausuebung: 0.3 };

/* ---------- BEWERTUNGSVORLAGEN JE FACH ----------
   mode "multiplikator": jede Note zählt mit ihrem eigenen Faktor
   mode "prozent":       jede Kategorie hat einen Anteil an der Gesamtnote. Innerhalb der
                         Kategorie wird zuerst gemittelt, dann mit dem Anteil verrechnet.
                         Kategorien ohne Note fallen heraus, ihr Anteil verteilt sich
                         proportional auf die übrigen.
   Die drei Deutsch-Varianten stammen aus der Vorlage der Deutschkollegin (Juli 2026). */
const SUBJECT_TEMPLATES = {
  allgemein: {
    label: "Allgemein",
    note:  "Faktor je Note. Schularbeit zählt doppelt, Mitarbeit halb.",
    mode:  "multiplikator",
    cats:  ["schularbeit","mitarbeit","kompetenz","hausuebung"],
    weights: { schularbeit:2.0, mitarbeit:0.5, kompetenz:1.0, hausuebung:0.3 }
  },
  deutsch1: {
    label: "Deutsch Variante 1",
    note:  "Schularbeiten 40 %, Hausübung + Mitarbeit + Diktate 60 % (je 20 %).",
    mode:  "prozent",
    cats:  ["schularbeit","diktat","mitarbeit","hausuebung"],
    weights: { schularbeit:40, diktat:20, mitarbeit:20, hausuebung:20 }
  },
  deutsch2: {
    label: "Deutsch Variante 2",
    note:  "Schularbeiten 50 %, Grammatik-WH 15 %, Rechtschreib-Überprüfung 15 %, Mitarbeit 10 %, Hausübung 10 %.",
    mode:  "prozent",
    cats:  ["schularbeit","grammatik","rechtschreib","mitarbeit","hausuebung"],
    weights: { schularbeit:50, grammatik:15, rechtschreib:15, mitarbeit:10, hausuebung:10 }
  },
  deutsch3: {
    label: "Deutsch Variante 3",
    note:  "Schularbeiten 50 %, Mitarbeit 50 % (davon 10 % Diktate, 45 % Hausübung, 45 % mündlich).",
    mode:  "prozent",
    cats:  ["schularbeit","diktat","mitarbeit","hausuebung"],
    weights: { schularbeit:50, diktat:5, mitarbeit:22.5, hausuebung:22.5 }
  },
  mathematik: {
    label: "Mathematik",
    note:  "Schularbeiten 60 %, Mitarbeit 25 %, Hausübung 15 %. Kompetenz-Check zusätzlich einschaltbar.",
    mode:  "prozent",
    cats:  ["schularbeit","mitarbeit","hausuebung"],
    weights: { schularbeit:60, mitarbeit:25, hausuebung:15 }
  },
  nebenfachTest: {
    label: "Nebenfach mit Tests",
    note:  "Für Geografie, Geschichte, Biologie, Physik und ähnliche Fächer: Test 50 %, Mitarbeit 35 %, Hausübung 15 %.",
    mode:  "prozent",
    cats:  ["x_test","mitarbeit","hausuebung"],
    weights: { x_test:50, mitarbeit:35, hausuebung:15 },
    customCats: [{ key:"x_test", label:"Test", short:"Test", fg:"#2E6B5A", bg:"#E4F0EC" }]
  },
  nebenfachPraktisch: {
    label: "Nebenfach praktisch",
    note:  "Für Sport, Musik, Werken und Bildnerische Erziehung: praktische Leistung 60 %, Mitarbeit und Einsatz 40 %.",
    mode:  "prozent",
    cats:  ["x_praktisch","mitarbeit"],
    weights: { x_praktisch:60, mitarbeit:40 },
    customCats: [{ key:"x_praktisch", label:"Praktische Leistung", short:"Praktisch", fg:"#A05A1F", bg:"#F7EDE2" }]
  }
};

/* Farbvorrat für selbst angelegte Beurteilungen. Bewusst dezent und deutlich
   unterscheidbar von den fest eingebauten Kategorien. */
const CUSTOM_COLORS = [
  { fg:"#2E6B5A", bg:"#E4F0EC" },
  { fg:"#A05A1F", bg:"#F7EDE2" },
  { fg:"#42528C", bg:"#EAEDF7" },
  { fg:"#8C3B3B", bg:"#F7EAEA" },
  { fg:"#5C6B21", bg:"#EFF2E1" },
  { fg:"#6E4A7A", bg:"#F1EAF5" }
];

/* ---------- NOTENSCHLÜSSEL (Vorlage Deutschkollegin) ----------
   Diktat: geübtes Diktat, Textlänge ca. 45 bis 65 Wörter, Bewertung nach Fehleranzahl.
   Die 1. Klasse kennt noch keine Leistungsniveaus, ab der 2. Klasse Standard AHS / Standard. */
const DIKTAT_KEYS = {
  stufe1:   [[1,1],[3,2],[5,3],[7,4],[Infinity,5]],
  ahs:      [[1,1],[3,2],[5,3],[7,4],[Infinity,5]],
  standard: [[5,1],[7,2],[9,3],[11,4],[Infinity,5]]
};

/* Prozentschlüssel für Schularbeit, Grammatik-WH, Rechtschreib-Überprüfung und
   Informationsfeststellung. Die 1. Klasse nutzt laut Vorlage denselben Schlüssel. */
const PROZENT_KEYS = {
  stufe1:   [[90,1],[77,2],[64,3],[25,4],[0,5]],
  ahs:      [[90,1],[77,2],[64,3],[51,4],[0,5]],
  standard: [[64,1],[51,2],[37,3],[25,4],[0,5]]
};

/* ---------- STUFEN STATT NOTEN ----------
   Hausübungen sind keine Leistungsfeststellung und dürfen nicht benotet
   werden. Sie werden deshalb in Stufen festgehalten und zählen nicht in den
   Notenschnitt. Die Stufen stehen von der besten zur schwächsten.
   Andere Kategorien lassen sich in den Einstellungen ebenso auf Stufen
   umstellen. */
const STUFEN_LISTEN = {
  hausuebung: ["sehr gut gemacht", "gut gemacht", "gemacht", "nicht gemacht"],
  mitarbeit:  ["sehr gute Mitarbeit", "gute Mitarbeit", "wenig Mitarbeit", "keine Mitarbeit"]
};

/* Kurzzeichen zu den Stufen, in derselben Reihenfolge. Sie stehen auf den
   schmalen Feldern der Schnellerfassung und im Verlauf vor dem Text. */
const STUFEN_ZEICHEN = {
  hausuebung: ["++", "+", "~", "\u2212"],
  mitarbeit:  ["++", "+", "~", "\u2212"]
};

/* Wert auf der Notenskala, falls eine Stufen-Kategorie ausnahmsweise doch in
   den Schnitt einfließen soll. Das ist je Fach einzeln einzuschalten und
   standardmäßig aus. */
const STUFEN_WERTE = {
  hausuebung: [1, 2, 3, 5],
  mitarbeit:  [1, 2, 3, 5]
};

/* Kategorien, die in einem neuen Fach von Anfang an in Stufen laufen.
   Hausübung und Mitarbeit dürfen nicht benotet werden. */
const STUFEN_VORGABE = ["hausuebung", "mitarbeit"];

/* Wird hochgezählt, sobald sich die Vorgabe oben ändert. Bestehende Fächer
   ziehen die neue Vorgabe dann genau einmal nach. */
const STUFEN_STAND = 5;

/* ---------- MITARBEIT ALS BONUS ----------
   Mitarbeit soll die Note verbessern, je mehr desto besser, darf aber nie
   über allem stehen. Deshalb ein dritter Weg neben "zählt nicht" und
   "zählt mit": die Einstufungen wirken als Bonus auf den Notenschnitt aus
   den übrigen Kategorien.

   Die Werte unten werden aufsummiert, nicht gemittelt. Wer öfter gut
   mitarbeitet, sammelt also mehr Bonus. Die Summe wird anschließend auf
   den Höchstwert je Fach begrenzt (Vorgabe eine halbe Note), damit die
   Mitarbeit den Schnitt nie beherrschen kann. Ohne Noten in den übrigen
   Kategorien gibt es überhaupt keinen Schnitt, also auch keinen Bonus.

   Minus verbessert die Note, Plus verschlechtert sie. */
const STUFEN_BONUS = {
  mitarbeit:  [-0.15, -0.05, 0.05, 0.15],
  hausuebung: [-0.10, -0.05, 0, 0.10]
};

/* Wie viel der Bonus insgesamt höchstens ausmachen darf, in Notenstufen */
const BONUS_MAX_VORGABE = 0.5;

/* Kategorien, die in einem neuen Fach von Anfang an als Bonus wirken */
const STUFEN_BONUS_VORGABE = ["mitarbeit"];

const NIVEAU_LABELS = { ahs: "Standard AHS", standard: "Standard" };

/* ==========================================================================
   AB HIER BEGINNT DIE TECHNIK
   Ab dieser Zeile besser nichts mehr ändern, außer du weißt, was du tust.
   ========================================================================== */

/* ---------- SEMESTER ----------
   Das Schuljahr wird in zwei Zeiträume getrennt. Jeder Eintrag merkt sich,
   in welches Semester er gehört. Ältere Einträge ohne diese Angabe werden
   aus ihrem Datum abgeleitet: September bis Jänner gehört zum ersten,
   Februar bis Juli zum zweiten Semester. */

const SEM_LABELS = { 1: "1. Semester", 2: "2. Semester", alle: "Ganzes Jahr" };

function semesterAusMonat(monat){
  return (monat >= 8 || monat <= 1) ? 1 : 2;
}

function semesterHeute(){ return semesterAusMonat(new Date().getMonth() + 1); }

/* Erwartet die in der App gespeicherte Schreibweise "12.09." */
function semesterAusDatum(text){
  const m = String(text || "").match(/^\s*\d{1,2}\.\s*(\d{1,2})\./);
  return m ? semesterAusMonat(parseInt(m[1], 10)) : 1;
}

function eintragSemester(e){
  if(e.sem === 1 || e.sem === 2) return e.sem;
  return semesterAusDatum(e.date);
}

function aktivesSemester(){
  const s = state && state.settings ? state.settings.semester : null;
  return (s === 1 || s === 2 || s === "alle") ? s : semesterHeute();
}

/* Semester, in das ein neuer Eintrag kommt. Steht die Ansicht auf
   "Ganzes Jahr", entscheidet das heutige Datum. */
function semesterFuerNeu(){
  const s = aktivesSemester();
  return (s === 1 || s === 2) ? s : semesterHeute();
}

function semesterLabel(){ return SEM_LABELS[aktivesSemester()]; }

/* Kategorien, für die es einen Notenschlüssel gibt */
const PROZENT_CATS = ["schularbeit","grammatik","rechtschreib"];

function stufeFromKlasse(name){
  const m = String(name || "").match(/\d/);
  return m && m[0] === "1" ? 1 : 2;
}

function schluesselKey(cls, student){
  if((cls.stufe || 2) === 1) return "stufe1";
  return (student && student.niveau === "standard") ? "standard" : "ahs";
}

function noteFromFehler(fehler, key){
  const tbl = DIKTAT_KEYS[key] || DIKTAT_KEYS.ahs;
  for(let i = 0; i < tbl.length; i++){ if(fehler <= tbl[i][0]) return tbl[i][1]; }
  return 5;
}

function noteFromProzent(prozent, key){
  const tbl = PROZENT_KEYS[key] || PROZENT_KEYS.ahs;
  for(let i = 0; i < tbl.length; i++){ if(prozent >= tbl[i][0]) return tbl[i][1]; }
  return 5;
}

function schluesselText(kind, key){
  if(kind === "fehler"){
    const t = DIKTAT_KEYS[key];
    return "0 bis " + t[0][0] + " = 1 &middot; bis " + t[1][0] + " = 2 &middot; bis " + t[2][0] + " = 3 &middot; bis " + t[3][0] + " = 4 &middot; ab " + (t[3][0]+1) + " = 5";
  }
  const t = PROZENT_KEYS[key];
  return "ab " + t[0][0] + " % = 1 &middot; ab " + t[1][0] + " % = 2 &middot; ab " + t[2][0] + " % = 3 &middot; ab " + t[3][0] + " % = 4 &middot; darunter = 5";
}

/* ---------- SCHLÜSSEL ZUM NACHLESEN ----------
   Der Schlüssel rechnet still im Hintergrund. Damit man ihn nachprüfen kann,
   ohne den Code zu lesen, steht er in den Einstellungen als Tabelle: welcher
   Prozentbereich welche Note ergibt, für beide Leistungsniveaus nebeneinander. */

/* Von-bis je Note aus der Schwellenliste. Die Obergrenze ist die nächsthöhere
   Schwelle minus eins, damit keine Lücke und keine Überschneidung entsteht. */
function prozentBereich(key, note){
  const t = PROZENT_KEYS[key] || PROZENT_KEYS.ahs;
  const i = note - 1;
  if(i < 0 || i >= t.length) return "";
  const unten = t[i][0];
  if(i === t.length - 1) return "unter " + t[i-1][0] + " %";
  const oben = i === 0 ? 100 : t[i-1][0] - 1;
  return unten + " bis " + oben + " %";
}

function fehlerBereich(key, note){
  const t = DIKTAT_KEYS[key] || DIKTAT_KEYS.ahs;
  const i = note - 1;
  if(i < 0 || i >= t.length) return "";
  if(i === t.length - 1) return "ab " + (t[i-1][0] + 1);
  const unten = i === 0 ? 0 : t[i-1][0] + 1;
  const oben = t[i][0];
  return unten === oben ? String(unten) : unten + " bis " + oben;
}

/* Welche Niveaus in dieser Klasse überhaupt vorkommen können. Die 1. Klasse
   kennt noch keine, dort gibt es nur eine Spalte. */
function schluesselSpalten(cls){
  if((cls.stufe || 2) === 1) return [["stufe1", "1. Klasse"]];
  return [["ahs", NIVEAU_LABELS.ahs], ["standard", NIVEAU_LABELS.standard]];
}

/* Eine Tabelle, Note für Note. art ist "prozent" oder "fehler". */
function schluesselTabelle(cls, art){
  const spalten = schluesselSpalten(cls);
  const einheit = art === "fehler" ? " (Fehler)" : "";
  const kopf = spalten.map(([, lbl]) => `<th>${esc(lbl)}${einheit}</th>`).join("");
  const zeilen = [1,2,3,4,5].map(note => {
    const g = gradeColor(note);
    const felder = spalten.map(([key]) =>
      `<td>${art === "fehler" ? fehlerBereich(key, note) : prozentBereich(key, note)}</td>`).join("");
    return `<tr>
      <td style="font-weight:bold; color:${g.fg}; width:26px;">${note}</td>
      <td style="font-size:11px;">${esc(notenWort(note))}</td>
      ${felder}
    </tr>`;
  }).join("");
  return `<table class="vgl-tbl"><tr><th></th><th>Note</th>${kopf}</tr>${zeilen}</table>`;
}

/* Der ganze Abschnitt zum Nachlesen, wie er in den Einstellungen steht.
   Zeigt nur die Schlüssel, die in diesem Fach tatsächlich zum Tragen kommen,
   damit in Mathematik nicht die Diktattabelle mitläuft. */
function schluesselBereich(cls, sub){
  const cats = activeCats(sub);
  const mitProzent = cats.filter(k => PROZENT_CATS.indexOf(k) !== -1 && !istStufenCat(sub, k));
  const mitDiktat  = cats.indexOf("diktat") !== -1 && !istStufenCat(sub, "diktat");
  const eigene = cats.filter(k => isCustomCat(k) && !istStufenCat(sub, k));

  const teile = [];

  if(mitProzent.length){
    teile.push(`
      <div class="helptext" style="padding-bottom:4px;"><b>Nach Prozent:</b> ${esc(mitProzent.map(k => catLabel(sub, k)).join(", "))}</div>
      <div style="padding:0 16px 10px;">${schluesselTabelle(cls, "prozent")}</div>`);
  }

  if(mitDiktat){
    teile.push(`
      <div class="helptext" style="padding-bottom:4px;"><b>Nach Fehleranzahl:</b> ${esc(catLabel(sub, "diktat"))}, geübtes Diktat, Textlänge laut Vorlage etwa 45 bis 65 Wörter</div>
      <div style="padding:0 16px 10px;">${schluesselTabelle(cls, "fehler")}</div>`);
  }

  if(!teile.length){
    return `<div class="helptext">In diesem Fach ist gerade keine Kategorie eingeschaltet, die über einen Schlüssel gerechnet wird. Sobald du eine Schularbeit, eine Grammatik- oder Rechtschreibüberprüfung oder ein Diktat einschaltest, steht der Schlüssel hier.</div>`;
  }

  const zusatz = eigene.length
    ? `<br>Deine eigenen Beurteilungen (${esc(eigene.map(k => catLabel(sub, k)).join(", "))}) haben keinen Schlüssel. Dort tippst du die Note direkt an oder gibst Punkte ein, dann rechnet die App mit dem Prozentschlüssel oben.`
    : "";

  return teile.join("") + `
    <div class="helptext" style="padding-top:0;">
      Diese Tabellen sind zum Nachlesen. Die App rechnet genau danach, wenn du beim Eintragen Prozent, Punkte oder Fehler eingibst.
      Eine Note direkt antippen kannst du immer, dann greift kein Schlüssel.${zusatz}
      <br><br>Grundlage ist die Vorlage der Deutschkollegin. ${(cls.stufe || 2) === 1
        ? "Die 1. Klasse kennt noch keine Leistungsniveaus, deshalb gibt es nur eine Spalte."
        : "Ab der 2. Klasse entscheidet das Leistungsniveau je Schüler:in, das du in der Schüleransicht einstellst."}
    </div>`;
}

function stufeLabel(cls){ return (cls.stufe || 2) === 1 ? "1. Klasse" : "2. bis 4. Klasse"; }

/* ---------- KATEGORIEN ----------
   Sieben fest eingebaute Kategorien plus beliebig viele, die die Lehrkraft
   selbst anlegt. Selbst angelegte hängen am Fach (sub.customCats) und haben
   Schlüssel, die mit "x_" beginnen. */

function customCats(sub){ return (sub && Array.isArray(sub.customCats)) ? sub.customCats : []; }

function isCustomCat(key){ return String(key || "").indexOf("x_") === 0; }

function allCatKeys(sub){ return CAT_ORDER.concat(customCats(sub).map(c => c.key)); }

function findCustom(sub, key){ return customCats(sub).find(c => c.key === key); }

function catLabel(sub, key){
  const c = findCustom(sub, key);
  return c ? c.label : (CAT_LABELS[key] || key);
}

function catShort(sub, key){
  const c = findCustom(sub, key);
  return c ? (c.short || c.label) : (CAT_SHORT[key] || key);
}

function catCol(sub, key){
  const c = findCustom(sub, key);
  if(c) return { fg: c.fg, bg: c.bg };
  return CAT_COLORS[key] || { fg:"#000000", bg:"#ffffff" };
}

/* Bezeichnung einer Note. Sie hängt an der Kategorie, damit eine umbenannte
   eigene Beurteilung überall mitwandert. Für Altbestände, deren Kategorie es
   nicht mehr gibt, greift der beim Eintragen gespeicherte Text. */
/* Anklickbares Datum. Sieht überall gleich aus und führt zum Ausbessern. */
/* Freies Feld für den Inhalt einer Leistung, etwa "Bruchrechnung" oder
   "Gleichungen". Immer freiwillig: leer lassen ist der Normalfall, und dann
   steht überall nur die Beurteilungsart wie bisher. */
/* Welche Arbeit ist das? Vier Felder, wie es dem Schuljahr entspricht,
   plus die Möglichkeit einer fünften, falls doch mehr geschrieben wird.
   Ohne diese Wahl würde die App nach dem Datum gruppieren, und dann wären
   zwei am selben Tag nachgetragene Schularbeiten eine einzige. */
const ARBEITEN_MAX = 6;

function arbeitWahl(sub, cat, gewaehlt, aufruf){
  const hoechste = hoechsteArbeitNr(sub, cat);
  const zeigen = Math.max(4, Math.min(ARBEITEN_MAX, hoechste + 1));
  const felder = [];
  for(let n = 1; n <= zeigen; n++){
    const schon = arbeiten(sub, cat).find(a => a.nr === n);
    const aktiv = gewaehlt === n;
    const stil = aktiv
      ? "background:#000; border-color:#000; color:#fff;"
      : (schon ? "background:#F1EFE8; border-color:#000; color:#000;"
               : "background:#fff; border-color:#999; color:#4A4943;");
    felder.push(`<div class="chip" style="${stil}" onclick="${aufruf}(${n})"
      title="${schon ? "bereits " + schon.anzahl + " Eintr\u00e4ge" : "noch leer"}">${n}.${
      schon ? ' <span style="font-size:10px;">(' + schon.anzahl + ")</span>" : ""}</div>`);
  }
  return `<div style="padding:8px 16px 0;">
    <span class="field-label">Welche ${esc(catLabel(sub, cat))}?</span>
    <div class="chips" style="padding:6px 0 2px;">${felder.join("")}</div>
    <div class="helptext" style="padding:0 0 4px;">Die Nummer entscheidet, was zusammengehört, nicht das Datum. So kannst du die 1. und die 2. am selben Nachmittag nachtragen und trotzdem getrennt auswerten. In Klammern steht, wie viele Einträge es dort schon gibt.</div>
  </div>`;
}

/* Für welche Kategorien lohnt die Nummerierung? Für alles, was als eigene
   Arbeit geschrieben wird, also alle benoteten Kategorien. Nicht für
   Einstufungen wie Mitarbeit, die laufend anfallen. */
function nummeriert(sub, cat){
  return !istStufenCat(sub, cat) && cat !== "kompetenz";
}

function themaFeld(id, wert, platzhalter){
  return `<div style="padding:0 16px 8px;">
    <span class="field-label">Thema, freiwillig</span>
    <input type="text" id="${id}" value="${esc(wert || "")}" placeholder="${esc(platzhalter)}"
           style="margin-bottom:0;" autocomplete="off">
  </div>`;
}

function themaVorschlag(cat){
  if(cat === "kompetenz") return "z. B. Bruchrechnung";
  if(cat === "hausuebung") return "z. B. Seite 42, Aufgabe 3";
  if(cat === "diktat") return "z. B. Wörter mit ie";
  return "z. B. Gleichungen";
}

function themaLesen(id){
  const el = document.getElementById(id);
  return el && el.value.trim() ? el.value.trim() : null;
}

function datumFeld(e){
  return '<span class="date datum-klick" title="Datum ändern" onclick="datumAendern(\'' + e.id + '\')">' +
         esc(e.date || "\u2013") + "</span>";
}

/* Bezeichnung eines Eintrags, also die Beurteilungsart, ergänzt um das Thema,
   falls eines eingetragen wurde. */
function eintragTitel(sub, e){
  const art = noteBezeichnung(sub, e);
  return e.thema ? art + ": " + e.thema : art;
}

function noteBezeichnung(sub, n){
  if(findCustom(sub, n.cat) || CAT_LABELS[n.cat]) return catLabel(sub, n.cat);
  return n.label || "Note";
}

function activeCats(sub){
  const list = (sub && Array.isArray(sub.cats) && sub.cats.length) ? sub.cats : DEFAULT_CATS;
  return allCatKeys(sub).filter(k => list.indexOf(k) !== -1);
}

/* ---------- STUFEN ----------
   Eine Kategorie läuft entweder in Noten oder in Stufen. Stufen zählen
   nicht in den Notenschnitt, werden aber vollständig festgehalten. */

function istStufenCat(sub, cat){
  return !!(sub && Array.isArray(sub.stufenCats) && sub.stufenCats.indexOf(cat) !== -1);
}

function stufenListe(sub, cat){
  if(sub && sub.stufenTexte && Array.isArray(sub.stufenTexte[cat]) && sub.stufenTexte[cat].length) return sub.stufenTexte[cat];
  return STUFEN_LISTEN[cat] || STUFEN_LISTEN.hausuebung;
}

/* Kurzform für die schmalen Felder der Schnellerfassung.
   "sehr gut gemacht" wird zu "sehr gut", "nicht gemacht" zu "nicht". */
function stufenKurz(text){
  const t = String(text || "").trim();
  const woerter = t.split(/\s+/);
  if(woerter.length > 1 && woerter[woerter.length - 1].toLowerCase() === "gemacht"){
    return woerter.slice(0, -1).join(" ");
  }
  return t.length > 12 ? t.slice(0, 11) + "." : t;
}

function stufenText(sub, e){
  const liste = stufenListe(sub, e.cat);
  return liste[e.stufe] || e.label || "Stufe";
}

/* Fällt die Kategorie nicht unter STUFEN_ZEICHEN oder hat sie nach dem
   Umbenennen eine andere Anzahl an Stufen, kommen die Zeichen aus diesem
   Muster. Sonst stünden dort nackte Ziffern, die wie Noten aussehen. */
const STUFEN_ZEICHEN_MUSTER = {
  2: ["+", "\u2212"],
  3: ["+", "~", "\u2212"],
  4: ["++", "+", "~", "\u2212"],
  5: ["++", "+", "~", "\u2212", "\u2212\u2212"]
};

/* ---------- FARBEN DER STUFENFELDER ----------
   gradeColor kennt nur drei Zustände, damit lassen sich vier Stufen nicht
   auseinanderhalten: die beiden besten sahen gleich grün aus. Deshalb eine
   eigene Skala von der besten zur schwächsten Stufe, fünf Haltepunkte, aus
   denen je nach Anzahl gleichmäßig ausgewählt wird.

   Die Farbe ist bewusst nur die Verstärkung. Getragen wird der Unterschied
   vom Zeichen (++ + ~ −) und vom ausgeschriebenen Text daneben, damit die
   Felder auch bei Farbenblindheit und im Schwarz-Weiß-Ausdruck eindeutig
   bleiben. */
const STUFEN_FARBEN = [
  { fg:"#2A6B2E", bg:"#E4F1E2" },   /* beste Stufe, kräftiges Grün */
  { fg:"#4E6B12", bg:"#EFF5DF" },   /* gut, Grüngelb */
  { fg:"#7A6B10", bg:"#F5F1DC" },   /* Mitte, Oliv */
  { fg:"#855A0C", bg:"#F9F0DD" },   /* schwach, Bernstein */
  { fg:"#B3241C", bg:"#FBEAEA" }    /* schwächste Stufe, Rot */
];

function stufenFarbe(index, anzahl){
  if(anzahl < 2) return STUFEN_FARBEN[2];
  const anteil = index / (anzahl - 1);
  const stelle = Math.round(anteil * (STUFEN_FARBEN.length - 1));
  return STUFEN_FARBEN[Math.min(STUFEN_FARBEN.length - 1, Math.max(0, stelle))];
}

function stufenZeichen(cat, index, anzahl){
  const liste = STUFEN_ZEICHEN[cat];
  if(liste && (!anzahl || liste.length === anzahl) && liste[index]) return liste[index];
  const muster = STUFEN_ZEICHEN_MUSTER[anzahl || (liste ? liste.length : 0)];
  if(muster && muster[index]) return muster[index];
  return String(index + 1);
}

/* Zählt diese Stufen-Kategorie mit einem eigenen Anteil in den Notenschnitt? */
function stufeZaehlt(sub, cat){
  return !!(sub && Array.isArray(sub.stufenZaehlt) && sub.stufenZaehlt.indexOf(cat) !== -1);
}

/* Wirkt diese Stufen-Kategorie als Bonus auf den Notenschnitt? */
function istBonusCat(sub, cat){
  return !!(sub && Array.isArray(sub.stufenBonus) && sub.stufenBonus.indexOf(cat) !== -1);
}

function bonusMax(sub){
  return (sub && typeof sub.bonusMax === "number") ? sub.bonusMax : BONUS_MAX_VORGABE;
}

/* Bonuswert einer einzelnen Stufe. Minus verbessert. */
function bonusWert(sub, cat, index){
  const eigene = sub && sub.bonusWerte && Array.isArray(sub.bonusWerte[cat]) ? sub.bonusWerte[cat] : null;
  const liste = eigene || STUFEN_BONUS[cat];
  if(liste && typeof liste[index] === "number") return liste[index];
  /* Ohne eigene Vorgabe: die beste Stufe verbessert, die schwächste verschlechtert */
  const anzahl = stufenListe(sub, cat).length;
  if(anzahl < 2) return 0;
  return -0.15 + (0.3 * index) / (anzahl - 1);
}

/* Summe aller Boni einer Person, aufgeteilt nach Kategorie und insgesamt
   auf den Höchstwert des Fachs begrenzt. */
function bonusSumme(sub, studentId, sem){
  const cats = activeCats(sub).filter(k => istBonusCat(sub, k));
  if(!cats.length) return { wert: 0, roh: 0, gedeckelt: false, teile: [] };
  const alle = entriesOf(sub, studentId, sem).filter(e => e.type === "stufe");
  const teile = [];
  let roh = 0;
  cats.forEach(cat => {
    const drin = alle.filter(e => e.cat === cat);
    if(!drin.length) return;
    let summe = 0;
    drin.forEach(e => { summe += bonusWert(sub, cat, e.stufe); });
    roh += summe;
    teile.push({ cat: cat, label: catLabel(sub, cat), anzahl: drin.length, wert: summe });
  });
  const grenze = bonusMax(sub);
  const wert = Math.max(-grenze, Math.min(grenze, roh));
  return { wert: wert, roh: roh, gedeckelt: Math.abs(roh) > grenze + 0.0001, teile: teile };
}

/* Wie der Bonus im Text aussieht: minus verbessert, plus verschlechtert */
/* Kurzform für das Merkzeichen neben einer Bonus-Kategorie */
function bonusTeilText(bonus, cat){
  const teil = bonus.teile.find(t => t.cat === cat);
  if(!teil || Math.abs(teil.wert) < 0.005) return "0";
  return (teil.wert < 0 ? "\u2212" : "+") + fmtB(Math.abs(teil.wert));
}

function bonusText(wert){
  if(Math.abs(wert) < 0.005) return "keine Auswirkung";
  const betrag = fmtB(Math.abs(wert));
  return (wert < 0 ? "verbessert um " : "verschlechtert um ") + betrag;
}

/* Wert einer Stufe auf der Notenskala */
function stufenWert(sub, e){
  const eigene = sub && sub.stufenWerte && Array.isArray(sub.stufenWerte[e.cat]) ? sub.stufenWerte[e.cat] : null;
  const liste = eigene || STUFEN_WERTE[e.cat];
  if(liste && typeof liste[e.stufe] === "number") return liste[e.stufe];
  const anzahl = stufenListe(sub, e.cat).length;
  return anzahl > 1 ? 1 + (4 * e.stufe) / (anzahl - 1) : 3;
}

/* Kategorien, die tatsächlich in den Notenschnitt eingehen. Das sind alle
   Notenkategorien und zusätzlich jene Stufen-Kategorien, für die die
   Lehrkraft das ausdrücklich eingeschaltet hat. */
function notenCats(sub){
  return activeCats(sub).filter(k => !istStufenCat(sub, k) || stufeZaehlt(sub, k));
}

/* Alle Stufeneinträge einer Person */
function stufenOf(sub, studentId, sem){
  return entriesOf(sub, studentId, sem).filter(e => e.type === "stufe");
}

function isProzentMode(sub){ return sub && sub.weightMode === "prozent"; }

/* Eigene Beurteilungen bekommen den Prozent- und Punkteschlüssel automatisch,
   damit ein Test oder ein Referat direkt über Punkte eingegeben werden kann.
   Die Notenkacheln bleiben daneben immer bedienbar. */
function hasSchluessel(cat){ return cat === "diktat" || PROZENT_CATS.indexOf(cat) !== -1 || isCustomCat(cat); }

/* Kurzform für die schmalen Auswahlchips. Erst sehr lange Namen werden
   gekürzt, damit gebräuchliche Bezeichnungen wie Lernzielkontrolle
   vollständig lesbar bleiben. */
function kurzName(name){
  const t = String(name || "").trim();
  return t.length > 20 ? t.slice(0, 19) + "." : t;
}

function nextCustomColor(sub){
  const belegt = customCats(sub).map(c => c.fg);
  return CUSTOM_COLORS.find(c => belegt.indexOf(c.fg) === -1) || CUSTOM_COLORS[belegt.length % CUSTOM_COLORS.length];
}

function defaultCompetencies(fach){
  const f = (fach || "").toLowerCase();
  if(f.indexOf("mathe") !== -1) return ["Grundrechnungsarten","Bruchrechnung","Prozentrechnung","Textaufgaben","Geometrie"];
  if(f.indexOf("deutsch") !== -1) return ["Rechtschreibung","Grammatik","Leseverstehen","Textproduktion"];
  if(f.indexOf("englisch") !== -1) return ["Vocabulary","Grammar","Listening","Speaking"];
  if(f.indexOf("geografie") !== -1 || f.indexOf("geographie") !== -1) return ["Karten lesen","Klima und Vegetation","Wirtschaft","Österreich und Europa"];
  if(f.indexOf("geschichte") !== -1) return ["Quellen deuten","Zeitleiste","Ursache und Wirkung","Politische Bildung"];
  if(f.indexOf("sport") !== -1 || f.indexOf("bewegung") !== -1 || f.indexOf("turnen") !== -1) return ["Ausdauer","Koordination","Ballspiele","Turnen","Fairness im Team"];
  return ["Kompetenz A","Kompetenz B","Kompetenz C"];
}

/* Vorschlag der Bewertungsvorlage anhand des eingetippten Fachnamens.
   Immer nur ein Vorschlag, die Lehrkraft kann jede Vorlage wählen. */
function templateKeyForFach(fach){
  const f = String(fach || "").toLowerCase();
  if(f.indexOf("deutsch") !== -1) return "deutsch3";
  if(f.indexOf("mathe") !== -1) return "mathematik";
  if(/sport|bewegung|turnen|musik|werken|technisch|bildner|zeichn|kochen|ernährung|ernaehrung/.test(f)) return "nebenfachPraktisch";
  if(/geografie|geographie|geschichte|biologie|physik|chemie|politische|gw|informatik|religion/.test(f)) return "nebenfachTest";
  return "allgemein";
}

function applyTemplate(sub, key){
  const t = SUBJECT_TEMPLATES[key] || SUBJECT_TEMPLATES.allgemein;
  sub.template = key;
  sub.weightMode = t.mode;
  sub.cats = t.cats.slice();
  sub.weights = Object.assign({}, t.weights);
  /* Eigene Kategorien der Vorlage ergänzen, bereits vorhandene bleiben erhalten,
     damit schon eingetragene Noten ihre Kategorie behalten. */
  if(!Array.isArray(sub.customCats)) sub.customCats = [];
  (t.customCats || []).forEach(c => {
    if(!sub.customCats.some(x => x.key === c.key)) sub.customCats.push(Object.assign({}, c));
  });
  return sub;
}

/* ---------- PERSISTENZ UND MIGRATION ----------
   Datenmodell: eine Klasse hält die Namen genau einmal, die Fächer hängen daran.
   Ältere Datenstände (Namen je Fach doppelt) werden beim Laden zusammengeführt. */

function normaliseClass(cls){
  if(!cls.id) cls.id = uid();
  if(!cls.name) cls.name = "Klasse";
  if(cls.stufe !== 1 && cls.stufe !== 2) cls.stufe = stufeFromKlasse(cls.name);
  if(!Array.isArray(cls.students)) cls.students = [];
  cls.students.forEach(s => {
    if(!s.id) s.id = uid();
    if(s.niveau !== "standard" && s.niveau !== "ahs") s.niveau = "ahs";
    if(typeof s.photo !== "string") s.photo = null;
    if(typeof s.updatedAt !== "number") s.updatedAt = 0;
  });
  if(!Array.isArray(cls.subjects)) cls.subjects = [];
  cls.subjects.forEach(sub => {
    if(!sub.id) sub.id = uid();
    if(!sub.fach) sub.fach = "Fach";
    if(!sub.template) sub.template = "allgemein";
    if(sub.weightMode !== "prozent") sub.weightMode = "multiplikator";
    if(!Array.isArray(sub.customCats)) sub.customCats = [];
    sub.customCats.forEach(c => {
      if(!c.key) c.key = "x_" + uid();
      if(!c.label) c.label = "Eigene Beurteilung";
      if(!c.short) c.short = c.label;
      if(!c.fg) c.fg = CUSTOM_COLORS[0].fg;
      if(!c.bg) c.bg = CUSTOM_COLORS[0].bg;
    });
    if(!Array.isArray(sub.cats) || !sub.cats.length) sub.cats = DEFAULT_CATS.slice();
    if(!sub.weights || typeof sub.weights !== "object") sub.weights = Object.assign({}, DEFAULT_WEIGHTS);
    activeCats(sub).forEach(k => {
      if(typeof sub.weights[k] !== "number") sub.weights[k] = isProzentMode(sub) ? 10 : 1;
    });
    if(!Array.isArray(sub.competencies)) sub.competencies = defaultCompetencies(sub.fach);
    if(!Array.isArray(sub.entries)) sub.entries = [];
    /* Stufen-Kategorien festlegen. Vorgabe ist die Hausübung, weil sie nicht
       benotet werden darf. Liegen in einem Fach schon Hausübungsnoten aus
       einer früheren Fassung, bleibt es dort bei Noten, damit sich kein
       bereits angezeigter Notenschnitt rückwirkend ändert. */
    if(!Array.isArray(sub.stufenCats)) sub.stufenCats = [];
    /* Neue Vorgaben werden genau einmal nachgezogen. Kategorien, in denen
       schon Noten liegen, bleiben unangetastet, damit sich kein bereits
       angezeigter Notenschnitt rückwirkend ändert. */
    if(sub.stufenStand !== STUFEN_STAND){
      STUFEN_VORGABE.forEach(k => {
        if(sub.stufenCats.indexOf(k) !== -1) return;
        if(sub.entries.some(e => e.type === "note" && e.cat === k)) return;
        sub.stufenCats.push(k);
      });
      /* Mitarbeit wirkt ab Stand 3 als Bonus, aber nur dort, wo sie bisher
         gar nichts bewirkt hat. Wer sie schon ausdrücklich auf "zählt mit"
         gestellt hat, behält das. */
      if(!Array.isArray(sub.stufenBonus)) sub.stufenBonus = [];
      if(!Array.isArray(sub.stufenZaehlt)) sub.stufenZaehlt = [];
      STUFEN_BONUS_VORGABE.forEach(k => {
        if(sub.stufenCats.indexOf(k) === -1) return;
        if(sub.stufenZaehlt.indexOf(k) !== -1) return;
        if(sub.stufenBonus.indexOf(k) !== -1) return;
        sub.stufenBonus.push(k);
      });
      /* Ab Stand 4 hat die Mitarbeit vier Stufen statt drei, neu ist "wenig
         Mitarbeit" an dritter Stelle. Bestehende Einträge zeigen auf eine
         Position, nicht auf einen Text. Aus der alten "keine Mitarbeit"
         (Position 2) würde sonst stillschweigend "wenig Mitarbeit". Deshalb
         rückt die letzte Stufe eine Position weiter. Nur dort, wo die Texte
         nicht von Hand geändert wurden, sonst wäre die Zuordnung geraten. */
      if((sub.stufenStand || 0) < 4 && !(sub.stufenTexte && Array.isArray(sub.stufenTexte.mitarbeit))){
        sub.entries.forEach(e => {
          if(e.type === "stufe" && e.cat === "mitarbeit" && e.stufe === 2){
            e.stufe = 3;
            if(e.label) e.label = STUFEN_LISTEN.mitarbeit[3];
          }
        });
      }
      /* Ab Stand 5 tragen die Arbeiten eine eigene Nummer. */
      if((sub.stufenStand || 0) < 5) arbeitsNummernNachziehen(sub);
      sub.stufenStand = STUFEN_STAND;
    }
    if(!Array.isArray(sub.stufenZaehlt)) sub.stufenZaehlt = [];
    if(!Array.isArray(sub.stufenBonus)) sub.stufenBonus = [];
    if(typeof sub.bonusMax !== "number") sub.bonusMax = BONUS_MAX_VORGABE;
    if(!sub.stufenTexte || typeof sub.stufenTexte !== "object") sub.stufenTexte = {};
    if(!sub.stufenWerte || typeof sub.stufenWerte !== "object") sub.stufenWerte = {};
    sub.entries.forEach(e => {
      if(!e.id) e.id = uid();
      /* Zeitstempel wird für das Zusammenführen zweier Geräte gebraucht.
         Ältere Einträge ohne Stempel bekommen 0 und verlieren damit nie
         gegen eine neuere Fassung desselben Eintrags. */
      if(typeof e.ts !== "number") e.ts = 0;
      /* Semester einmalig aus dem Datum ableiten, danach bleibt es fest */
      if(e.sem !== 1 && e.sem !== 2) e.sem = semesterAusDatum(e.date);
    });
  });
  return cls;
}

/* Grundeinstellungen der App, unabhängig von den Klassen */
function defaultSettings(){
  return { lehrkraft: "", schuljahr: "", lastBackup: null, intervallTage: 7, geraet: "", semester: semesterHeute(), schrift: "normal" };
}

function normaliseSettings(s){
  const d = defaultSettings();
  if(!s || typeof s !== "object") return d;
  return {
    lehrkraft: typeof s.lehrkraft === "string" ? s.lehrkraft : d.lehrkraft,
    schuljahr: typeof s.schuljahr === "string" ? s.schuljahr : d.schuljahr,
    lastBackup: typeof s.lastBackup === "string" ? s.lastBackup : null,
    intervallTage: typeof s.intervallTage === "number" && s.intervallTage > 0 ? s.intervallTage : 7,
    geraet: typeof s.geraet === "string" ? s.geraet : "",
    semester: (s.semester === 1 || s.semester === 2 || s.semester === "alle") ? s.semester : semesterHeute(),
    schrift: (s.schrift === "klein" || s.schrift === "gross") ? s.schrift : "normal"
  };
}

function migrate(data){
  const list = Array.isArray(data.classes) ? data.classes : [];
  const einst = normaliseSettings(data.settings);
  const schonNeu = list.every(c => Array.isArray(c.subjects));
  if(schonNeu){
    list.forEach(normaliseClass);
    return { classes: list, settings: einst };
  }

  /* Alter Stand: je Fach eine eigene Klasse mit eigener Namensliste.
     Gleiche Klassenbezeichnung bedeutet dieselbe Klasse, die Namen werden
     über den Namen zusammengeführt. Es geht dabei kein Eintrag verloren. */
  const byName = new Map();
  list.forEach(alt => {
    const name = String(alt.klasse || "Klasse").trim();
    const schluessel = name.toLowerCase();
    let cls = byName.get(schluessel);
    if(!cls){
      cls = { id: uid(), name: name, stufe: (alt.stufe === 1 || alt.stufe === 2) ? alt.stufe : stufeFromKlasse(name), students: [], subjects: [] };
      byName.set(schluessel, cls);
    }
    const modus = alt.weightMode === "prozent" ? "prozent" : "multiplikator";
    const cats = (Array.isArray(alt.cats) && alt.cats.length) ? alt.cats.slice() : DEFAULT_CATS.slice();
    const weights = Object.assign({}, alt.weights || {});
    cats.forEach(k => {
      if(typeof weights[k] !== "number") weights[k] = (modus === "prozent") ? Math.round(100 / cats.length) : 1;
    });
    const sub = {
      id: uid(),
      fach: String(alt.fach || "Fach"),
      template: alt.template || "allgemein",
      weightMode: modus,
      cats: cats,
      weights: weights,
      competencies: Array.isArray(alt.competencies) ? alt.competencies.slice() : defaultCompetencies(alt.fach),
      entries: []
    };
    (alt.students || []).forEach(as => {
      const nm = String(as.name || "").trim();
      let st = cls.students.find(x => x.name.toLowerCase() === nm.toLowerCase());
      if(!st){
        st = { id: as.id || uid(), name: nm, niveau: as.niveau === "standard" ? "standard" : "ahs" };
        cls.students.push(st);
      }
      (as.entries || []).forEach(e => {
        const kopie = Object.assign({}, e);
        kopie.studentId = st.id;
        if(!kopie.id) kopie.id = uid();
        sub.entries.push(kopie);
      });
    });
    cls.subjects.push(sub);
  });
  const classes = Array.from(byName.values());
  classes.forEach(normaliseClass);
  return { classes: classes, settings: einst };
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(data && Array.isArray(data.classes)) return migrate(data);
    }
  }catch(e){}
  return { classes: [], settings: defaultSettings() };
}

/* Der zuletzt erfolgreich gespeicherte Stand, als Text. Wird gebraucht, um
   nach einem gescheiterten Speichern zurückzurollen. */
let letzterGuterStand = null;

/* Speichern und ehrlich bleiben.

   Der frühere Weg hat bei vollem Speicher zwar gemeldet, dass es nicht
   geklappt hat, den Eintrag aber im Programm stehen lassen. Auf dem
   Bildschirm war er da, im Speicher nicht, und nach dem nächsten Öffnen
   war er weg. Deshalb wird der Stand jetzt zurückgerollt: Was du siehst,
   ist das, was wirklich gespeichert ist. */
function save(){
  const text = JSON.stringify({ version: 4, classes: state.classes, settings: state.settings });
  try{
    localStorage.setItem(STORAGE_KEY, text);
    letzterGuterStand = text;
    return true;
  }catch(e){
    let hergestellt = false;
    if(letzterGuterStand){
      try{
        const alt = JSON.parse(letzterGuterStand);
        state.classes = alt.classes;
        state.settings = alt.settings;
        hergestellt = true;
      }catch(e2){}
    }
    alert("Der Speicher dieses Geräts ist voll.\n\n" +
      (hergestellt ? "Der letzte Eintrag wurde deshalb NICHT übernommen und ist wieder verschwunden.\n\n" : "") +
      "Fotos brauchen den meisten Platz. So schaffst du Luft:\n" +
      "1. Unter Einstellungen auf Jetzt sichern, damit alles gesichert ist.\n" +
      "2. Alte Fotos in den Schüleransichten löschen.\n\n" +
      "Die Sicherung enthält die Fotos weiterhin.");
    if(hergestellt) render();
    return false;
  }
}

/* Wie voll ist der Speicher? Für den Hinweis in den Einstellungen. */
function speicherStand(){
  let belegt = 0;
  try{
    const t = localStorage.getItem(STORAGE_KEY);
    belegt = t ? t.length : 0;
  }catch(e){ return null; }
  /* Die Obergrenze nennt kein Browser verlässlich. 5 MB ist der Wert, den
     iOS und Android in der Praxis anbieten; lieber vorsichtig rechnen. */
  const grenze = 5 * 1024 * 1024;
  let fotos = 0, fotoBytes = 0;
  state.classes.forEach(c => {
    c.students.forEach(s => { if(s.photo){ fotos++; fotoBytes += s.photo.length; } });
    c.subjects.forEach(sub => sub.entries.forEach(e => {
      if(e.type === "foto" && e.dataUrl){ fotos++; fotoBytes += e.dataUrl.length; }
    }));
  });
  return {
    belegt: belegt, grenze: grenze,
    anteil: Math.min(100, (belegt * 100) / grenze),
    fotos: fotos, fotoBytes: fotoBytes,
    fotoAnteil: belegt ? (fotoBytes * 100) / belegt : 0
  };
}
